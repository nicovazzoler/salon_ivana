# Regenera ARQUITECTURA.md para que el mapa no se desactualice. Un mapa viejo
# es peor que ninguno, porque le creés.
name: Mapa de arquitectura

# Corre sobre los pull requests, no sobre main. Motivo: main está protegido y
# exige PR, así que un push directo del bot sería rechazado. Al actualizar el
# archivo dentro del PR, el mapa entra junto con el cambio que lo volvió viejo,
# y de paso lo ves en el diff antes de mergear.
on:
  pull_request:
    branches: [main]

# Por defecto el workflow sólo puede leer. Acá commitea, así que necesita
# permiso de escritura.
permissions:
  contents: write

jobs:
  mapa:
    name: Regenerar el mapa
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Sin esto, en un pull request GitHub te deja parado en un commit de
          # merge temporal que no pertenece a ninguna rama, y el commit que
          # hacemos más abajo no tendría a dónde ir.
          ref: ${{ github.head_ref }}

      # El script usa sólo la biblioteca estándar de Python: no hay que
      # instalar nada, y por eso este workflow corre en pocos segundos.
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Leer el repo y armar el mapa
        run: python3 herramientas/mapa.py . --escribir

      - name: Commitear sólo si cambió
        run: |
          # --porcelain detecta tanto un archivo modificado como uno nuevo
          # todavía sin trackear. Si está vacío, no hay nada que hacer.
          if [ -z "$(git status --porcelain ARQUITECTURA.md)" ]; then
            echo "El mapa no cambió. No hay nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARQUITECTURA.md
          git commit -m "Actualiza el mapa de arquitectura"
          git push
          # Un push hecho con el token del workflow no vuelve a disparar
          # workflows, así que esto no se puede morder la cola.
