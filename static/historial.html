<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Historial — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  /* Única línea angosta */
  .wrap{ max-width:800px; }

  /* ----- Barra de orden -----
     Va debajo de los filtros y con la etiqueta adelante, para que se lea como
     una frase ("Ordenar por: Fecha") y no se confunda con otro filtro. */
  .orden{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    margin-bottom:var(--sp-3);
  }
  .orden .eti{
    margin-right:2px;
    font-size:var(--fs-xs);
    font-weight:var(--fw-bold);
    text-transform:uppercase;
    letter-spacing:var(--tracking-eti);
    color:var(--text-tenue);
  }
  /* La flecha en tabular para que el botón no cambie de ancho al darla vuelta */
  .orden .flecha{ font-variant-numeric:tabular-nums; }

  /* ----- Período -----
     Mismo gesto que la barra de orden: la etiqueta adelante y las pastillas al
     lado, para que se lea como una frase ("Período: 30 días"). El rango a mano
     va al final, separado, porque es lo que se usa de vez en cuando. */
  .periodo{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    margin-bottom:var(--sp-3);
  }
  .periodo .eti{
    margin-right:2px;
    font-size:var(--fs-xs); font-weight:var(--fw-bold);
    text-transform:uppercase; letter-spacing:var(--tracking-eti);
    color:var(--text-tenue);
  }
  .periodo .rango{ display:flex; align-items:center; gap:4px; margin-left:auto; }
  .periodo .rango input{ padding:5px 8px; font-size:var(--fs-sm); width:auto; }
  .periodo .rango .hasta{ font-size:var(--fs-sm); color:var(--text-tenue); }
  @media (max-width:560px){
    .periodo .rango{ margin-left:0; width:100%; }
    .periodo .rango input{ flex:1; min-width:0; }
  }

  /* Aviso de que la búsqueda se llevó puesto el período elegido. Va pegado a la
     barra de período porque explica por qué se movió sola la pastilla. */
  .nota-periodo{
    margin:-4px 0 var(--sp-3);
    font-size:var(--fs-sm); color:var(--text-marca);
  }

  /* Pie de la lista: "Ver más" o el aviso de que ya está completa */
  .ver-mas{ margin:var(--sp-4) 0 var(--sp-5); text-align:center; }
  .ver-mas button{ padding:10px 22px; }
  .ver-mas .muted{ font-weight:var(--fw-normal); }

  /* Tarjeta de comprobante */
  .comp{ background:var(--bg-card); }
  .comp-head{
    cursor:pointer;
  }
  .comp-head .sub{ margin-top:3px; font-size:var(--fs-lg); color:var(--text); }
  /* Servicio cargado un día después del que se atendió: se marca en bronce y
     más chico, para que se lea sin competir con la fecha del servicio. */
  .comp-head .anotado{ color:var(--text-marca); font-size:var(--fs-sm); }

  /* .comp-datos / .comp-acciones viven en components.css (los comparte con cuenta.html) */

  /* Acá algunas tarjetas suman el botón "Abonar" y otras no. Si el grupo de
     acciones cambia de ancho, el badge de estado queda en otra columna en cada
     renglón. Reservando el ancho, la columna de estado es siempre la misma. */
  @media (min-width:561px){
    .comp-acciones{ min-width:236px; justify-content:flex-end; }
  }
  .comp-datos .badge{ min-width:76px; text-align:center; }

  /* Fila del detalle: concepto ← → monto. Solo adentro del detalle, para no
     pisar los renglones de filtros ni los grupos de botones. */
  .detalle-box .fila{
    justify-content:space-between;
    flex-wrap:nowrap;
    font-size:var(--fs-md);
    margin:4px 0;
  }
  
  .comp-total{
    margin-top:4px;
    font-size:15px;
    font-weight:700;
  }
  .comp-total .fp{        
    font-size:13px;
    font-weight:400;
    color:var(--text-tenue);
  }

  /* Forzar regla */
  /* El número de comprobante es el dato de identidad: bronce, chico y firme */
  .comp-head .num{
    background:none; padding:0;
    color:var(--text-marca);
    font-weight:var(--fw-bold);
  }
  .comp-total{ color:var(--text-titulo); }

  /* Encabezado del detalle: "Detalle" a la izquierda y cuándo se facturó a la
     derecha, en tenue. La hora completa va acá y no en el rótulo de arriba para
     que el renglón de la lista siga entrando de un vistazo. */
  .detalle-cab{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:var(--sp-2);
    font-weight:700; margin-bottom:6px;
  }
  .detalle-cab .cuando{
    font-weight:var(--fw-normal); font-size:var(--fs-sm);
    color:var(--text-tenue); font-variant-numeric:tabular-nums;
  }
  
</style>
</head><body>
<header>
  <span>📜 Historial</span>
  <nav class="menu">
    <a href="/facturar">Facturar</a>
    <a href="/clientes">Clientes</a>
    <a href="/historial">Historial</a>
    <a href="#" onclick="logout();return false;">Salir</a>
  </nav>
</header>
<div class="wrap">
  <div class="seg">
    <button id="tabTicket" class="on">Tickets</button>
    <button id="tabPresu">Presupuestos</button>
  </div>
  <div style="display:flex;gap:8px;margin:10px 0;">
    <input id="filtroCliente" placeholder="Buscar cliente..." style="flex:1;">
    <input id="filtroNum" placeholder="N° serv." style="width:110px;" inputmode="numeric">
  </div>

  <!-- Período. Arranca en el último mes, que es lo que se mira el 99% de las
       veces, pero "Todo" y el rango a mano siguen estando a un toque: poder
       buscar de cualquier fecha y de cualquier año es de las cosas que más se
       usan de esta pantalla. -->
  <div class="periodo" id="periodo">
    <span class="eti">Período</span>
    <button class="pill on" data-p="30">30 días</button>
    <button class="pill" data-p="90">90 días</button>
    <button class="pill" data-p="anio">Este año</button>
    <button class="pill" data-p="todo">Todo</button>
    <span class="rango">
      <input type="date" id="desde" aria-label="Desde">
      <span class="hasta">a</span>
      <input type="date" id="hasta" aria-label="Hasta">
    </span>
  </div>

  <div class="nota-periodo" id="notaPeriodo" style="display:none;"></div>

  <div class="pills" id="filtroEstado">
    <button class="pill on" data-f="todos">Todos</button>
    <button class="pill" data-f="deuda">Con deuda</button>
    <button class="pill" data-f="convertidos">Pasados a ticket</button>
    <button class="pill" data-f="sinconvertir">Sin convertir</button>
    <span id="resumenFiltro" class="muted" style="margin-left:auto;align-self:center;"></span>
  </div>

  <!-- Ordenar. Tocar el que ya está activo da vuelta la dirección. -->
  <div class="orden" id="orden">
    <span class="eti">Ordenar por</span>
    <button class="pill on" data-o="fecha">Fecha</button>
    <button class="pill" data-o="numero">N° de servicio</button>
    <button class="pill" data-o="cliente">Cliente</button>
    <button class="pill" data-o="monto">Monto</button>
  </div>
  <div id="lista"></div>
  <div id="verMas" class="ver-mas"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script src="/static/js/peluquero.js"></script>
<script src="/static/escpos.js"></script>
<script>
requireLogin(); pintarNav();
const $=s=>document.querySelector(s);
const fmt=n=>"$"+(n||0).toLocaleString("es-AR");
let tipo="ticket";
let estadoFiltro="todos";   // todos | deuda | convertidos | sinconvertir

/* Orden. Por defecto fecha de la más nueva a la más vieja: eso es lo que hace
   que esta pantalla sea un historial y no una lista suelta. Ordenar por otra
   cosa es algo que elegís, y con un toque volvés. */
let orden = { campo:"fecha", desc:true };

/* Cada campo arranca en la dirección que uno espera: las fechas y los montos
   de mayor a menor, los nombres de la A a la Z. */
const ORDEN_INICIAL = { fecha:true, numero:true, monto:true, cliente:false };

/* ---------- Período ----------

   El historial de un año son más de mil servicios. Antes se traían TODOS en cada
   apertura de la pantalla —con sus líneas, sus extras y sus pagos— para mostrar
   sesenta: la tablet se quedaba pensando en la primera pantalla, no en el
   "Ver más".

   Ahora se pide una ventana. Arranca en el último mes, que es lo que se mira
   casi siempre, y "Todo" sigue estando a un toque. Lo que NO se recorta nunca es
   la búsqueda: apenas escribís un cliente o un número, el período salta solo a
   "Todo" (y se ve saltar, con la pastilla y un renglón que lo dice), porque
   buscar un servicio de hace dos años es justo para lo que se usa esto. */
let periodo="30";           // 30 | 90 | anio | todo | rango
const POR_TRAMO=60;

let CARGADOS=[];            // los comprobantes que están dibujados
let TOTAL=0;                // cuántos coinciden con los filtros (los dibuje o no)
let TOTAL_SIN_FILTROS=0;
let DEUDA_TOTAL=null;
let pidiendo=false;         // hay una consulta en vuelo (solo frena el "Ver más")
let consulta=0;             // número de la consulta actual, para descartar respuestas viejas

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function numComp(t,n){ return (t==="ticket"?"N-":"P-")+String(n).padStart(5,"0"); }

function isoLocal(d){
  // el input date quiere AAAA-MM-DD en hora local, no el ISO en UTC
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

/* La ventana que se le pide al servidor. Devuelve {} para "Todo": sin desde ni
   hasta, el backend no filtra por fecha. */
function ventana(){
  const hoy = new Date();
  if(periodo === "todo") return {};
  if(periodo === "rango"){
    const d = $("#desde").value, h = $("#hasta").value;
    const w = {};
    if(d) w.desde = d;
    if(h) w.hasta = h;
    return w;
  }
  if(periodo === "anio") return { desde: `${hoy.getFullYear()}-01-01` };
  const dias = parseInt(periodo);
  const atras = new Date(hoy); atras.setDate(atras.getDate() - dias);
  return { desde: isoLocal(atras) };
}

function hayBusqueda(){
  return !!(($("#filtroCliente").value||"").trim() || ($("#filtroNum").value||"").trim());
}

function pintarPeriodo(){
  document.querySelectorAll("#periodo .pill").forEach(b =>
    b.classList.toggle("on", b.dataset.p === periodo));
  const nota = $("#notaPeriodo");
  // El renglón solo aparece cuando la búsqueda movió el período sola: si lo
  // pusiste vos en "Todo", no hay nada que explicar.
  const explicar = hayBusqueda() && periodo === "todo";
  nota.style.display = explicar ? "" : "none";
  if(explicar) nota.textContent = "Buscando en todo el historial. Tocá un período para acotarlo.";
}

/* ---------- Traer una página ----------

   `reiniciar` distingue las dos formas de pedir: cambiar un filtro (se vuelve a
   empezar de cero) y "Ver más" (se agrega abajo, sin tocar lo que ya está
   dibujado, así el detalle que tengas abierto se queda abierto).

   Cada pedido lleva número. Si escribís rápido y salen tres consultas, la que
   llega tarde con datos viejos se descarta en vez de pisar a la buena. */
async function traer(reiniciar){
  /* Un pedido nuevo PISA al que esté en vuelo; solo se frena el "Ver más".

     Al principio esto frenaba cualquier pedido mientras hubiera otro en curso, y
     estaba mal: si tocabas dos filtros seguidos —poner el "desde" y después el
     "hasta"— el segundo se descartaba sin decir nada y la pantalla te mostraba
     el resultado del primero mientras los dos campos decían otra cosa. Peor que
     lento: mentiroso.

     Ahora cada pedido lleva número y la respuesta que llega tarde se tira. Lo
     único que sí se frena es traer la página siguiente, porque ahí dos clicks
     seguidos en "Ver más" pedirían dos veces el mismo tramo y se verían
     duplicados. */
  if(pidiendo && !reiniciar) return;
  pidiendo = true;
  const mio = ++consulta;
  const desdeFila = reiniciar ? 0 : CARGADOS.length;

  const p = new URLSearchParams({
    tipo, estado: estadoFiltro, orden: orden.campo,
    desc: orden.desc ? "true" : "false",
    limite: POR_TRAMO, offset: desdeFila,
  });
  const w = ventana();
  if(w.desde) p.set("desde", w.desde);
  if(w.hasta) p.set("hasta", w.hasta);
  const cli = ($("#filtroCliente").value||"").trim();
  const num = ($("#filtroNum").value||"").trim();
  if(cli) p.set("q", cli);
  if(num) p.set("numero", num);

  $("#verMas").innerHTML = '<span class="muted">Buscando…</span>';
  try{
    const r = await authFetch("/api/comprobantes?" + p.toString());
    if(mio !== consulta) return;              // llegó tarde: ya hay otra consulta
    if(!r.ok){ $("#verMas").innerHTML = '<span class="muted">No se pudo cargar.</span>'; return; }
    const d = await r.json();
    TOTAL = d.total; TOTAL_SIN_FILTROS = d.total_sin_filtros; DEUDA_TOTAL = d.deuda_total;
    CARGADOS = reiniciar ? d.comprobantes : CARGADOS.concat(d.comprobantes);
    pintar(reiniciar ? [] : d.comprobantes, reiniciar);
  } catch(e){
    // Sin esto, cualquier error dejaba el pie diciendo "Buscando…" para siempre
    // y la pantalla parecía colgada. En el local eso es un llamado por teléfono.
    if(mio === consulta) $("#verMas").innerHTML = '<span class="muted">No se pudo cargar. Probá de nuevo.</span>';
    throw e;
  } finally {
    if(mio === consulta) pidiendo = false;
  }
}

/* Dibuja. Si `reiniciar`, rehace la lista entera; si no, agrega la tanda nueva
   al final y no toca nada de lo que ya estaba. */
function pintar(tanda, reiniciar){
  const cont = $("#lista");
  if(reiniciar){
    cont.innerHTML = "";
    const frag = document.createDocumentFragment();
    CARGADOS.forEach(c => frag.appendChild(crearFila(c)));
    cont.appendChild(frag);
  } else {
    const frag = document.createDocumentFragment();
    tanda.forEach(c => frag.appendChild(crearFila(c)));
    cont.appendChild(frag);
  }

  if(CARGADOS.length === 0){
    const porQue = estadoFiltro==="deuda" ? "con deuda"
                 : estadoFiltro==="convertidos" ? "pasados a ticket"
                 : estadoFiltro==="sinconvertir" ? "sin convertir" : "";
    const acotado = periodo !== "todo" ? " en este período" : "";
    cont.innerHTML = `<p class="muted">No hay ${tipo==="ticket"?"tickets":"presupuestos"} ${porQue}${acotado} para mostrar.`
      + (periodo !== "todo" ? ` <a href="#" id="verTodo">Buscar en todo el historial</a>.` : "") + `</p>`;
    const a = $("#verTodo");
    // Se limpian también las fechas: si no, la pastilla queda en "Todo" y los dos
    // campos siguen mostrando el rango que acaba de quedar sin resultados.
    if(a) a.onclick = e => {
      e.preventDefault();
      periodo="todo"; $("#desde").value=""; $("#hasta").value="";
      pintarPeriodo(); traer(true);
    };
  }

  pintarResumen();
  pintarVerMas();
}

function pintarResumen(){
  const caja = $("#resumenFiltro");
  if(estadoFiltro === "deuda"){
    caja.textContent = TOTAL ? `${TOTAL} con deuda · ${fmt(DEUDA_TOTAL||0)}` : "";
  } else {
    caja.textContent = TOTAL !== TOTAL_SIN_FILTROS ? `${TOTAL} de ${TOTAL_SIN_FILTROS}` : `${TOTAL}`;
  }
}

function pintarVerMas(){
  const quedan = TOTAL - CARGADOS.length;
  $("#verMas").innerHTML = quedan > 0
    ? `<button class="b-out" id="btnVerMas">Ver ${Math.min(quedan, POR_TRAMO)} más
         <span class="muted">· quedan ${quedan}</span></button>`
    : (CARGADOS.length > POR_TRAMO ? `<span class="muted">Ya está toda la lista (${TOTAL}).</span>` : "");
  const b = $("#btnVerMas");
  if(b) b.onclick = () => traer(false);
}

/* Fecha y hora de facturación.

   La hora es el dato que faltaba para reconocer un ticket entre los cinco del
   mismo cliente en el mismo día. Sale del mismo campo que el papel impreso.

   La "Z" no es un detalle: el backend guarda UTC sin marcar la zona, y sin ella
   el navegador lee "2026-09-07T23:40" como hora local argentina. La fecha salía
   corrida para todo lo facturado después de las 21:00 (que en UTC ya es el día
   siguiente) y la hora habría salido tres horas adelantada siempre. Es el mismo
   truco que usa escpos.js para el papel.

   Ojo con los servicios anotados de otro día: ahí `fecha` no es un momento sino
   un día, y el backend le pone las 12:00 para que caiga en la caja correcta.
   Mostrar "12:00" sería inventar una hora de atención, así que en esos va la
   fecha sola y la aclaración de cuándo se anotó, que ya estaba. */
function fechaHora(comp){
  const iso = comp.fecha.endsWith("Z") ? comp.fecha : comp.fecha + "Z";
  const d = new Date(iso);
  const dia = d.toLocaleDateString("es-AR");
  if(comp.anotado_despues) return dia;
  return dia + " " + d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false});
}

function crearFila(comp){
    const div=document.createElement("div"); div.className="comp";
    const fecha=fechaHora(comp);
    const quien=comp.cliente_nombre||"Mostrador";
    const pendiente = (comp.tipo==="ticket" && comp.saldo>0)
      ? ` · <span style="color:var(--warn);">Pendiente ${fmt(comp.saldo)}</span>`
      : "";
    const formas = { efectivo:"Efectivo", transfer:"Transferencia", mixto:"Mixto", cuenta:"A cuenta" };
    const formaTxt = formas[comp.forma_origen] || comp.forma_origen;
    /* Un servicio de otro día se marca acá: la fecha que se lista es la del
       servicio, así que sin esta aclaración parecería cargado ese mismo día. */
    const anotado = comp.anotado_despues
      ? ` · <span class="anotado">anotado el ${new Date(comp.anotado_despues+"Z").toLocaleDateString("es-AR")}</span>`
      : "";
    div.innerHTML=`
      <div class="comp-head">
        <div class="comp-datos">
          <div>
            <div class="sub">${fecha} · <span class="num">${numComp(comp.tipo,comp.numero)}</span> · ${titulo(quien)}${anotado}</div>
            <div class="comp-total">${fmt(comp.ingresado + comp.saldo)} <span class="fp">· ${formaTxt}</span></div>
          </div>
          <span class="badge ${comp.estado}">${comp.estado}</span>
        </div>
        <div class="comp-acciones">
        ${(comp.tipo==="ticket" && comp.saldo>0 && comp.cliente_id)
          ? `<a class="btnAbonar" href="/cuenta?id=${comp.cliente_id}&comp=${comp.id}">Abonar 💵</a>` : ''}
        <a class="btnAbonar btn-icono btnPrint" href="/ticket?id=${comp.id}" title="Imprimir ticket">🖨️</a>
        <button class="btnAnular b-del" data-id="${comp.id}">Anular</button>
        </div>
      </div>
       <div class="detalle-box" style="display:none;"></div>
      ${comp.tipo==="presupuesto"
        ? (comp.convertido_a
            ? `<div class="muted" style="margin-top:8px;">Convertido → N-${String(comp.convertido_a).padStart(5,"0")}</div>`
            : `<button class="btnConv" style="margin-top:8px;">Convertir a ticket</button>`)
        : ""}`;
    const head=div.querySelector(".comp-head");
    const box=div.querySelector(".detalle-box");
    head.onclick=async()=>{
      if(box.style.display==="block"){ box.style.display="none"; return; }
      const d=await (await authFetch("/api/comprobantes/"+comp.id)).json();
      const esPresu = d.tipo==="presupuesto";
      const {pu, pe, hayAjuste, textoAjuste} = EscPos;
      // el ajuste de cada línea se aclara abajo del renglón (en % o en pesos)
      const ajuste = l => hayAjuste(l)
        ? `<div class="fila" style="color:var(--text-tenue);font-size:12px;padding-left:10px;">
             <span>↳ ${textoAjuste(l)}</span>
             <span>${fmt(l.precio_unit)} → ${fmt(pu(l))} c/u</span></div>` : "";
      // En presupuesto se muestran las dos listas por línea (transfer y efectivo)
      const lineas=d.lineas.map(l=>
        `<div class="fila"><span>${l.cantidad}× ${l.nombre}${l.dificultad?' (dif)':''}</span>`+
        (esPresu
          ? `<span style="white-space:nowrap;">${fmt(pu(l)*l.cantidad)} <span style="color:var(--text-tenue);font-size:11px;">/ desc. ${fmt(pe(l)*l.cantidad)}</span></span>`
          : `<span>${fmt(pu(l)*l.cantidad)}</span>`)
        +`</div>` + ajuste(l)
      ).join("");

      // Descuento en efectivo: la diferencia entre listas (solo si el comprobante es efectivo)
      const pctEf = d.desc_efectivo>0 ? (d.desc_efectivo / d.total_transfer * 100).toFixed(2) : 0;
      const filaDescEf=d.desc_efectivo>0
        ? `<div class="fila" style="color:var(--text-tenue);"><span>Descuento ${pctEf}%</span><span>−${fmt(d.desc_efectivo)}</span></div>` : "";

      // Subtotal: solo tiene sentido mostrarlo si hubo descuento efectivo (sino es igual al de arriba)
      const filaSubtotal= d.desc_jubilado>0
        ? `<div class="fila" style="border-top:1px solid var(--border);padding-top:6px;"><span>Subtotal</span><span>${fmt(d.subtotal)}</span></div>` : "";

      // Descuento de listado (jubilado)
      const filaDescJub=d.desc_jubilado>0
        ? `<div class="fila" style="color:var(--text-tenue);"><span>${d.descuento_nombre||'Descuento'} ${d.descuento_pct}%</span><span>−${fmt(d.desc_jubilado)}</span></div>` : "";

      const extra=d.extra_dificultad>0
        ? `<div class="fila" style="color:var(--text-tenue);"><span>Extra dificultad</span><span>+${fmt(d.extra_dificultad)}</span></div>` : "";

      const pagos=d.pagos.length
        ? d.pagos.map(p=>{const f=new Date(p.fecha.endsWith("Z")?p.fecha:p.fecha+"Z").toLocaleDateString("es-AR");
            return `<div class="fila" style="color:var(--text-tenue);"><span>✓ ${f} · ${p.forma_pago}${p.alias?' ('+p.alias+')':''}</span><span>${fmt(p.monto)}</span></div>`;
          }).join("")
        : (d.tipo==="ticket"?'<div class="muted">Sin pagos.</div>':'');
      // Descuento efectivo real: suma de lo que se descontó en cada pago
      const descEfvoReal = d.pagos.reduce((a,p)=> a + (p.desc_aplicado || 0), 0);
      const pctEfvoReal = descEfvoReal>0 ? (descEfvoReal / d.total_final * 100).toFixed(2) : 0;
      const filaDescEfvoReal = descEfvoReal>0
        ? `<div class="fila" style="color:var(--warn);"><span>Descuento ${pctEfvoReal}%</span><span>−${fmt(descEfvoReal)}</span></div>` : "";
      const filaPendiente = d.saldo > 0
        ? `<div class="fila fila-desc"><span>Pendiente</span><span>${fmt(d.saldo)}</span></div>` : "";

      let totales;
      if(esPresu){
        // Presupuesto: total por cada lista (con el descuento de catálogo aplicado a ambas)
        const ex=d.extra_dificultad||0;
        let totTr=d.lineas.reduce((a,l)=>a+pu(l)*l.cantidad,0)+ex;
        let totEf=d.lineas.reduce((a,l)=>a+pe(l)*l.cantidad,0)+ex;
        if(d.descuento_pct>0){
          totTr=Math.round(totTr*(100-d.descuento_pct)/100);
          totEf=Math.round(totEf*(100-d.descuento_pct)/100);
        }
        const filaDescPresu = d.descuento_pct>0
          ? `<div class="fila" style="color:var(--text-tenue);"><span>${d.descuento_nombre||'Descuento'} ${d.descuento_pct}%</span><span>aplicado</span></div>` : "";
        totales=`${filaDescPresu}
          <div class="fila fila-total"><span>Total lista</span><span>${fmt(totTr)}</span></div>
          <div class="fila fila-total"><span>Total con descuento</span><span>${fmt(totEf)}</span></div>`;
      } else {
        totales=`<div class="fila fila-total"><span>Total</span><span>${fmt(d.ingresado + d.saldo)}</span></div>`;
      }

      box.innerHTML=`<div class="detalle-cab">Detalle
          <span class="cuando">${fechaHora(d)}</span></div>
        ${lineas}${extra}${esPresu?'':filaDescEf+filaSubtotal+filaDescEfvoReal+filaDescJub}
        ${totales}
        ${d.tipo==="ticket"?`<div style="font-weight:700;margin:10px 0 6px;">Pagos</div>${pagos}${filaPendiente}`:''}
        ${d.tipo==="ticket"?`<div class="quien-atendio"></div>`:''}
        <a class="btnAbonar" href="/ticket?id=${d.id}" style="margin-top:10px;">🖨️ Imprimir</a>`;
      // Acá se completa quién atendió: es la única pantalla donde aparece un
      // ticket de mostrador, que no tiene cuenta de cliente adónde ir a buscarlo.
      pintarPeluquero(box.querySelector(".quien-atendio"), d);
      box.style.display="block";
    };
    div.querySelector(".btnPrint").onclick = e=>e.stopPropagation();   // que no despliegue el detalle
    div.querySelector(".btnAnular").onclick = async (e)=>{
      e.stopPropagation();
      if(!confirm("¿Anular este servicio?")) return;
      const r = await authFetch("/api/comprobantes/"+comp.id, {method:"DELETE"});
      if(r.ok){ toast("Servicio anulado"); traer(true); }
      else { toast("No se pudo anular"); }
    };
    if(comp.tipo==="presupuesto" && !comp.convertido_a){
      div.querySelector(".btnConv").onclick=async(e)=>{
        e.stopPropagation();
        if(!confirm("¿Convertir este presupuesto en ticket? Se crea un ticket nuevo con los mismos ítems.")) return;
        const r=await authFetch("/api/comprobantes/"+comp.id+"/convertir",{method:"POST"});
        if(!r.ok){ const er=await r.json(); toast(er.detail||"No se pudo"); return; }
        const d=await r.json();
        toast("Convertido a N-"+String(d.numero).padStart(5,"0"));
        traer(true);
      };
    }
    return div;
}
    
/* "Con deuda" solo tiene sentido en tickets; "pasados a ticket" / "sin convertir",
   solo en presupuestos. Se muestran los que aplican a la pestaña abierta. */
function ajustarFiltros(){
  const paraTicket = ["todos","deuda"];
  const paraPresu  = ["todos","convertidos","sinconvertir"];
  const validos = tipo==="ticket" ? paraTicket : paraPresu;
  document.querySelectorAll("#filtroEstado .pill").forEach(b=>{
    b.style.display = validos.includes(b.dataset.f) ? "" : "none";
  });
  if(!validos.includes(estadoFiltro)){          // el filtro activo ya no aplica
    estadoFiltro = "todos";
    document.querySelectorAll("#filtroEstado .pill").forEach(x=>x.classList.toggle("on", x.dataset.f==="todos"));
  }
}

$("#tabTicket").onclick=()=>{ tipo="ticket"; $("#tabTicket").classList.add("on"); $("#tabPresu").classList.remove("on"); ajustarFiltros(); traer(true); };
$("#tabPresu").onclick=()=>{ tipo="presupuesto"; $("#tabPresu").classList.add("on"); $("#tabTicket").classList.remove("on"); ajustarFiltros(); traer(true); };

/* Ahora cada tecla es una consulta al servidor, así que se espera a que la
   persona termine de tipear. Un cuarto de segundo alcanza para no mandar una
   consulta por letra y no se siente como una demora. */
let tecleando=null;
function buscarDespacio(){
  // Buscar mira SIEMPRE el historial entero: el período se corre solo a "Todo"
  // y se ve que se corrió. Si borrás la búsqueda, se queda en "Todo": volver al
  // último mes sin avisar te escondería lo que acabás de encontrar.
  if(hayBusqueda() && periodo !== "todo"){ periodo = "todo"; }
  pintarPeriodo();
  clearTimeout(tecleando);
  tecleando = setTimeout(() => traer(true), 250);
}
$("#filtroCliente").oninput = buscarDespacio;
$("#filtroNum").oninput = buscarDespacio;

document.querySelectorAll("#periodo .pill").forEach(b=>{
  b.onclick=()=>{
    periodo = b.dataset.p;
    $("#desde").value = ""; $("#hasta").value = "";
    pintarPeriodo(); traer(true);
  };
});

/* Poner una fecha a mano es elegir el rango: las pastillas se apagan solas. */
["#desde","#hasta"].forEach(sel=>{
  $(sel).onchange = () => {
    periodo = ($("#desde").value || $("#hasta").value) ? "rango" : "todo";
    pintarPeriodo(); traer(true);
  };
});

document.querySelectorAll("#filtroEstado .pill").forEach(b=>{
  b.onclick=()=>{
    estadoFiltro=b.dataset.f;
    document.querySelectorAll("#filtroEstado .pill").forEach(x=>x.classList.toggle("on", x===b));
    traer(true);
  };
});

/* Tocar un criterio nuevo lo activa en su dirección natural; tocar el que ya
   está activo la da vuelta. El orden lo resuelve el servidor: ordenar solo lo
   que está dibujado dejaría el más caro de la primera página arriba, no el más
   caro de todos. */
document.querySelectorAll("#orden .pill").forEach(b=>{
  b.onclick=()=>{
    const campo = b.dataset.o;
    orden = (orden.campo === campo)
      ? { campo, desc: !orden.desc }
      : { campo, desc: ORDEN_INICIAL[campo] };
    pintarOrden();
    traer(true);
  };
});

/* La flecha va solo en el criterio activo: apunta para abajo cuando ordena de
   mayor a menor (o de la Z a la A). */
function pintarOrden(){
  document.querySelectorAll("#orden .pill").forEach(b=>{
    const activo = b.dataset.o === orden.campo;
    b.classList.toggle("on", activo);
    const flecha = b.querySelector(".flecha");
    if(flecha) flecha.remove();
    if(activo){
      const s = document.createElement("span");
      s.className = "flecha";
      s.textContent = orden.desc ? " ↓" : " ↑";
      b.appendChild(s);
    }
    b.title = activo ? "Tocá de nuevo para dar vuelta el orden" : "";
  });
}

pintarOrden();
pintarPeriodo();
ajustarFiltros();
traer(true);
</script>
</body></html>
