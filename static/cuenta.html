<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f1f1f"><title>Cuenta del cliente — Peluquería</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  /* ===== SOLO lo propio de la Cuenta del cliente ===== */

  .wrap{ max-width:800px; }

  /* Cabecera: avatar + datos + saldo */
  .cli-head{ display:flex; align-items:center; gap:14px; }
  .cli-head .av{
    width:48px; height:48px;
    border-radius:50%;
    background:var(--oro-100);
    color:var(--gris-900);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:var(--fw-strong);
  }
  .saldo-box{ margin-left:auto; text-align:right; }
  .saldo-box .lbl{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .saldo-box .val{ font-size:26px; font-weight:var(--fw-black); }

  /* Zonas separadas por línea punteada */
  .abonar-box{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .editar-box{ display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
  .acciones{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--border); }

  /* Formulario de edición del cliente */
  .grid-campos{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:10px;
    margin-bottom:var(--sp-3);
  }
  .campo label{ font-weight:var(--fw-bold); }
  .campo.ancho{ grid-column:1 / -1; }

  .fila{
    justify-content:space-between;
    flex-wrap:nowrap;
    font-size:var(--fs-md);
    margin:4px 0;
  }

    .comp-total{
    margin-top:4px;
    font-size:17px;
    font-weight:700;
  }
  .comp-total .fp{        
    font-size:17px;
    font-weight:400;
    color:var(--text-tenue);
  }

  .comp-head .num{
    background:none;
    padding:0;
    color:var(--text-marca);
    font-size: 17px;
    font-weight:700;
  }
</style>
</head><body>
<header>
  <span>📋 Cuenta del cliente</span>
  <nav class="menu">
    <a href="/clientes">← Clientes</a>
    <a href="/facturar">Facturar</a>
    <a href="#" onclick="logout();return false;">Salir</a>
  </nav>
</header>
<div class="wrap">
  <div class="card" id="cabecera"></div>
  <div id="turno"></div>
  <div id="lista"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script>
requireLogin(); pintarNav();
const $=s=>document.querySelector(s);
const fmt=n=>"$"+(n||0).toLocaleString("es-AR");
const id=new URLSearchParams(location.search).get("id");
const ORIGEN = { efectivo:"Efectivo", transfer:"Transferencia", cuenta:"A cuenta", mixto:"Mixto" };
let FORMAS=[], ALIAS=[];

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function numTicket(n){ return "A-"+String(n).padStart(5,"0"); }
function parseISO2(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }

async function cargar(){
  if(!id){ $("#cabecera").innerHTML='<p class="muted">Falta el cliente.</p>'; return; }
  const cfg=await (await authFetch("/api/config")).json();
  FORMAS=cfg.formas_pago||[]; ALIAS=cfg.alias||[];
  const resp=await authFetch("/api/clientes/"+id+"/cuenta");
  if(!resp.ok){
    $("#cabecera").innerHTML='<p class="muted">No se pudo cargar el cliente. Puede que haya sido eliminado. <a href="/clientes">Volver a clientes</a>.</p>';
    return;
  }
  const data=await resp.json();
  const c=data.cliente;
  const inicial=c.nombre.trim()[0]?.toUpperCase()||"?";
  $("#cabecera").innerHTML=`
    <div class="cli-head">
      <div class="av">${inicial}</div>
      <div>
        <div style="font-size:18px;font-weight:700;">${titulo(c.nombre)}</div>
        <div class="muted">${[c.telefono, c.alias].filter(Boolean).join(" · ") || "—"}</div>
        <div class="muted">${[c.dni && "DNI "+c.dni, c.direccion].filter(Boolean).join(" · ") || "—"}</div>
      </div>
      <div class="saldo-box">
        <div class="lbl">Saldo adeudado</div>
        <div class="val" style="color:${data.saldo_total>0?'var(--danger)':'var(--acento)'};">${fmt(data.saldo_total)}</div>
        <button style="margin-top:8px;background:var(--acento);" onclick="location.href='/facturar?cliente=${encodeURIComponent(c.nombre)}'">+ Facturar</button>
      </div>
    </div>
    <div class="fila acciones">
      <button class="b-out" id="btnEditar">✏️ Editar datos</button>
      ${getRol()==="dueno" ? '<button class="b-del" id="btnEliminar">🗑️ Eliminar</button>' : ''}
    </div>
    <div class="editar-box" id="editarBox">
      <div class="grid-campos">
        <div class="campo"><label>Nombre</label><input id="eNombre"></div>
        <div class="campo"><label>Teléfono</label><input id="eTelefono"></div>
        <div class="campo"><label>Alias</label><input id="eAlias"></div>
        <div class="campo"><label>DNI</label><input id="eDni"></div>
        <div class="campo ancho"><label>Dirección</label><input id="eDireccion"></div>
        <div class="campo ancho"><label>Notas</label><input id="eNotas"></div>
      </div>
      <div class="fila">
        <button class="b-ok" id="btnGuardar">Guardar cambios</button>
        <button class="b-out" id="btnCancelar">Cancelar</button>
      </div>
    </div>`;

  const editBox=$("#editarBox");
  function llenarForm(){
    $("#eNombre").value    = c.nombre    || "";
    $("#eTelefono").value  = c.telefono  || "";
    $("#eAlias").value     = c.alias     || "";
    $("#eDni").value       = c.dni       || "";
    $("#eDireccion").value = c.direccion || "";
    $("#eNotas").value     = c.notas     || "";
  }
  $("#btnEditar").onclick=()=>{
    if(editBox.style.display==="block"){ editBox.style.display="none"; return; }
    llenarForm();
    editBox.style.display="block";
  };
  $("#btnCancelar").onclick=()=>{ editBox.style.display="none"; };
  $("#btnGuardar").onclick=async()=>{
    const nombre=$("#eNombre").value.trim();
    if(!nombre){ toast("El nombre no puede quedar vacío"); return; }
    const body={
      nombre,
      telefono:  $("#eTelefono").value.trim(),
      alias:     $("#eAlias").value.trim(),
      dni:       $("#eDni").value.trim(),
      direccion: $("#eDireccion").value.trim(),
      notas:     $("#eNotas").value.trim()
    };
    const btn=$("#btnGuardar"); btn.disabled=true;
    const r=await authFetch("/api/clientes/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    btn.disabled=false;
    if(!r.ok){ const e=await r.json(); toast(e.detail||"No se pudo guardar"); return; }
    toast("Datos actualizados");
    cargar();
  };
  
if($("#btnEliminar")) $("#btnEliminar").onclick=async()=>{
    if(data.saldo_total<=0){
      if(!confirm(`¿Eliminar a ${c.nombre}?\n\nSus tickets quedan en el historial.`)) return;
    }
    const btn=$("#btnEliminar"); btn.disabled=true;
    const r=await authFetch("/api/clientes/"+id,{method:"DELETE"});
    if(!r.ok){ btn.disabled=false; const e=await r.json(); toast(e.detail||"No se pudo eliminar"); return; }
    location.href="/clientes";
  };
    // próximo turno
  $("#turno").innerHTML="";
  try{
    const pt=await (await authFetch("/api/clientes/"+id+"/proximo-turno")).json();
    if(pt.turno){
      const f=parseISO2(pt.turno.fecha);
      const cuando = pt.turno.es_hoy ? "Hoy" : f.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
      const box=document.createElement("div"); box.className="card";
      box.style.cssText="background:#2c3a4a;color:#dbe7f2;border:none;";
      box.innerHTML=`📅 <b>Próximo turno:</b> ${cuando} ${pt.turno.hora} · ${pt.turno.servicio}`;
      $("#turno").appendChild(box);
    }
  }catch(e){}

  const cont=$("#lista"); cont.innerHTML="";
  if(data.comprobantes.length===0){ cont.innerHTML='<p class="muted">Este cliente no tiene tickets todavía.</p>'; return; }
  data.comprobantes.forEach(comp=>{
    const div=document.createElement("div"); div.className="comp card";
    const fecha=new Date(comp.fecha).toLocaleDateString("es-AR");
    const efvoTodo = comp.desc_efectivo>0 ? comp.saldo : Math.ceil(comp.saldo * 0.9/100)*100;
    div.innerHTML=`
      <div class="comp-head">
        <div>
          <div class="sub">${fecha} · <span class="num">${numTicket(comp.numero)}</span></div>
          <div class="comp-total">${fmt(comp.ingresado + comp.saldo)} <span class="fp">· ${ORIGEN[comp.forma_origen]||comp.forma_origen}${comp.forma_pago!==ORIGEN[comp.forma_origen]?` → ${comp.forma_pago}`:''}</span></div>
        </div>
        <span class="badge ${comp.estado}">${comp.estado}</span>
        <button class="btnAnular b-del" data-id="${comp.id}">Anular</button>
      </div>
      <div class="comp-sub">Total ${fmt(comp.total_final)} · Pagado ${fmt(comp.pagado)} · Saldo <b>${fmt(comp.saldo)}</b></div>
      <button class="btnDetalle b-out" style="margin-top:8px;">Ver detalle</button>
      <div class="detalle-box" style="display:none;"></div>
      ${comp.saldo>0?`<button class="btnAbrir btnAbonar" style="margin-top:10px;">Registrar pago 💵</button>
      <div class="abonar-box">
        <div class="fila">
          <select class="aForma">${comp.desc_efectivo>0
            ? `<option value="Efectivo" selected>Efectivo</option>`
            : `<option value="" selected>Elegí forma…</option>${FORMAS.map(f=>`<option>${f}</option>`).join("")}`}</select>
          <input class="aMonto" type="number" placeholder="Monto" style="width:110px;">
          <button class="aOk">Registrar</button>
        </div>
        <div class="muted" style="margin-top:6px;font-size:12px;">Debe ${fmt(comp.saldo)}${comp.desc_efectivo===0 ? ` · con ${fmt(efvoTodo)} en efectivo salda todo` : ''}</div>
        <div class="fila aAliasBox" style="display:none;margin-top:8px;">
          <label class="muted">Alias:</label>
          <input class="aAlias" list="aliasDL" placeholder="¿A qué cuenta?" style="flex:1;">
        </div>
      </div>`:''}`;
    if(comp.saldo>0){
      const box=div.querySelector(".abonar-box");
      div.querySelector(".btnAbrir").onclick=(e)=>{
        box.style.display = "block";
        e.currentTarget.disabled = true;
      };
      const forma=div.querySelector(".aForma");
      const inp=div.querySelector(".aMonto"), btnOk=div.querySelector(".aOk");
      function refrescarForma(){
        const elegida = forma.value !== "";
        inp.disabled = !elegida;
        btnOk.disabled = forma.value === "";
        div.querySelector(".aAliasBox").style.display = forma.value==="Transferencia"?"flex":"none";
        if(!elegida){ inp.value = ""; return; }                       
        const aplicaDesc = forma.value==="Efectivo" && comp.desc_efectivo===0;
        inp.value = aplicaDesc ? efvoTodo : comp.saldo;
      }
      forma.onchange = refrescarForma;
      refrescarForma();
      const avisoVivo = document.createElement("div");
      avisoVivo.className = "muted";
      avisoVivo.style.cssText = "margin-top:6px;font-size:12px;";
      inp.insertAdjacentElement("afterend", avisoVivo);   

      function calcularAviso(){
        const efectivo = parseInt(inp.value) || 0;
        if(forma.value==="" || efectivo<=0){ avisoVivo.textContent=""; return; }

        const aplicaDesc = forma.value==="Efectivo" && comp.desc_efectivo===0;
        const saldadoCalc = aplicaDesc ? Math.ceil((efectivo/0.9)/100)*100 : efectivo;
        const tapa = Math.min(saldadoCalc, comp.saldo);      
        const queda = comp.saldo - tapa;

        if(queda <= 0){
          avisoVivo.textContent = `Salda todo ✓`;
        } else if(aplicaDesc){
          const faltaEfvo = Math.ceil((queda * 0.9) / 100) * 100;
          avisoVivo.textContent = `Tapás ${fmt(tapa)} · queda ${fmt(queda)} (con ${fmt(faltaEfvo)} en efectivo lo saldás)`;
        } else {
          avisoVivo.textContent = `Tapás ${fmt(tapa)} · queda ${fmt(queda)}`;
        }
      }
      inp.addEventListener("input", calcularAviso);
      forma.addEventListener("change", calcularAviso);                            
      div.querySelector(".aOk").onclick=async()=>{
        const efectivo=parseInt(div.querySelector(".aMonto").value)||0;
        if(efectivo<=0){ toast("Monto inválido"); return; }
        const aplicaDesc = forma.value==="Efectivo" && comp.desc_efectivo===0;
        const saldadoCalc = aplicaDesc ? Math.ceil((efectivo / 0.9) / 100) * 100 : efectivo;  
        const saldado = Math.min(saldadoCalc, comp.saldo);         
        const monto = efectivo;
        const body={ monto, saldado, forma_pago:forma.value,
          alias: forma.value==="Transferencia" ? (div.querySelector(".aAlias").value.trim()||null) : null };
        const r=await authFetch("/api/comprobantes/"+comp.id+"/pagos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
        if(!r.ok){ const e=await r.json(); toast(e.detail||"No se pudo"); return; }
        toast("Abono registrado"); cargar();
      };
    }
    div.querySelector(".btnAnular").onclick = async (e)=>{
      e.stopPropagation();
      if(!confirm("¿Anular este comprobante?")) return;
      const r = await authFetch("/api/comprobantes/"+comp.id, {method:"DELETE"});
      if(r.ok){ toast("Comprobante anulado"); cargar(); }
      else { toast("No se pudo anular"); }
    };

    const btnDet=div.querySelector(".btnDetalle");
    const boxDet=div.querySelector(".detalle-box");
    btnDet.onclick=async()=>{
      if(boxDet.style.display==="block"){ boxDet.style.display="none"; return; }
      const d=await (await authFetch("/api/comprobantes/"+comp.id)).json();
      const lineas=d.lineas.map(l=>`<div class="fila" style="justify-content:space-between;"><span>${l.cantidad}× ${l.nombre}${l.dificultad?' (dif)':''}</span><span>${fmt(l.precio_unit*l.cantidad)}</span></div>`).join("");
      const extra = d.extra_dificultad>0 ? `<div class="fila" style="justify-content:space-between;color:var(--warn);"><span>Extra dificultad</span><span>+${fmt(d.extra_dificultad)}</span></div>` : "";

      const pctEf = d.desc_efectivo>0 ? (d.desc_efectivo / d.total_transfer * 100).toFixed(2) : 0;
      const filaDescEf = d.desc_efectivo>0 ? `<div class="fila" style="justify-content:space-between;color:var(--warn);"><span>Descuento ${pctEf}%</span><span>−${fmt(d.desc_efectivo)}</span></div>` : "";
      const filaSubtotal = d.desc_jubilado>0 ? `<div class="fila" style="justify-content:space-between;border-top:1px solid var(--border);padding-top:6px;"><span>Subtotal</span><span>${fmt(d.subtotal)}</span></div>` : "";
      const filaDescJub = d.desc_jubilado>0 ? `<div class="fila" style="justify-content:space-between;color:var(--warn);"><span>${d.descuento_nombre||'Descuento'} ${d.descuento_pct}%</span><span>−${fmt(d.desc_jubilado)}</span></div>` : "";

      const pagos = d.pagos.length
        ? d.pagos.map(p=>{
            const f=new Date(p.fecha).toLocaleDateString("es-AR");
            const desc = p.desc_aplicado || 0;
            const extra = desc>0 ? ` <span class="muted">(saldó ${fmt(p.saldado)} · ${(desc / p.saldado * 100).toFixed(2)}% desc)</span>` : "";
            return `<div class="fila" style="justify-content:space-between;color:var(--text-tenue);"><span>✓ ${f} · ${p.forma_pago}${p.alias?' ('+p.alias+')':''}${extra}</span><span>${fmt(p.monto)}</span></div>`;
          }).join("")
        : '<div class="muted">Sin pagos todavía.</div>';
      const descEfvoReal = d.pagos.reduce((a,p)=> a + (p.desc_aplicado || 0), 0);
      const pctEfvoReal = descEfvoReal>0 ? (descEfvoReal / d.total_final * 100).toFixed(2) : 0;
      const filaDescEfvoReal = descEfvoReal>0
        ? `<div class="fila fila-desc"><span>Descuento ${pctEfvoReal}%</span><span>−${fmt(descEfvoReal)}</span></div>` : "";
      const filaPendiente = d.saldo > 0
        ? `<div class="fila fila-desc"><span>Pendiente</span><span>${fmt(d.saldo)}</span></div>` : "";
      boxDet.innerHTML=`
        <div style="font-weight:700;margin-bottom:6px;">Detalle</div>
        ${lineas}${extra}${filaDescEf}${filaSubtotal}${filaDescEfvoReal}${filaDescJub}
        <div class="fila fila-total"><span>Total</span><span>${fmt(d.ingresado + d.saldo)}</span></div>
        <div style="font-weight:700;margin:10px 0 6px;">Pagos</div>
        ${pagos}${filaPendiente}`;
      boxDet.style.display="block";
    };
    
    cont.appendChild(div);

    const compTarget = new URLSearchParams(location.search).get("comp");
    if(compTarget && comp.id == compTarget){        
      div.querySelector(".btnDetalle")?.click();  
      div.style.outline = "2px solid var(--acento)";
      div.scrollIntoView({behavior:"smooth", block:"center"});
    }
  });
}

const dl=document.createElement("datalist"); dl.id="aliasDL"; document.body.appendChild(dl);
cargar().then(()=>{ dl.innerHTML=ALIAS.map(a=>`<option value="${a}">`).join(""); });
</script>
</body></html>
