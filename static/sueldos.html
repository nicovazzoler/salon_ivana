<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Sueldos — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ivana">
<script src="/static/pwa.js" defer></script>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  .wrap{ max-width:900px; }
  .card-head{ margin-bottom:var(--sp-4); }
  .card-head h2{ margin:0; }
  .card-head p{ margin:var(--sp-1) 0 0; font-size:var(--fs-base); color:var(--text-tenue); max-width:64ch; }



  .sin-comp{
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:var(--r-full);
    font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em;
    background:var(--rojo-bg); color:var(--danger); border:1px solid var(--rojo-borde);
    vertical-align:middle;
  }
  a.ver-comp{ color:var(--acento); text-decoration:none; white-space:nowrap; }

  /* El nombre de la empleada, en lugar del desplegable: es lo único que hace
     falta decir y se lee de lejos. */
  .quien-empleada{ font-family:var(--font-display); font-size:var(--fs-2xl);
                   font-weight:var(--fw-black); color:var(--text-titulo);
                   display:flex; align-items:center; gap:var(--sp-3); }
  .quien-empleada button{ font-size:var(--fs-sm); padding:4px 10px; }

  .vacio{ padding:var(--sp-4); text-align:center; color:var(--text-tenue); }

  .vacio b{ display:block; color:var(--text-titulo); margin-bottom:var(--sp-1); }

  .agregar{ display:flex; flex-wrap:wrap; gap:var(--sp-2); align-items:flex-end;
            margin-top:var(--sp-3); padding-top:var(--sp-3);
            border-top:1px solid var(--border-sutil); }
  /* min-width:0 en cada casillero: sin eso el desplegable de ítems, que tiene
     nombres largos, se estira por encima del rótulo del casillero de al lado y
     se lee "CANT" pisado por el nombre del trabajo. */
  .agregar > div{ min-width:110px; }
  .agregar > div{ display:flex; flex-direction:column; min-width:0; }
  .agregar label{ margin-bottom:2px; }
  .agregar select, .agregar input{ width:100%; max-width:100%; }
  .agregar .ancho{ flex:2 1 220px; }

  /* ===== La cuenta de la empleada: el total grande y de dónde sale ===== */
  .quien-empleada{ flex:1 1 100%; }
  .quien-empleada .inicial{ width:44px; height:44px; font-size:20px; }
  .quien-empleada button{ margin-left:auto; }
  .cuenta{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--sp-6); align-items:start; width:100%; }
  .grande .lbl{ display:block; font-size:var(--fs-sm); font-weight:var(--fw-bold); color:var(--text-tenue); }
  .grande .val{ display:block; font-family:var(--font-display); font-size:40px; font-weight:var(--fw-bold);
                color:var(--text-marca); line-height:1.1; margin:2px 0; font-variant-numeric:tabular-nums; }
  .grande .desde{ font-size:var(--fs-base); color:var(--text-suave); }
  .renglones .r{ display:flex; gap:10px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--border-sutil); }
  .renglones .r span:last-child{ margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .renglones .r small{ color:var(--text-tenue); font-size:var(--fs-sm); }
  .renglones .r.falta-r{ color:var(--danger); }
  .renglones .r.total{ border-bottom:2px solid var(--border); font-weight:var(--fw-bold); color:var(--text-titulo); }
  .renglones .r.total span:last-child{ font-family:var(--font-display); font-size:var(--fs-xl); }
  @media (max-width:700px){ .cuenta{ grid-template-columns:1fr; gap:var(--sp-4); } }

  /* Hoy se despega: es lo que se viene a cargar */
  .hoy{ margin-top:var(--sp-5); padding:var(--sp-4); border-radius:16px;
        background:var(--bg-elevado); box-shadow:var(--sombra-elevada); }
  .hoy-cab{ display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; margin-bottom:var(--sp-3); }
  .hoy-cab h3{ margin:0; font-size:var(--fs-xl); }
  .nota-hoy{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .hoy-acc{ display:flex; justify-content:flex-end; gap:var(--sp-2); margin-top:var(--sp-3); }
  .cargado{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; font-size:var(--fs-md); }
  .cargado b{ font-family:var(--font-display); font-size:22px; color:var(--text-titulo); }

  /* Las tandas: entré, salí, volví, me fui */
  .tandas{ display:flex; flex-direction:column; gap:10px; }
  .tanda{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; }
  .tanda > div{ display:flex; flex-direction:column; gap:3px; }
  .tanda label{ margin:0; }
  .tanda input[type=time]{ width:150px; font-size:var(--fs-lg); }
  .dlg .tanda input[type=time]{ width:130px; }
  .tanda .quitar{ background:transparent; color:var(--text-tenue); padding:8px; }
  .tanda .quitar:hover{ background:var(--danger-bg); color:var(--danger); }
  .mas-tanda{ align-self:flex-start; background:transparent; color:var(--text-marca); padding:6px 2px; font-weight:var(--fw-bold); }
  .mas-tanda:hover{ background:transparent; color:var(--text-titulo); text-decoration:underline; }
  .tandas-pie{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; min-height:30px; }
  .tandas-pie .suma{ font-family:var(--font-display); font-size:22px; color:var(--text-titulo); }
  .tandas-pie .desc{ color:var(--text-suave); font-size:var(--fs-base); }
  .dos-campos{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
  .dos-campos input{ width:100%; }
  .dlg-acciones .dlg-extra{ margin-right:auto; }

  /* ===== Los días: un renglón que se abre ===== */
  .seccion-h{ display:flex; align-items:baseline; gap:10px; margin:var(--sp-6) 0 6px; }
  .seccion-h h3{ margin:0; font-size:var(--fs-xl); }
  .seccion-h span{ color:var(--text-tenue); font-size:var(--fs-base); }
  .dia{ border-bottom:1px solid var(--border-sutil); }
  .ciclo-cuerpo .dia:last-of-type{ border-bottom:none; }
  .dia-fila{ display:grid; grid-template-columns:104px minmax(0,1fr) auto 20px; align-items:center; gap:10px;
             width:100%; min-height:44px; padding:10px 0; background:transparent; color:var(--text);
             text-align:left; font-weight:var(--fw-normal); border-radius:0; }
  .dia-fila:hover{ background:var(--bg-hover); color:var(--text); }
  .dia-fila.quieta:hover{ background:transparent; }
  .dia-fila.quieta .btn-chico{ grid-column:3 / span 2; justify-self:end; }
  .dia-fila b{ color:var(--text-titulo); }
  .dia-fila .det{ font-size:var(--fs-base); color:var(--text-suave); min-width:0; }
  .dia-fila .plata{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .flecha{ display:inline-flex; color:var(--text-tenue); transition:transform .15s; }
  .flecha .ico{ width:16px; height:16px; }
  .dia.abierto .flecha, .hist.abierto .flecha{ transform:rotate(90deg); }
  .dia.hoy-d .dia-fila b{ color:var(--text-marca); }
  .falta{ color:var(--danger); font-weight:var(--fw-bold); }
  .tenue{ color:var(--text-tenue); }
  .dia-cuerpo{ padding:2px 0 var(--sp-3) var(--sp-3); margin-left:4px; border-left:2px solid var(--border-sutil); }
  .dia-horario{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:8px 0 4px;
                font-size:var(--fs-base); color:var(--text-suave); }
  .dia-horario b{ color:var(--text-titulo); }
  .cuentita{ font-size:var(--fs-base); color:var(--text-suave); padding:4px 0 8px; }
  .cuentita b{ color:var(--text-titulo); }
  .trab{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:12px; align-items:center; padding:8px 0; }
  .trab + .trab{ border-top:1px dashed var(--border-sutil); }
  .trab b{ display:block; color:var(--text-titulo); font-weight:var(--fw-bold); }
  .trab .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .trab .dur{ font-size:var(--fs-base); white-space:nowrap; display:flex; align-items:center; gap:4px; }
  .trab .dur button{ background:transparent; color:var(--text-tenue); padding:6px; }
  .trab .dur button:hover{ background:var(--bg-sutil); color:var(--text-titulo); }
  .trab .dur .ico{ width:15px; height:15px; }
  .trab .plata{ font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; min-width:64px; }
  .trab.sin-tiempo{ background:var(--rojo-bg); border-radius:var(--r-md); padding-left:var(--sp-2); padding-right:var(--sp-2); }
  .plata.no-cuenta{ color:var(--text-tenue); }
  .btn-chico{ padding:5px 12px; font-size:var(--fs-sm); }
  .vacio-chico{ color:var(--text-tenue); font-size:var(--fs-base); padding:10px 0; }
  @media (max-width:520px){
    .dia-fila{ grid-template-columns:78px minmax(0,1fr) auto 16px; gap:8px; }
    .trab{ gap:8px; }
    .trab .plata{ min-width:0; }
  }

  /* ===== Lo que ya cobró: plegado, y cada cobro se abre día por día ===== */
  details.cobrado{ margin-top:var(--sp-6); border-top:1px solid var(--border-sutil); }
  details.cobrado > summary{ list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:10px; padding:14px 0; }
  details.cobrado > summary::-webkit-details-marker{ display:none; }
  details.cobrado > summary h3{ margin:0; font-size:var(--fs-xl); }
  details.cobrado > summary span{ flex:1; min-width:0; color:var(--text-tenue); font-size:var(--fs-base); }
  details.cobrado > summary h3{ white-space:nowrap; }
  details.cobrado > summary .ico{ flex:none; align-self:center; color:var(--text-tenue); transition:transform .15s; }
  details.cobrado[open] > summary .ico{ transform:rotate(90deg); }
  .hist{ border-bottom:1px solid var(--border-sutil); }
  .hist-fila{ display:grid; grid-template-columns:minmax(0,1fr) auto 20px; gap:10px; align-items:center; width:100%;
              padding:12px 0; background:transparent; color:var(--text); text-align:left; font-weight:var(--fw-normal); border-radius:0; }
  .hist-fila:hover{ background:var(--bg-hover); color:var(--text); }
  .hist-fila b{ color:var(--text-titulo); display:block; }
  .hist-fila .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .hist-fila .plata{ font-family:var(--font-display); font-weight:var(--fw-bold); font-size:var(--fs-lg);
                     color:var(--text-titulo); font-variant-numeric:tabular-nums; }
  .ver-mas{ margin:10px 0 0; }
  .resumen-dias{ padding:4px 0 12px 14px; border-left:2px solid var(--border-sutil); margin-left:4px; }
  .rd{ display:grid; grid-template-columns:78px minmax(0,1fr) auto; gap:10px; padding:6px 0;
       font-size:var(--fs-base); border-bottom:1px dashed var(--border-sutil); }
  .rd:last-child{ border-bottom:0; }
  .rd b{ color:var(--text-titulo); }
  .rd .det{ color:var(--text-suave); }
  .rd .det em{ font-style:normal; color:var(--text-tenue); }
  .rd .plata{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .rd.tot{ font-weight:var(--fw-bold); color:var(--text-titulo); border-bottom:0; }

  .dia-acciones{ margin-top:var(--sp-2); }
  .resta{ color:var(--danger); }

  /* ===== Pagar: hasta qué día, a quién y cuánto ===== */
  .hasta{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:4px 0 var(--sp-4); }
  .hasta > span{ font-weight:var(--fw-bold); color:var(--text-suave); font-size:var(--fs-base); }
  .segmento{ display:inline-flex; border:1.5px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg-input); }
  .segmento button{ border-radius:0; background:transparent; color:var(--text); padding:8px 16px;
                    font-size:var(--fs-md); font-weight:var(--fw-bold); border:0; }
  .segmento button + button, .segmento label{ border-left:1.5px solid var(--border); }
  .segmento button:hover{ background:var(--bg-hover); color:var(--text-titulo); }
  .segmento button.on, .segmento label.on{ background:var(--acento-bg); color:var(--text-marca);
                                           box-shadow:inset 0 -3px 0 var(--acento-fuerte); }
  .segmento small{ display:block; font-weight:var(--fw-normal); font-size:var(--fs-xs); color:var(--text-tenue); }
  .segmento label{ display:flex; align-items:center; gap:6px; padding:0 10px; margin:0;
                   font-weight:var(--fw-bold); font-size:var(--fs-md); color:var(--text);
                   text-transform:none; letter-spacing:normal; }
  .segmento input[type=date]{ border:0; background:transparent; padding:6px 0; width:auto; font-size:var(--fs-base); }

  .pagos{ border-top:1px solid var(--border-sutil); }
  .pcab, .prow{ display:grid; grid-template-columns:34px minmax(0,1.5fr) repeat(3, minmax(0,1.05fr)) minmax(0,1fr);
                gap:8px; align-items:center; }
  .pcab{ padding:8px 0; font-size:var(--fs-xs); font-weight:var(--fw-bold); text-transform:uppercase;
         letter-spacing:.05em; color:var(--text-tenue); border-bottom:1px solid var(--border-sutil); }
  .pcab span:nth-child(n+3), .prow > .n{ text-align:right; }
  .pfila{ border-bottom:1px solid var(--border-sutil); }
  .prow{ padding:12px 0; }
  .pcab input[type=checkbox], .prow input[type=checkbox]{ width:20px; height:20px; accent-color:var(--bronce-500); }
  .prow .quien{ display:inline-flex; align-items:center; gap:4px; background:transparent; padding:0;
                color:var(--text-marca); text-align:left; font-weight:var(--fw-bold); font-size:var(--fs-md); border-radius:0; }
  .prow .quien:hover{ background:transparent; color:var(--text-titulo); }
  .prow .quien .ico{ width:16px; height:16px; transition:transform .15s; }
  .pfila.abierta .prow .quien .ico{ transform:rotate(90deg); }
  .prow .quien-fija{ color:var(--text-tenue); font-weight:var(--fw-bold); }
  .prow .desde{ display:block; font-size:var(--fs-sm); color:var(--text-tenue); }
  .prow .n{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .prow .n small{ display:block; font-size:var(--fs-xs); color:var(--text-tenue); }
  .prow .n.resta{ color:var(--danger); }
  .prow .n.total{ font-family:var(--font-display); font-weight:var(--fw-bold); font-size:var(--fs-lg); color:var(--text-titulo); }
  .prow .n.recien{ grid-column:3 / 6; }
  .prow.apagada .n{ color:var(--text-tenue); }
  .avisos{ display:flex; flex-wrap:wrap; gap:6px; padding:0 0 12px 42px; margin-top:-4px; }
  .aviso{ font-size:var(--fs-sm); padding:3px 10px; border-radius:999px; background:var(--ocre-bg); color:var(--ocre-700); }
  .aviso.frena{ background:var(--rojo-bg); color:var(--rojo-700); }
  .aviso.ok{ background:var(--verde-bg); color:var(--verde-700); }
  .pdetalle{ padding:0 0 16px 42px; }
  .sub-movs{ margin-top:var(--sp-2); }
  .acc-emp{ display:flex; gap:var(--sp-2); margin-top:var(--sp-3); }
  .rot-movil{ display:none; }
  .pie-pago{ display:flex; justify-content:flex-end; padding:16px 0 4px; }
  .pie-pago .b-ok{ padding:13px 22px; font-size:var(--fs-md); }
  @media (max-width:640px){
    .pcab{ grid-template-columns:30px 1fr; }
    .pcab span:nth-child(n+3){ display:none; }
    .prow{ grid-template-columns:30px minmax(0,1fr) auto; row-gap:4px; }
    .prow .n{ grid-column:2 / 4; display:flex; justify-content:space-between; font-size:var(--fs-base); }
    .prow .n small.esc{ display:none; }
    .prow .n.total{ grid-column:3; grid-row:1; font-size:var(--fs-lg); }
    .prow .n.recien{ grid-column:2; }
    .rot-movil{ display:inline; color:var(--text-tenue); }
    .prow .n .rot-movil small{ display:inline; margin-left:4px; }
    .avisos, .pdetalle{ padding-left:30px; }
  }

  /* El cartel de pagar: cada una con su forma */
  .dlg.pagar{ max-width:520px; max-height:calc(100vh - 32px); overflow:auto; }
  .dlg.ancho{ max-width:480px; }
  .pago-emp{ padding:10px 0; border-bottom:1px solid var(--border-sutil); }
  .pago-emp .cab{ display:flex; align-items:baseline; gap:8px; }
  .pago-emp .cab b{ color:var(--text-titulo); }
  .pago-emp .cab small{ color:var(--text-tenue); }
  .pago-emp .cab .plata{ margin-left:auto; font-family:var(--font-display); font-size:var(--fs-lg);
                         font-weight:var(--fw-bold); color:var(--text-titulo); }
  .pago-emp .fichas{ margin-top:8px; }
  .pago-emp .ficha{ flex:1 1 80px; padding:7px 8px; }
  .fichas{ display:flex; flex-wrap:wrap; gap:8px; }
  .ficha{ flex:1 1 120px; padding:10px 12px; border-radius:12px; background:var(--bg-tile); color:var(--text);
          font-weight:var(--fw-bold); font-size:var(--fs-base); text-align:center; }
  .ficha:hover{ background:var(--bg-tile-hover); color:var(--text-titulo); }
  .ficha.on{ background:var(--bg-elegido); color:var(--text-marca); box-shadow:inset 0 0 0 1.5px var(--border-marca); }
  .mixto{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; font-size:var(--fs-base); color:var(--text-suave); }
  .mixto label{ margin:0; }
  .mixto input{ width:130px; }
  .dia-caja{ display:flex; align-items:center; gap:var(--sp-2); margin-top:var(--sp-3); }
  .dia-caja label{ margin:0; white-space:nowrap; }
  .dlg .dia-caja input{ width:auto; }
  .sale{ margin:var(--sp-2) 0 0; font-size:var(--fs-base); color:var(--text-suave); }
  .sale b{ color:var(--text-titulo); }

  /* Adelanto y producto */
  .acciones{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:var(--sp-3); }
  .accion{ display:flex; align-items:center; gap:12px; text-align:left; padding:14px 16px; border-radius:14px;
           background:var(--bg-sutil); color:var(--text-titulo); font-size:var(--fs-md); }
  .accion:hover{ background:var(--bg-sutil-hover); color:var(--text-titulo); }
  .accion small{ display:block; font-weight:var(--fw-normal); color:var(--text-tenue); font-size:var(--fs-sm); }
  .accion .ico{ width:24px; height:24px; color:var(--acento); flex:none; }
  @media (max-width:480px){ .acciones{ grid-template-columns:1fr; } }
  .campo{ display:flex; flex-direction:column; gap:4px; margin-top:12px; }
  .campo label{ margin:0; }
  .campo input{ width:100%; }
  .monto-grande{ font-family:var(--font-display); font-size:30px !important; text-align:center; }
  .prod-lista{ max-height:240px; overflow:auto; margin-top:8px; border-top:1px solid var(--border-sutil); }
  .prod{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; width:100%; padding:10px 6px;
         background:transparent; color:var(--text); text-align:left; font-weight:var(--fw-normal);
         border-radius:0; border-bottom:1px solid var(--border-sutil); }
  .prod:hover{ background:var(--bg-hover); color:var(--text); }
  .prod:disabled{ opacity:.5; }
  .prod b{ color:var(--text-titulo); }
  .prod .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  #pBusca{ width:100%; }
  .prod-elegido{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--bg-tile); }
  .prod-elegido b{ color:var(--text-titulo); }
  .prod-elegido button{ margin-left:auto; background:transparent; color:var(--text-tenue); padding:4px 8px; }
  .dos{ display:grid; grid-template-columns:120px minmax(0,1fr); gap:10px; }
  .paso{ display:flex; align-items:center; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--bg-input); }
  .paso button{ background:transparent; color:var(--text-titulo); padding:8px 12px; border-radius:0; }
  .paso span{ flex:1; text-align:center; font-weight:var(--fw-bold); }
  .lista-precio{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .mov{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center;
        padding:10px 0; border-bottom:1px solid var(--border-sutil); }
  .mov b{ display:block; color:var(--text-titulo); }
  .mov .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .mov .plata{ color:var(--danger); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .mov .b-del{ padding:6px 10px; font-size:var(--fs-sm); }
  .hist-cuerpo{ padding:0 0 12px 14px; border-left:2px solid var(--border-sutil); margin-left:4px; }
  .hist-emp{ border-bottom:1px solid var(--border-sutil); }
  .hist-emp:last-child{ border-bottom:0; }
  .hist-emp .hist-fila{ padding:9px 0 9px 10px; }
  .hist-emp .hist-fila .plata{ font-size:var(--fs-md); }
  #cardEmpleada .quien-empleada{ margin-bottom:var(--sp-4); }

  /* Las dos solapas de la dueña, como las de Depilación */
  .solapas{ display:flex; gap:28px; margin-bottom:var(--sp-5); flex-wrap:wrap;
            border-bottom:1px solid var(--border-sutil); }
  .solapas button{ padding:10px 2px; margin-bottom:-1px; background:transparent; border:0;
                   border-bottom:2px solid transparent; border-radius:0;
                   color:var(--text-tenue); font-size:var(--fs-lg); }
  .solapas button:hover{ background:transparent; color:var(--text-titulo); }
  .solapas button.on{ border-bottom-color:var(--bronce-400); color:var(--text-titulo); }
  .hoja > .card + .card{ margin-top:var(--sp-8); padding-top:var(--sp-6);
                         border-top:1px solid var(--border-sutil); }

  /* La puerta: el nombre en una ficha grande y el código en un teclado. Se usa
     parada y con las manos ocupadas: nada chico. */
  .puerta{ margin-top:var(--sp-5); }
  .puerta-aviso{ text-align:center; color:var(--text-suave); margin:0 0 var(--sp-4); }
  .puerta-caja{ max-width:560px; margin:0 auto; text-align:center; }
  .nombres{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:var(--sp-3); }
  .nombre-tile{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px 10px 16px;
                background:var(--bg-tile); color:var(--text-titulo); border-radius:16px; font-size:var(--fs-lg); }
  .nombre-tile:hover{ background:var(--bg-tile-hover); color:var(--text-titulo); }
  .nombre-tile small{ font-size:var(--fs-xs); font-weight:var(--fw-normal); color:var(--text-tenue); margin-top:-6px; }
  .inicial{ width:54px; height:54px; border-radius:50%; display:grid; place-items:center;
            font-family:var(--font-display); font-size:24px; background:var(--bg-elegido); color:var(--text-marca);
            box-shadow:inset 0 0 0 1.5px var(--border-marca); }
  .pin-caja{ max-width:320px; margin:0 auto; }
  .pin-caja .volver{ background:transparent; color:var(--text-tenue); padding:6px 10px; font-weight:var(--fw-medium); }
  .pin-caja .volver:hover{ background:var(--bg-sutil); color:var(--text-titulo); }
  .pin-caja h3{ margin:10px 0 0; font-size:var(--fs-2xl); }
  .pin-caja p{ margin:4px 0 0; color:var(--text-suave); }
  .puntos{ display:flex; justify-content:center; gap:14px; margin:22px 0 8px; min-height:18px; }
  .puntos i{ width:14px; height:14px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--border); }
  .puntos i.lleno{ background:var(--text-titulo); box-shadow:none; }
  .puntos.mal{ animation:sacudir .35s; }
  @keyframes sacudir{ 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-4px)} }
  @media (prefers-reduced-motion:reduce){ .puntos.mal{ animation:none; } }
  .pin-caja .pin-error{ color:var(--danger); font-size:var(--fs-sm); min-height:20px; margin:0 0 8px; }
  .teclado{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .teclado button{ height:64px; font-size:26px; font-family:var(--font-display); font-weight:var(--fw-normal);
                   background:var(--bg-tile); color:var(--text-titulo); border-radius:16px; }
  .teclado button:hover{ background:var(--bg-tile-hover); color:var(--text-titulo); }
  .teclado button.chico{ background:transparent; color:var(--text-suave); }
  .teclado button.ok{ background:var(--acento-fuerte); color:var(--text-sobre-oro);
                      font-size:var(--fs-md); font-family:var(--font-texto); font-weight:var(--fw-bold); }
  .teclado .ico{ width:24px; height:24px; }

  /* Valores y comisiones: tablas con su título por columna */
  .tabla-v{ width:100%; border-collapse:collapse; font-size:var(--fs-md); }
  .tabla-v th{ text-align:left; padding:8px 6px; font-size:var(--fs-xs); font-weight:var(--fw-bold);
               text-transform:uppercase; letter-spacing:.05em; color:var(--text-tenue);
               border-bottom:1px solid var(--border-sutil); white-space:nowrap; }
  .tabla-v th.c{ white-space:normal; line-height:1.2; }
  .tabla-v td{ padding:9px 6px; border-bottom:1px solid var(--border-sutil); vertical-align:middle; }
  .tabla-v .n{ text-align:right; font-variant-numeric:tabular-nums; }
  .tabla-v .c{ text-align:center; width:48px; }
  .tabla-v b{ color:var(--text-titulo); font-weight:var(--fw-bold); display:block; }
  .tabla-v .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .tabla-v .codigo{ font-variant-numeric:tabular-nums; letter-spacing:.15em; font-weight:var(--fw-bold); color:var(--text-titulo); }
  .tabla-v input[type=checkbox]{ width:20px; height:20px; accent-color:var(--bronce-500); }
  .tabla-v tr.elegido td{ background:var(--bg-elegido); }
  .valor-ed{ display:inline-flex; align-items:center; justify-content:flex-end; gap:4px; }
  .valor-ed .v{ display:inline; }
  .valor-ed .falta{ color:var(--danger); font-weight:var(--fw-bold); font-size:var(--fs-sm); }
  .valor-ed input{ width:110px; text-align:right; padding:6px 10px; }
  .lapiz{ background:transparent; color:var(--text-tenue); padding:6px; }
  .lapiz:hover{ background:var(--bg-sutil); color:var(--text-titulo); }
  .lapiz .ico{ width:16px; height:16px; }
  .filtros-c{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:var(--sp-2) 0 var(--sp-3); }
  .filtros-c .sep{ width:1px; height:22px; background:var(--border-sutil); margin:0 6px; }
  .filtros-c .chip{ padding:6px 12px; border-radius:999px; background:var(--bg-tile); color:var(--text);
                    font-size:var(--fs-sm); font-weight:var(--fw-bold); }
  .filtros-c .chip:hover{ background:var(--bg-tile-hover); color:var(--text-titulo); }
  .filtros-c .chip.on{ background:var(--bg-elegido); color:var(--text-marca); box-shadow:inset 0 0 0 1.5px var(--border-marca); }
  #buscaServ{ width:100%; }
  .barra-c{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; margin-bottom:10px;
            border-radius:12px; background:var(--bg-elevado); box-shadow:var(--sombra-elevada);
            position:sticky; top:calc(var(--alto-header, 0px) + 8px); z-index:5; }
  .barra-c b{ color:var(--text-titulo); margin-right:6px; }
  .barra-c input{ width:70px; text-align:right; padding:6px 8px; }
  .barra-c .lapiz{ margin-left:auto; }

  @media (max-width:520px){
    .valor-ed input{ width:90px; }
    .tabla-v th, .tabla-v td{ padding-left:4px; padding-right:4px; }
  }

</style>

<header>
  <span>Sueldos</span>
  <nav class="menu"></nav>
</header>

<!-- La puerta. Con el usuario empleado, la pantalla no muestra nada hasta que
     alguien dice quién es y pone su código: en el local hay una sola tablet y un
     solo login, así que sin esto el sueldo de una queda a la vista de la otra y
     de cualquiera que agarre el aparato. Se pide CADA vez que se entra, y el
     permiso no se guarda en el navegador: vive mientras la pantalla está
     abierta. El candado de verdad está en el servidor. -->
<div class="wrap" id="puerta" hidden>
  <div class="card puerta">
    <h2 style="text-align:center;">¿Quién sos?</h2>
    <p class="puerta-aviso" id="puertaAyuda" hidden></p>
    <div id="puertaCuerpo"></div>
  </div>
</div>

<div class="wrap" id="todo">
  <div class="solapas" data-dueno>
    <button class="on" data-hoja="hojaSueldos">Sueldos</button>
    <button data-hoja="hojaValores">Valores y comisiones</button>
  </div>

  <div class="hoja" id="hojaSueldos">
    <div class="card" id="cardPagar" data-dueno></div>
    <div class="card" id="cardPagado" data-dueno></div>
    <!-- Lo de la empleada que entró con su código: la dueña no pasa por acá. -->
    <div class="card" id="cardEmpleada" data-empleado>
      <div class="quien-empleada" id="quienEmpleada"></div>
      <div id="totales"></div>
      <div id="cuerpo"></div>
    </div>
  </div>

  <!-- Lo que se le paga a cada una: el valor hora y la comisión de cada servicio.
       Sin valores generales: cada empleada tiene el suyo y cada servicio el suyo. -->
  <div class="hoja" id="hojaValores" data-dueno hidden>
    <div class="card">
      <div class="card-head"><h2>Empleadas</h2></div>
      <div id="tablaEmpleadas"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Comisiones</h2></div>
      <div id="tablaComisiones"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/auth.js"></script>
<script src="/static/js/sueldos.js"></script>
</body></html>
