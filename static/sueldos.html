<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Sueldos — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ivana">
<script src="/static/pwa.js" defer></script>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  .wrap{ max-width:900px; }
  .card-head{ margin-bottom:var(--sp-4); }
  .card-head h2{ margin:0; }
  .card-head p{ margin:var(--sp-1) 0 0; font-size:var(--fs-base); color:var(--text-tenue); max-width:64ch; }

  .quien{ display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; }
  .quien label{ margin:0; }
  .quien select{ width:auto; min-width:170px; }

  /* El total va arriba y grande: es lo que la empleada entra a mirar. Todo lo
     de abajo es el detalle de cómo se llegó a ese número. */
  .totales{ display:flex; flex-wrap:wrap; gap:var(--sp-3); }
  .totales .kpi{ flex:1 1 150px; }
  .kpi.destacado{ background:var(--bg-header); border-color:var(--acento); }
  .kpi.destacado .val{ color:var(--acento); }
  .kpi .nota{ display:block; margin-top:2px; font-size:var(--fs-xs); color:var(--text-tenue); }

  .fila-dato{
    display:grid; grid-template-columns:minmax(0,1fr) auto auto;
    align-items:center; gap:var(--sp-2);
    padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil);
  }
  .fila-dato .que{ min-width:0; }
  .fila-dato .que b{ display:block; }
  .fila-dato .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .fila-dato .plata{ font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; min-width:72px; }

  .mins{ display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .mins input{ width:56px; text-align:right; }
  .mins .u{ font-size:var(--fs-sm); color:var(--text-tenue); }

  .sin-comp{
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:var(--r-full);
    font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em;
    background:var(--rojo-bg); color:var(--danger); border:1px solid var(--rojo-borde);
    vertical-align:middle;
  }
  a.ver-comp{ color:var(--acento); text-decoration:none; white-space:nowrap; }

  /* El nombre de la empleada, en lugar del desplegable: es lo único que hace
     falta decir y se lee de lejos. */
  .quien-empleada{ font-family:var(--font-display); font-size:var(--fs-2xl);
                   font-weight:var(--fw-black); color:var(--text-titulo);
                   display:flex; align-items:center; gap:var(--sp-3); }
  .quien-empleada button{ font-size:var(--fs-sm); padding:4px 10px; }

  /* Un ciclo: la semana de trabajo (sábado a viernes) con sus días adentro. */
  /* Cada semana sí es un objeto aparte: es lo que se cierra y se paga */
  .ciclo{ border-radius:14px; background:var(--bg-elevado); box-shadow:var(--sombra-elevada);
          margin-top:var(--sp-4); overflow:hidden; }
  .ciclo-cab{ display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sp-2);
              padding:var(--sp-3) var(--sp-4);
              border-bottom:1px solid var(--border-sutil); }
  /* Se repiten en cada día: como botones, una semana suma quince */
  .dia .agregar-trabajo, .dia .editar-horas, .dia .editar-min{
    min-height:30px; background:transparent; color:var(--text-tenue);
  }
  .dia .agregar-trabajo:hover, .dia .editar-horas:hover, .dia .editar-min:hover{
    background:var(--bg-sutil); color:var(--text-titulo);
  }
  .dia .editar-horas .ico, .dia .editar-min .ico{ width:15px; height:15px; }
  .ciclo-cab h3{ margin:0; font-size:var(--fs-lg); }
  .ciclo-cab .plata{ margin-left:auto; font-family:var(--font-display);
                     font-size:var(--fs-xl); font-weight:var(--fw-black);
                     font-variant-numeric:tabular-nums; }
  .ciclo-cab .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .ciclo-cuerpo{ padding:0 var(--sp-4) var(--sp-3); }
  /* El ciclo de esta semana, el que todavía se está llenando. */

  .ciclo.en-curso .ciclo-cab h3::after{ content:" · en curso"; font-weight:var(--fw-normal);
                                        font-size:var(--fs-sm); color:var(--text-tenue); }

  /* El día de depilación: en vez de días con horas, la cuenta del reparto. */

  .cuenta-depi{ margin:var(--sp-3) 0; }
  .cuenta-depi .ren{ display:flex; align-items:baseline; gap:var(--sp-2);
                     padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil); }
  .cuenta-depi .ren > :last-child{ margin-left:auto; font-variant-numeric:tabular-nums;
                                   white-space:nowrap; }
  .cuenta-depi .ren.chico{ padding:2px 0 2px var(--sp-3); border-bottom:none;
                           font-size:var(--fs-sm); color:var(--text-tenue); }
  .cuenta-depi .resta{ color:var(--danger); }
  .cuenta-depi .ren.total{ border-bottom:2px solid var(--border); }
  .cuenta-depi .ren.total b{ font-family:var(--font-display); font-size:var(--fs-lg);
                             font-weight:var(--fw-black); }
  .cuenta-depi .ren.mitad{ border-bottom:none; }
  .cuenta-depi .ren.mitad b{ font-weight:var(--fw-bold); }
  /* La máquina y el pago a la ayudante no son gastos más: son fijos del día y
     los dos que más se olvidan, y faltando reparten plata que no quedó. Por eso
     el renglón está siempre, aunque todavía no se haya cargado. */
  .cuenta-depi .ren.chico.ayudante{ color:var(--text); }
  .cuenta-depi .ren.chico.falta-fijo{ color:var(--danger); }
  /* El mismo número en transferencia, para cruzarlo con el comprobante: es un
     dato al costado de la cuenta, no un renglón que sume o reste. */
  .cuenta-depi .ren.chico.transfer{ font-style:italic; }
  .cuenta-depi .ren.chico em{ font-style:normal; }
  .cuenta-depi .ren .btn-mini{ margin-left:6px; padding:1px 7px; }

  /* Para la ayudante no hay ciclo: solo el aviso de lo que cobró ese día. */
  .avisos-depi{ margin-bottom:var(--sp-3); }
  .aviso-depi{ display:flex; align-items:center; gap:var(--sp-3);
               padding:var(--sp-3); border:1px solid var(--border-sutil);
               border-radius:var(--r-md); background:var(--bg-sutil); }
  .aviso-depi + .aviso-depi{ margin-top:var(--sp-2); }
  .aviso-depi .det{ display:block; font-size:var(--fs-sm); color:var(--text-tenue); }
  .aviso-depi .plata{ margin-left:auto; font-family:var(--font-display);
                      font-weight:var(--fw-black); font-variant-numeric:tabular-nums; }
  .nota-depi{ font-size:var(--fs-sm); color:var(--text-tenue);
              padding:var(--sp-2) 0; border-top:1px solid var(--border-sutil); }
  /* Lo que se hizo ese día, a secas: sin horas ni "falta el tiempo", que no
     significan nada en un día que no se paga ni por horas ni por comisión. */
  .lista-depi > div{ display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sp-2);
                     padding:3px 0 3px var(--sp-3); font-size:var(--fs-sm); }
  .lista-depi .det{ margin-left:auto; color:var(--text-tenue); }

  /* Un día adentro del ciclo: rótulo, horas y sus trabajos debajo. */
  .dia{ padding:var(--sp-3) 0; border-bottom:1px solid var(--border-sutil); }
  .dia:last-child{ border-bottom:none; }
  /* Un día en el que no pasó nada: está porque la semana tiene siete, no porque
     haya algo que mirar. Un renglón y apagado. */
  .dia.vacio-dia{ padding:var(--sp-2) 0; }
  .dia.vacio-dia .dia-cab b{ font-weight:var(--fw-normal); color:var(--text-tenue); }
  .dia.vacio-dia .acciones-dia{ margin-left:auto; }
  /* Hoy es el día que se viene a cargar: se encuentra sin leer la columna. */
  .dia.hoy > .dia-cab b{ color:var(--acento); }
  .dia-resumen{ margin-top:2px; font-size:var(--fs-sm); color:var(--text-tenue); }
  .dia-cab{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); }
  .dia-cab b{ min-width:110px; }
  .dia-cab .plata{ margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dia-horas{ display:flex; align-items:center; gap:6px; color:var(--text-tenue);
              font-size:var(--fs-sm); }
  .dia-horas .valor{ color:var(--text-titulo); font-weight:var(--fw-bold); }
  .dia-horas .rot-horas{ color:var(--text-tenue); }
  .dia-horas.falta .valor{ color:var(--danger); }
  .dia .trabajos{ margin-top:var(--sp-2); padding-left:var(--sp-3);
                  border-left:2px solid var(--border-sutil); }
  .trabajo{ display:grid; grid-template-columns:minmax(0,1fr) auto auto;
            align-items:center; gap:var(--sp-2); padding:var(--sp-2) 0; }
  .trabajo + .trabajo{ border-top:1px dashed var(--border-sutil); }
  .trabajo .que{ min-width:0; }
  .trabajo .que b{ display:block; }
  .trabajo .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .trabajo.sin-tiempo{ background:var(--rojo-bg); border-radius:var(--r-md);
                       padding-left:var(--sp-2); padding-right:var(--sp-2); }
  .falta-tiempo{ font-size:var(--fs-xs); color:var(--danger); text-transform:uppercase;
                 letter-spacing:.04em; }
  /* La comisión de un trabajo sin duración se muestra igual, apagada: el número
     ya se sabe y esconderlo hacía parecer que ese trabajo no valía nada. */
  .plata.no-cuenta{ color:var(--text-tenue); }
  .btn-mini{ font-size:var(--fs-sm); padding:3px 10px; }
  /* Marca de "esto no es una semana entera": un saldo que quedó de un pago
     parcial, o el pago parcial mismo en el historial. */
  .saldo-de{
    display:inline-block; padding:1px 7px; border-radius:var(--r-full);
    font-size:var(--fs-xs); font-weight:var(--fw-normal); text-transform:uppercase;
    letter-spacing:.04em; vertical-align:middle;
    background:var(--bg-sutil); color:var(--text-tenue); border:1px solid var(--border-sutil);
  }
  .dia-acciones{ margin-top:var(--sp-2); }

  .sub-h{ margin:var(--sp-4) 0 var(--sp-2); font-size:var(--fs-base);
          font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:.04em;
          color:var(--text-tenue); }
  .vacio{ padding:var(--sp-4); text-align:center; color:var(--text-tenue); }

  /* Quién abrió, arriba a la derecha, donde la dueña tiene el desplegable. */
  .quien-nombre{ font-weight:var(--fw-bold); }

  /* Fila de una empleada en la vista de la dueña: nombre, de qué se compone lo
     que se le debe, el total y el botón para entrar. Misma grilla que .fila-dato
     para que las dos listas de la pantalla se lean parejas. */
  .fila-emp{
    display:grid; grid-template-columns:minmax(0,1fr) auto auto;
    align-items:center; gap:var(--sp-2);
    padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil);
  }
  .fila-emp b{ display:block; }
  .fila-emp .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .fila-emp .plata{ font-variant-numeric:tabular-nums; white-space:nowrap;
                    text-align:right; font-weight:var(--fw-bold); }
  .fila-emp.abierta{ background:var(--bg-sutil); }
  .cierre{ margin-top:var(--sp-4); padding-top:var(--sp-3);
           border-top:1px solid var(--border-sutil);
           display:flex; flex-wrap:wrap; gap:var(--sp-2); align-items:center; }
  .cierre .nota{ flex:1 1 220px; }
  .cierre .aviso{ flex:1 1 100%; font-size:var(--fs-sm); color:var(--text-tenue); }
  /* El detalle de un cierre va metido adentro de la lista y hundido, para que se
     vea que pertenece a la fila de arriba y no que es otra sección. */
  .detalle-liq{ padding:0 0 var(--sp-3) var(--sp-3);
                border-left:2px solid var(--border-sutil); margin:var(--sp-2) 0 var(--sp-3); }
  .detalle-liq .sub-h{ margin-top:var(--sp-2); }
  .detalle-liq .mins{ color:var(--text-tenue); font-size:var(--fs-sm); }
  .vacio b{ display:block; color:var(--text-titulo); margin-bottom:var(--sp-1); }

  .agregar{ display:flex; flex-wrap:wrap; gap:var(--sp-2); align-items:flex-end;
            margin-top:var(--sp-3); padding-top:var(--sp-3);
            border-top:1px solid var(--border-sutil); }
  /* min-width:0 en cada casillero: sin eso el desplegable de ítems, que tiene
     nombres largos, se estira por encima del rótulo del casillero de al lado y
     se lee "CANT" pisado por el nombre del trabajo. */
  .agregar > div{ min-width:110px; }
  .agregar > div{ display:flex; flex-direction:column; min-width:0; }
  .agregar label{ margin-bottom:2px; }
  .agregar select, .agregar input{ width:100%; max-width:100%; }
  .agregar .ancho{ flex:2 1 220px; }

  /* Las dos solapas de la dueña, como las de Depilación */
  .solapas{ display:flex; gap:28px; margin-bottom:var(--sp-5); flex-wrap:wrap;
            border-bottom:1px solid var(--border-sutil); }
  .solapas button{ padding:10px 2px; margin-bottom:-1px; background:transparent; border:0;
                   border-bottom:2px solid transparent; border-radius:0;
                   color:var(--text-tenue); font-size:var(--fs-lg); }
  .solapas button:hover{ background:transparent; color:var(--text-titulo); }
  .solapas button.on{ border-bottom-color:var(--bronce-400); color:var(--text-titulo); }
  .hoja > .card + .card{ margin-top:var(--sp-8); padding-top:var(--sp-6);
                         border-top:1px solid var(--border-sutil); }

  /* La puerta: el nombre en una ficha grande y el código en un teclado. Se usa
     parada y con las manos ocupadas: nada chico. */
  .puerta{ margin-top:var(--sp-5); }
  .puerta-aviso{ text-align:center; color:var(--text-suave); margin:0 0 var(--sp-4); }
  .puerta-caja{ max-width:560px; margin:0 auto; text-align:center; }
  .nombres{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:var(--sp-3); }
  .nombre-tile{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px 10px 16px;
                background:var(--bg-tile); color:var(--text-titulo); border-radius:16px; font-size:var(--fs-lg); }
  .nombre-tile:hover{ background:var(--bg-tile-hover); color:var(--text-titulo); }
  .nombre-tile small{ font-size:var(--fs-xs); font-weight:var(--fw-normal); color:var(--text-tenue); margin-top:-6px; }
  .inicial{ width:54px; height:54px; border-radius:50%; display:grid; place-items:center;
            font-family:var(--font-display); font-size:24px; background:var(--bg-elegido); color:var(--text-marca);
            box-shadow:inset 0 0 0 1.5px var(--border-marca); }
  .pin-caja{ max-width:320px; margin:0 auto; }
  .pin-caja .volver{ background:transparent; color:var(--text-tenue); padding:6px 10px; font-weight:var(--fw-medium); }
  .pin-caja .volver:hover{ background:var(--bg-sutil); color:var(--text-titulo); }
  .pin-caja h3{ margin:10px 0 0; font-size:var(--fs-2xl); }
  .pin-caja p{ margin:4px 0 0; color:var(--text-suave); }
  .puntos{ display:flex; justify-content:center; gap:14px; margin:22px 0 8px; min-height:18px; }
  .puntos i{ width:14px; height:14px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--border); }
  .puntos i.lleno{ background:var(--text-titulo); box-shadow:none; }
  .puntos.mal{ animation:sacudir .35s; }
  @keyframes sacudir{ 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-4px)} }
  @media (prefers-reduced-motion:reduce){ .puntos.mal{ animation:none; } }
  .pin-caja .pin-error{ color:var(--danger); font-size:var(--fs-sm); min-height:20px; margin:0 0 8px; }
  .teclado{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .teclado button{ height:64px; font-size:26px; font-family:var(--font-display); font-weight:var(--fw-normal);
                   background:var(--bg-tile); color:var(--text-titulo); border-radius:16px; }
  .teclado button:hover{ background:var(--bg-tile-hover); color:var(--text-titulo); }
  .teclado button.chico{ background:transparent; color:var(--text-suave); }
  .teclado button.ok{ background:var(--acento-fuerte); color:var(--text-sobre-oro);
                      font-size:var(--fs-md); font-family:var(--font-texto); font-weight:var(--fw-bold); }
  .teclado .ico{ width:24px; height:24px; }

  /* Valores y comisiones: tablas con su título por columna */
  .tabla-v{ width:100%; border-collapse:collapse; font-size:var(--fs-md); }
  .tabla-v th{ text-align:left; padding:8px 6px; font-size:var(--fs-xs); font-weight:var(--fw-bold);
               text-transform:uppercase; letter-spacing:.05em; color:var(--text-tenue);
               border-bottom:1px solid var(--border-sutil); white-space:nowrap; }
  .tabla-v th.c{ white-space:normal; line-height:1.2; }
  .tabla-v td{ padding:9px 6px; border-bottom:1px solid var(--border-sutil); vertical-align:middle; }
  .tabla-v .n{ text-align:right; font-variant-numeric:tabular-nums; }
  .tabla-v .c{ text-align:center; width:48px; }
  .tabla-v b{ color:var(--text-titulo); font-weight:var(--fw-bold); display:block; }
  .tabla-v .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .tabla-v .codigo{ font-variant-numeric:tabular-nums; letter-spacing:.15em; font-weight:var(--fw-bold); color:var(--text-titulo); }
  .tabla-v input[type=checkbox]{ width:20px; height:20px; accent-color:var(--bronce-500); }
  .tabla-v tr.elegido td{ background:var(--bg-elegido); }
  .valor-ed{ display:inline-flex; align-items:center; justify-content:flex-end; gap:4px; }
  .valor-ed .v{ display:inline; }
  .valor-ed .falta{ color:var(--danger); font-weight:var(--fw-bold); font-size:var(--fs-sm); }
  .valor-ed input{ width:110px; text-align:right; padding:6px 10px; }
  .lapiz{ background:transparent; color:var(--text-tenue); padding:6px; }
  .lapiz:hover{ background:var(--bg-sutil); color:var(--text-titulo); }
  .lapiz .ico{ width:16px; height:16px; }
  .filtros-c{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:var(--sp-2) 0 var(--sp-3); }
  .filtros-c .sep{ width:1px; height:22px; background:var(--border-sutil); margin:0 6px; }
  .filtros-c .chip{ padding:6px 12px; border-radius:999px; background:var(--bg-tile); color:var(--text);
                    font-size:var(--fs-sm); font-weight:var(--fw-bold); }
  .filtros-c .chip:hover{ background:var(--bg-tile-hover); color:var(--text-titulo); }
  .filtros-c .chip.on{ background:var(--bg-elegido); color:var(--text-marca); box-shadow:inset 0 0 0 1.5px var(--border-marca); }
  #buscaServ{ width:100%; }
  .barra-c{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; margin-bottom:10px;
            border-radius:12px; background:var(--bg-elevado); box-shadow:var(--sombra-elevada);
            position:sticky; top:calc(var(--alto-header, 0px) + 8px); z-index:5; }
  .barra-c b{ color:var(--text-titulo); margin-right:6px; }
  .barra-c input{ width:70px; text-align:right; padding:6px 8px; }
  .barra-c .lapiz{ margin-left:auto; }

  @media (max-width:520px){
    .valor-ed input{ width:90px; }
    .tabla-v th, .tabla-v td{ padding-left:4px; padding-right:4px; }
  }

  @media (max-width:600px){
    .fila-dato{ grid-template-columns:1fr auto; row-gap:6px; }
    .fila-dato .mins{ grid-column:1; }
    .fila-dato .plata{ grid-column:2; grid-row:2; }
  }
</style>
</head><body>
<header>
  <span>Sueldos</span>
  <nav class="menu"></nav>
</header>

<!-- La puerta. Con el usuario empleado, la pantalla no muestra nada hasta que
     alguien dice quién es y pone su código: en el local hay una sola tablet y un
     solo login, así que sin esto el sueldo de una queda a la vista de la otra y
     de cualquiera que agarre el aparato. Se pide CADA vez que se entra, y el
     permiso no se guarda en el navegador: vive mientras la pantalla está
     abierta. El candado de verdad está en el servidor. -->
<div class="wrap" id="puerta" hidden>
  <div class="card puerta">
    <h2 style="text-align:center;">¿Quién sos?</h2>
    <p class="puerta-aviso" id="puertaAyuda" hidden></p>
    <div id="puertaCuerpo"></div>
  </div>
</div>

<div class="wrap" id="todo">
  <div class="solapas" data-dueno>
    <button class="on" data-hoja="hojaSueldos">Sueldos</button>
    <button data-hoja="hojaValores">Valores y comisiones</button>
  </div>

  <div class="hoja" id="hojaSueldos">
  <!-- La dueña entra a otra cosa: a ver a quién le debe cuánto y a cerrar. El
       detalle de una es el mismo que ve la empleada, así que la tarjeta de abajo
       la usan las dos y lo que cambia es lo que la rodea. -->
  <div class="card" id="cardDueno" data-dueno style="display:none;">
    <div class="card-head con-datos">
      <div class="titulo">
        <h2>A pagar</h2>
      </div>
      <div class="kpis" id="kpisDueno"></div>
    </div>
    <div id="listaEmpleadas"></div>
  </div>

  <div class="card">
    <div class="card-head con-datos">
      <div class="titulo">
        <h2 id="tituloDetalle">Sueldos</h2>
      </div>
      <div class="quien">
        <label for="quien" id="rotuloQuien">Quién sos</label>
        <select id="quien"></select>
      </div>
      <div class="quien-empleada" id="quienEmpleada" hidden></div>
    </div>
    <div class="totales" id="totales"></div>
    <div id="cuerpo"></div>
    <div id="cierre" data-dueno></div>
  </div>

  <!-- Lo ya pagado lo miran las dos: la dueña todos los cierres, la empleada los
       suyos (el servidor no le contesta otra cosa). -->
  <div class="card" id="cardLiquidaciones" style="display:none;">
    <div class="card-head con-datos">
      <div class="titulo"><h2 id="tituloPagado">Ya pagado</h2></div>
      <button class="b-out" id="verPagado">Ver</button></div>
    <div id="listaLiq" style="display:none;"></div>
  </div>
  </div>

  <!-- Lo que se le paga a cada una: el valor hora y la comisión de cada servicio.
       Sin valores generales: cada empleada tiene el suyo y cada servicio el suyo. -->
  <div class="hoja" id="hojaValores" data-dueno hidden>
    <div class="card">
      <div class="card-head"><h2>Empleadas</h2></div>
      <div id="tablaEmpleadas"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Comisiones</h2></div>
      <div id="tablaComisiones"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/auth.js"></script>
<script src="/static/js/sueldos.js"></script>
</body></html>
