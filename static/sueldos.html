<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Sueldos — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  .wrap{ max-width:900px; }
  .card-head{ margin-bottom:var(--sp-4); }
  .card-head h2{ margin:0; }
  .card-head p{ margin:var(--sp-1) 0 0; font-size:var(--fs-base); color:var(--text-tenue); max-width:64ch; }

  .quien{ display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; }
  .quien label{ margin:0; }
  .quien select{ width:auto; min-width:170px; }

  /* El total va arriba y grande: es lo que la empleada entra a mirar. Todo lo
     de abajo es el detalle de cómo se llegó a ese número. */
  .totales{ display:flex; flex-wrap:wrap; gap:var(--sp-3); }
  .totales .kpi{ flex:1 1 150px; }
  .kpi.destacado{ background:var(--bg-header); border-color:var(--acento); }
  .kpi.destacado .val{ color:var(--acento); }
  .kpi .nota{ display:block; margin-top:2px; font-size:var(--fs-xs); color:var(--text-tenue); }

  .fila-dato{
    display:grid; grid-template-columns:minmax(0,1fr) auto auto;
    align-items:center; gap:var(--sp-2);
    padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil);
  }
  .fila-dato .que{ min-width:0; }
  .fila-dato .que b{ display:block; }
  .fila-dato .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .fila-dato .plata{ font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; min-width:72px; }
  /* Un día que apareció solo, todavía sin horas cargadas: se ve que falta. */
  .fila-dato.sugerido .que b{ color:var(--text-tenue); }

  .mins{ display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .mins input{ width:56px; text-align:right; }
  .mins .u{ font-size:var(--fs-sm); color:var(--text-tenue); }

  .sin-comp{
    display:inline-block; margin-left:6px; padding:1px 6px; border-radius:var(--r-full);
    font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em;
    background:var(--rojo-bg); color:var(--danger); border:1px solid var(--rojo-borde);
    vertical-align:middle;
  }
  a.ver-comp{ color:var(--acento); text-decoration:none; white-space:nowrap; }

  .sub-h{ margin:var(--sp-4) 0 var(--sp-2); font-size:var(--fs-base);
          font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:.04em;
          color:var(--text-tenue); }
  .vacio{ padding:var(--sp-4); text-align:center; color:var(--text-tenue); }
  .vacio b{ display:block; color:var(--text-titulo); margin-bottom:var(--sp-1); }

  .agregar{ display:flex; flex-wrap:wrap; gap:var(--sp-2); align-items:flex-end;
            margin-top:var(--sp-3); padding-top:var(--sp-3);
            border-top:1px solid var(--border-sutil); }
  /* min-width:0 en cada casillero: sin eso el desplegable de ítems, que tiene
     nombres largos, se estira por encima del rótulo del casillero de al lado y
     se lee "CANT" pisado por el nombre del trabajo. */
  .agregar > div{ min-width:110px; }
  .agregar > div{ display:flex; flex-direction:column; min-width:0; }
  .agregar label{ margin-bottom:2px; }
  .agregar select, .agregar input{ width:100%; max-width:100%; }
  .agregar .ancho{ flex:2 1 220px; }

  @media (max-width:600px){
    .fila-dato{ grid-template-columns:1fr auto; row-gap:6px; }
    .fila-dato .mins{ grid-column:1; }
    .fila-dato .plata{ grid-column:2; grid-row:2; }
  }
</style>
</head><body>
<header>
  <span>👛 Sueldos</span>
  <nav class="menu"></nav>
</header>

<div class="wrap">
  <div class="card">
    <div class="card-head con-datos">
      <div class="titulo">
        <h2>👛 Sueldos</h2>
        <p>Cargá tus horas y cuánto duró cada trabajo. El total se actualiza solo.</p>
      </div>
      <div class="quien">
        <label for="quien">Quién sos</label>
        <select id="quien"></select>
      </div>
    </div>
    <div class="totales" id="totales"></div>
    <div id="cuerpo"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/auth.js"></script>
<script src="/static/js/sueldos.js"></script>
</body></html>
