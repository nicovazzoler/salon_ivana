<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f1f1f"><title>Agenda — Peluquería</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  /* --- barra de navegación de fechas --- */
  .navbar{ display:flex; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-4); }
  .navbar .lbl{ flex:1; text-align:center; font-weight:var(--fw-strong); color:var(--text-titulo); }
  .navbar button{ background:var(--bg-sutil); color:var(--text); }
  .nav-cal{ position:relative; display:inline-flex; align-items:center; cursor:pointer; padding:6px 8px; background:var(--bg-sutil); border:1px solid var(--border); border-radius:var(--r-md); }
  .nav-cal input[type=date]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .navbar .lbl{ display:flex; align-items:center; gap:var(--sp-3); }
  .navbar .lbl::before,
  .navbar .lbl::after{ content:""; flex:1; height:1px; background:var(--oro-a25); }

  /* --- formulario de turno --- */
  .form-turno{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; }
  .campo.chico input{ width:90px; }
  .dia-panel{ display:flex; flex-wrap:wrap; align-items:flex-start; gap:var(--sp-3); margin-bottom:var(--sp-4); }
  .dia-panel > .card{ margin-bottom:0; }
  #formCard{ flex:1.4 1 300px; }
  #notasDia{ flex:1 1 240px; display:flex; flex-direction:column; }
  #listaNotas{ flex:1; min-height:0; overflow-y:auto; }
  .form-turno .campo{ flex:1 1 130px; }

  /* --- vista DÍA --- */
  .turno-card{
    display:flex; align-items:flex-start; gap:var(--sp-3);
    padding:var(--sp-3); margin-bottom:var(--sp-2);
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
  }
  .turno-card.cancelado{ opacity:.5; }
  .turno-hora{ min-width:52px; font-weight:var(--fw-strong); color:var(--acento); }
  .turno-body{ flex:1; }
  .turno-cliente{ font-weight:var(--fw-bold); color:var(--acento); }
  .turno-servicio{ font-size:var(--fs-md); color:var(--text); }
  .turno-peluquero,
  .turno-notas{ margin-top:2px; font-size:var(--fs-sm); color:var(--text-tenue); }
  .turno-actions{ display:flex; flex-direction:column; gap:6px; }
  .turno-actions button{ padding:5px 10px; font-size:var(--fs-sm); }
  .btn-cancelar{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .sin-turnos{ padding:var(--sp-5); text-align:center; color:var(--text-tenue); }

  /* --- vista SEMANA: grilla de horas × días --- */
  .grid-sem{ display:grid; font-size:var(--fs-xs); border-top:2px solid var(--acento); }
  .gs-hora{ padding:2px 6px 0 0; text-align:right; font-size:var(--fs-xs); color:var(--text-tenue); }
  .gs-cell{
    min-height:32px; padding:2px;
    border-left:1px solid var(--oro-a35);
  }
  .gs-dayhead{
    margin:1px; padding:3px 0;
    text-align:center; font-weight:var(--fw-bold);
    color:var(--acento);
    border:1px solid var(--oro-a35);
    border-radius:var(--r-md);
  }
  .gs-dayhead .nota-ind{ font-size:11px; }
  .gs-turno{
    padding:2px 4px;
    background:var(--oro-a12);
    border-left:3px solid var(--acento);
    border-radius:0 4px 4px 0;
    overflow:hidden; cursor:pointer;
  }
  .gs-turno .c{ font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--acento); }
  .gs-turno .s{ font-size:10px; color:var(--text-tenue); }

  .gs-notacol{ border-top:2px solid var(--acento); }
  .gs-nota{
    margin:2px 0; padding:2px 4px;
    background:var(--oro-a12);
    border-left:3px solid var(--acento);
    border-radius:0 4px 4px 0;
    font-size:10px; color:var(--text);
  }

  /* --- vista MES --- */
  .grid-mes{ display:grid; grid-template-columns:repeat(7,1fr); border-top:2px solid var(--acento); }
  .gm-head{
    margin:1px; padding:3px 0;
    text-align:center; font-size:var(--fs-xs);
    color:var(--acento);
    border:1px solid var(--oro-a35);
    border-radius:var(--r-md);
  }
  .gm-cell{
    min-height:64px; padding:6px; cursor:pointer;
    border-bottom:1px solid var(--oro-a35);
    border-left:1px solid var(--oro-a35);
  }
  .gm-cell:hover{ background:var(--bg-hover); }
  .gm-cell.fuera{ background:var(--blanco-a04); cursor:default; }   /* días de otro mes */
  .gm-num{ font-weight:var(--fw-bold); }
  .gm-num.hoy{
    display:flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%;
    background:var(--acento); color:var(--text-invertido);
  }
  .gm-count{
    display:flex; align-items:center; gap:var(--sp-1);
    margin-top:var(--sp-1); font-size:var(--fs-xs); color:var(--text-tenue);
  }
  .gm-dot{ width:6px; height:6px; border-radius:50%; background:var(--acento); }

  /* --- modal de detalle --- */
  .modal-bg{
    position:fixed; inset:0; z-index:var(--z-modal);
    display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.6);
  }
  .modal-bg.show{ display:flex; }
  .modal{
    width:90%; max-width:340px;
    padding:var(--sp-5);
    background:var(--bg-card);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--r-xl);
  }
  /* --- notas del mes --- */
  .gm-nota{ font-size:11px; line-height:1; margin-top:2px; }
  .feed-notas{ margin-top:var(--sp-4); }
  .feed-titulo{
    display:flex; align-items:center; gap:var(--sp-3);
    margin-bottom:var(--sp-3);
    font-weight:var(--fw-bold); color:var(--text-titulo);
  }
  .feed-titulo::before,
  .feed-titulo::after{
    content:""; flex:1; height:1px; background:var(--oro-a25);
  }
  .feed-lista{ max-height:220px; overflow-y:auto; }
  .feed-item{ display:flex; gap:var(--sp-3); padding:var(--sp-2) 0; border-top:1px solid var(--border); }
  .feed-fecha{ min-width:110px; color:var(--acento); font-size:var(--fs-sm); }
  .feed-texto{ flex:1; }
  
  
  /* --- notas del día --- */
  .nota-form{ display:flex; gap:8px; align-items:flex-start; }
  .nota-form textarea{ flex:1; resize:vertical; }
  .nota-item{
    display:flex; justify-content:space-between; align-items:flex-start; gap:var(--sp-3);
    padding:var(--sp-2) 0;
    border-bottom:1px solid var(--border);
  }
  .nota-item .cuerpo{ flex:1; }
  .nota-item .meta{ margin-top:2px; font-size:var(--fs-xs); color:var(--text-tenue); }
  .nota-item .btn-borrar{
    background:transparent; border:1px solid var(--danger); color:var(--danger);
    padding:3px 8px; font-size:var(--fs-sm);
  }

  /* --- notas de la semana --- */
  .notas-sem{ margin-top:var(--sp-4); }
  .notas-sem-cols{ display:flex; flex-wrap:wrap; gap:12px; }
  .notas-sem-col{ flex:1; min-width:150px; }
  .notas-sem-dia{
    margin-bottom:6px; padding-bottom:4px;
    font-size:var(--fs-sm); font-weight:var(--fw-bold); color:var(--acento);
    border-bottom:1px solid var(--border);
  }
</style>
</head><body>
<header>
  <span>📅 Agenda</span>
  <nav class="menu">
    <a href="/facturar">Facturar</a>
    <a href="/clientes">Clientes</a>
    <a href="/agenda">Agenda</a>
    <a href="#" onclick="logout();return false;">Salir</a>
  </nav>
</header>
<div class="wrap">

  <div class="seg">
    <button id="modoDia" class="on">Día</button>
    <button id="modoSemana">Semana</button>
    <button id="modoMes">Mes</button>
  </div>

  <div class="navbar">
    <button id="btnPrev">←</button>
    <span class="lbl" id="rangoLabel"></span>
    <button id="btnNext">→</button>
    <label class="nav-cal" title="Ir a una fecha">📅
      <input type="date" id="fechaPicker">
    </label>
  </div>

  <div class="dia-panel" id="diaPanel">
    <!-- formulario (solo en vista día) -->
    <div class="card" id="formCard">
      <div class="form-turno">
        <div class="campo chico"><label>Hora</label><input type="time" id="fHora" value="10:00"></div>
        <div class="campo"><label>Cliente</label><input id="fCliente" list="clientesList" placeholder="Nombre"><datalist id="clientesList"></datalist></div>
        <div class="campo"><label>Servicio</label><input id="fServicio" list="serviciosList" placeholder="Corte, color..."><datalist id="serviciosList"></datalist></div>
        <div class="campo"><label>Peluquero/a <span class="muted">(opc)</span></label><input id="fPeluquero"></div>
        <div class="campo"><label>Notas <span class="muted">(opc)</span></label><input id="fNotas"></div>
        <button id="btnAgregar">Agendar</button>
      </div>
    </div>
    <!-- notas del día -->
    <div class="card" id="notasDia">
      <div class="nota-form">
        <textarea id="notaTexto" rows="1" placeholder="Escribí una nota del día…"></textarea>
        <button id="btnNota">Anotar</button>
      </div>
      <div id="listaNotas"></div>
    </div>
  </div>
  
  <div id="vista"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script>
requireLogin(); pintarNav();
const $=s=>document.querySelector(s);
const DIAS_SEM=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DIAS_SEM_LARGO=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
let modo="dia", fechaActual=hoyStr(), SERVICIOS=[], CLIENTES=[];

function hoyStr(){ const d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

async function init(){
  try{
    const cat=await (await authFetch("/api/catalogo")).json();
    SERVICIOS=cat.map(i=>i.nombre);
    $("#serviciosList").innerHTML=SERVICIOS.map(s=>`<option value="${s}">`).join("");
    CLIENTES=await (await authFetch("/api/clientes")).json();
    $("#clientesList").innerHTML=CLIENTES.map(c=>`<option value="${c.nombre}">`).join("");
  }catch(e){}
  render();
}

// --- navegación según modo ---
$("#modoDia").onclick=()=>setModo("dia");
$("#modoSemana").onclick=()=>setModo("semana");
$("#modoMes").onclick=()=>setModo("mes");
function setModo(m){
  modo=m;
  ["Dia","Semana","Mes"].forEach(x=>$("#modo"+x).classList.toggle("on", m===x.toLowerCase()));
  $("#diaPanel").style.display = (m==="dia") ? "flex" : "none";
  render();
}
$("#fechaPicker").onchange=e=>{ fechaActual=e.target.value; render(); };
$("#btnPrev").onclick=()=>mover(-1);
$("#btnNext").onclick=()=>mover(1);
function mover(dir){
  const d=parseISO(fechaActual);
  if(modo==="dia") d.setDate(d.getDate()+dir);
  else if(modo==="semana") d.setDate(d.getDate()+7*dir);
  else d.setMonth(d.getMonth()+dir);
  fechaActual=iso(d); render();
}

// devuelve el lunes de la semana de la fecha dada
function lunesDeSemana(d){
  const x=new Date(d); const dow=x.getDay(); 
  const diff=(dow===0)? -6 : (1-dow); 
  x.setDate(x.getDate()+diff); return x;
}

async function render(){
  $("#fechaPicker").value=fechaActual;
  if(modo==="dia") return renderDia();
  if(modo==="semana") return renderSemana();
  return renderMes();
}


// ---------- NOTAS DEL DÍA ----------

async function renderNotasDia(){
  const notas = await (await authFetch("/api/notas?fecha="+fechaActual)).json();
  const cont = $("#listaNotas");
  if(notas.length === 0){ cont.innerHTML = ""; return; }
  cont.innerHTML = "";
  notas.forEach(n => {
    const div = document.createElement("div");
    div.className = "nota-item";
    div.innerHTML = `
      <div class="cuerpo">
        <div>${n.texto}</div>
      </div>
      <button class="btn-borrar">✕</button>`;
    div.querySelector(".btn-borrar").onclick = async () => {
      if(!confirm("¿Borrar esta nota?")) return;
      await authFetch("/api/notas/"+n.id, { method: "DELETE" });
      renderNotasDia();
    };
    cont.appendChild(div);
  });
}

// -- CSS ---
function ajustarAltoNotas(){
  const nota=$("#notasDia"), form=$("#formCard");
  if(modo!=="dia") return;
  nota.style.height="auto";                     // reseteo para medir sin arrastrar lo anterior
  if(nota.offsetTop === form.offsetTop){         // ¿están lado a lado?
    nota.style.height = form.offsetHeight + "px";  // clavo la altura del turno
  }
}
window.addEventListener("resize", ajustarAltoNotas);

// ---------- VISTA DÍA ----------
async function renderDia(){
  const dt=parseISO(fechaActual);
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  let pref="";
  if(fechaActual===hoyStr()) pref="Hoy, ";
  $("#rangoLabel").textContent=cap(`${pref}${dias[dt.getDay()]} ${dt.getDate()} de ${MESES[dt.getMonth()]}`);
  renderNotasDia();
  ajustarAltoNotas();
  const turnos=await (await authFetch("/api/turnos?fecha="+fechaActual)).json();
  const activos=turnos.filter(t=>t.activo), cancel=turnos.filter(t=>!t.activo);
  const cont=$("#vista");
  if(turnos.length===0){ cont.innerHTML='<div class="sin-turnos">No hay turnos para este día.</div>'; return; }
  cont.innerHTML="";
  [...activos,...cancel].forEach(t=>{
    const div=document.createElement("div"); div.className="turno-card"+(t.activo?"":" cancelado");
    div.innerHTML=`
      <div class="turno-hora">${t.hora}</div>
      <div class="turno-body">
        <div class="turno-cliente cap">${t.cliente}${t.cliente_id?` <a href="/cuenta?id=${t.cliente_id}" style="font-size:12px;color:var(--acento);margin-left:6px;"> Ver cuenta</a>`:''}</div>
        <div class="turno-servicio cap">${t.servicio}</div>
        ${t.peluquero?`<div class="turno-peluquero cap">✂ ${t.peluquero}</div>`:''}
        ${t.notas?`<div class="turno-notas cap">${t.notas}</div>`:''}
        ${!t.activo?'<div style="font-size:11px;color:var(--danger);margin-top:4px;">Cancelado</div>':''}
      </div>
      <div class="turno-actions">
        ${t.activo?`<button class="btn-editar">Editar</button><button class="btn-cancelar">Cancelar</button>`:''}
      </div>`;
    if(t.activo){
      div.querySelector(".btn-cancelar").onclick=async()=>{
        if(!confirm(`¿Cancelar el turno de ${t.cliente}?`))return;
        await authFetch("/api/turnos/"+t.id,{method:"DELETE"}); toast("Turno cancelado"); renderDia();
      };
      div.querySelector(".btn-editar").onclick=()=>cargarEnForm(t);
    }
    cont.appendChild(div);
  });
}

function cargarEnForm(t){
  $("#fHora").value=t.hora; $("#fCliente").value=t.cliente; $("#fServicio").value=t.servicio;
  $("#fPeluquero").value=t.peluquero||""; $("#fNotas").value=t.notas||"";
  const btn=$("#btnAgregar"); btn.textContent="Guardar cambios";
  btn.onclick=async()=>{
    const body=formBody(); if(!body)return;
    await authFetch("/api/turnos/"+t.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    toast("Turno actualizado"); limpiarForm(); renderDia();
  };
  window.scrollTo(0,0);
}
function formBody(){
  const cliente=$("#fCliente").value.trim(), servicio=$("#fServicio").value.trim();
  if(!cliente||!servicio){ toast("Completá cliente y servicio"); return null; }
  return { fecha:fechaActual, hora:$("#fHora").value, cliente,
    cliente_id:(CLIENTES.find(c=>c.nombre.toLowerCase()===cliente.toLowerCase())||{}).id||null,
    servicio, peluquero:$("#fPeluquero").value.trim()||null, notas:$("#fNotas").value.trim()||null };
}
function limpiarForm(){
  $("#fHora").value="10:00"; $("#fCliente").value=""; $("#fServicio").value="";
  $("#fPeluquero").value=""; $("#fNotas").value="";
  const btn=$("#btnAgregar"); btn.textContent="Agendar"; btn.onclick=agregarTurno;
}
async function agregarTurno(){
  const body=formBody(); if(!body)return;
  await authFetch("/api/turnos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  toast(`Turno de ${body.cliente} agendado`); limpiarForm(); renderDia();
}
$("#btnAgregar").onclick=agregarTurno;


async function agregarNota(){
  const texto = $("#notaTexto").value.trim();
  if(!texto) return;
  await authFetch("/api/notas", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({texto, fecha: fechaActual})});
  $("#notaTexto").value = "";
  toast("Nota guardada");
  renderNotasDia();
}
$("#btnNota").onclick = agregarNota;

// ---------- VISTA SEMANA (grilla) ----------
async function renderSemana(){
  const ini=lunesDeSemana(parseISO(fechaActual));
  const fechas=[]; for(let i=0;i<7;i++){ const d=new Date(ini); d.setDate(d.getDate()+i); fechas.push(iso(d)); }
  const desde=fechas[0], hasta=fechas[6];
  $("#rangoLabel").textContent=`Semana del ${parseISO(desde).getDate()} al ${parseISO(hasta).getDate()} de ${MESES[parseISO(hasta).getMonth()]}`;
  const turnos=(await (await authFetch(`/api/turnos?desde=${desde}&hasta=${hasta}`)).json()).filter(t=>t.activo);
  const notas = await (await authFetch(`/api/notas?desde=${desde}&hasta=${hasta}`)).json();      
  const fechasConNota = new Set(notas.map(n => n.fecha));         

  // rango horario: 8 a 20, estirado si hay turnos fuera
  let hMin=8, hMax=20;
  turnos.forEach(t=>{ const h=parseInt(t.hora.split(":")[0]); if(h<hMin)hMin=h; if(h>hMax)hMax=h; });
  const horas=[]; for(let h=hMin;h<=hMax;h++) horas.push(h);

  let html=`<div class="grid-sem" style="grid-template-columns:44px repeat(7,1fr);">`;
  html+=`<div></div>`;
  fechas.forEach((f,i)=>{ const d=parseISO(f);
    const ind = fechasConNota.has(f) ? ' <span class="nota-ind">📝</span>' : '';
    html+=`<div class="gs-dayhead">${DIAS_SEM_LARGO[i]} ${d.getDate()}${ind}</div>`;
  });
  horas.forEach(h=>{
    html+=`<div class="gs-hora">${h}:00</div>`;
    fechas.forEach(f=>{
      const tsHora=turnos.filter(t=>t.fecha===f && parseInt(t.hora.split(":")[0])===h);
      html+=`<div class="gs-cell">`+tsHora.map(t=>`<div class="gs-turno" data-id="${t.id}"><div class="c">${t.hora} ${t.cliente}</div><div class="s">${t.servicio}</div></div>`).join("")+`</div>`;
    });
  });

  html+=`</div>`;

  const diasConNotas = fechas.filter(f => notas.some(n => n.fecha === f)); 
  if(diasConNotas.length > 0){
    html += `<div class="card notas-sem"><div class="feed-titulo">Notas de la semana</div><div class="notas-sem-cols">`;
    diasConNotas.forEach(f => {
      const i = fechas.indexOf(f);                    
      const ns = notas.filter(n => n.fecha === f);             
      html += `<div class="notas-sem-col">
        <div class="notas-sem-dia">${DIAS_SEM[i]} ${parseISO(f).getDate()}</div>
        ${ns.map(n => `<div class="gs-nota">${n.texto}</div>`).join("")}
      </div>`;
    });
    html += `</div></div>`;
  }

  $("#vista").innerHTML=html;
  $("#vista").querySelectorAll(".gs-turno").forEach(el=>{
    el.onclick=()=>{ const t=turnos.find(x=>x.id==el.dataset.id); mostrarTurno(t); };
  });
}

function mostrarTurno(t){
  $("#modalBody").innerHTML=`
    <div style="font-weight:800;font-size:18px;color:var(--text-titulo);">${t.hora} — ${t.cliente}</div>
    <div style="margin:8px 0;">${t.servicio}</div>
    ${t.peluquero?`<div class="muted">✂ ${t.peluquero}</div>`:''}
    ${t.notas?`<div class="muted">${t.notas}</div>`:''}
    ${t.cliente_id?`<div style="margin-top:8px;"><a href="/cuenta?id=${t.cliente_id}" style="color:var(--oro);">Ver cuenta del cliente →</a></div>`:''}
    <button style="margin-top:14px;width:100%;" onclick="$('#modalBg').classList.remove('show')">Cerrar</button>`;
  $("#modalBg").classList.add("show");
}
$("#modalBg").onclick=e=>{ if(e.target.id==="modalBg") $("#modalBg").classList.remove("show"); };



// ---------- VISTA MES (grilla de días) ----------
async function renderMes(){
  const dt=parseISO(fechaActual), año=dt.getFullYear(), mes=dt.getMonth();
  $("#rangoLabel").textContent=cap(`${MESES[mes]} ${año}`);
  const desde=iso(new Date(año,mes,1)), hasta=iso(new Date(año,mes+1,0));
  const turnos=(await (await authFetch(`/api/turnos?desde=${desde}&hasta=${hasta}`)).json()).filter(t=>t.activo);
  const conteo={}; turnos.forEach(t=>{ conteo[t.fecha]=(conteo[t.fecha]||0)+1; });
  const notas = await (await authFetch(`/api/notas?desde=${desde}&hasta=${hasta}`)).json();     
  const fechasConNota = new Set(notas.map(n => n.fecha));

  // armar semanas de lunes a domingo, incluyendo días de otros meses 
  let html=`<div class="grid-mes">`;
  DIAS_SEM_LARGO.forEach(d=>html+=`<div class="gm-head">${d}</div>`);
  const primero=new Date(año,mes,1);
  let cursor=lunesDeSemana(primero);
  const finMes=new Date(año,mes+1,0);
  while(cursor<=finMes){
    for(let i=0;i<7;i++){
      const d=new Date(cursor); d.setDate(d.getDate()+i);
      if(d.getMonth()!==mes){ html+=`<div class="gm-cell fuera"></div>`; continue; }
      const f=iso(d), c=conteo[f]||0, esHoy=(f===hoyStr());
      const ind = fechasConNota.has(f) ? '<div class="gm-nota">📝</div>' : ''; 
      html+=`<div class="gm-cell" data-f="${f}">
        <div class="gm-num ${esHoy?'hoy':''}">${d.getDate()}</div>
        ${c>0?`<div class="gm-count"><span class="gm-dot"></span>${c} turno${c>1?'s':''}</div>`:''}
        ${ind}
      </div>`;
    }
    cursor.setDate(cursor.getDate()+7);
  }
  html+=`</div>`;

  html += `<div class="card feed-notas"><div class="feed-titulo">Notas del mes</div>`;
  if(notas.length === 0){
    html += `<div class="muted">Sin notas este mes.</div></div>`;
  } else {
    const ordenadas = [...notas].sort((a,b) => a.fecha.localeCompare(b.fecha));
    html += `<div class="feed-lista">` + ordenadas.map(n => `
      <div class="feed-item">
        <span class="feed-fecha">${n.fecha.split("-").reverse().join("/")}</span>
        <span class="feed-texto">${n.texto}</span>
      </div>`).join("") + `</div></div>`;
  }

  $("#vista").innerHTML=html;
  $("#vista").querySelectorAll(".gm-cell[data-f]").forEach(el=>{
    el.onclick=()=>{ fechaActual=el.dataset.f; setModo("dia"); };
  });
}




init();
</script>
</body></html>
