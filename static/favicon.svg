<!-- El viewBox va recortado al contorno de la corona, no a 0 0 32 32: en la
     pestaña el icono se dibuja en 16px y cualquier margen sobrante lo achica
     todavía más. Así ocupa todo el cuadrado disponible. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.2 2.4 25.6 26.2">
  <!-- Corona, en el bronce de la marca.

       Pensada para 16px, que es el tamaño real en la pestaña: silueta maciza,
       tres puntas bien separadas y nada de detalle fino, porque a ese tamaño
       se empasta. Va en un solo tono para que se lea igual sobre pestaña
       clara y oscura, sin depender del tema del navegador. -->
  <g fill="#a8862f">
    <!-- puntas -->
    <path d="M4 22.5 L6 10.5 L11.2 17.6 L16 6.5 L20.8 17.6 L26 10.5 L28 22.5 Z"/>
    <!-- perlas en el vértice de cada punta -->
    <circle cx="6"  cy="9.5" r="2.4"/>
    <circle cx="16" cy="5.5" r="2.8"/>
    <circle cx="26" cy="9.5" r="2.4"/>
    <!-- base -->
    <rect x="4" y="23" width="24" height="5" rx="1.6"/>
  </g>
</svg>
