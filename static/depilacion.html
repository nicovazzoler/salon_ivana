<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Depilación — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  /* La pantalla de depilación es la de facturar con todo lo que no se usa
     sacado: zonas, la seña que ya dejó y cobrar. Nada de descuentos, ajustes por
     línea, presupuestos ni productos: el día de depilación se atiende con una
     mano sola y lo que sobra en la pantalla es tiempo. */
  .wrap{ max-width:1100px; }
  .tablero{ display:grid; gap:var(--sp-4); grid-template-columns:minmax(0,1fr) minmax(320px,.8fr); align-items:start; }
  @media (max-width:860px){ .tablero{ grid-template-columns:1fr; } }

  /* ----- la clienta ----- */
  .quien{ display:flex; flex-wrap:wrap; gap:var(--sp-3); align-items:flex-end;
          margin-bottom:var(--sp-3); }
  .quien .campo{ display:flex; flex-direction:column; gap:4px; }
  .quien .campo label{ margin:0; font-size:var(--fs-sm); font-weight:var(--fw-bold);
                       text-transform:uppercase; letter-spacing:var(--tracking-eti);
                       color:var(--acento); }
  .quien .cli{ flex:1 1 240px; min-width:0; position:relative; }
  .panel-sena .sCli{ position:relative; }
  .cli-drop{ position:absolute; z-index:20; left:0; right:0; top:100%; display:none;
             background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-md);
             box-shadow:var(--sombra-flote); max-height:260px; overflow:auto; }
  .cli-opt{ padding:var(--sp-2) var(--sp-3); cursor:pointer; }
  .cli-opt:hover{ background:var(--bg-header); }
  .cli-opt .det{ display:block; font-size:var(--fs-sm); color:var(--text-tenue); }

  /* ----- las señas que ya dejó -----
     Arriba y a la vista: una seña que aparece después de cobrar es plata que hay
     que devolver en el mostrador. */
  .cab-senas{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-3); }
  .cab-senas h3{ margin:0; }
  .cab-senas button{ margin-left:auto; }
  .tiene{ margin-bottom:var(--sp-3); padding:var(--sp-2) var(--sp-3); border-radius:var(--r-md);
          background:var(--verde-bg); border:1px solid var(--verde-borde);
          font-family:var(--font-display); font-size:var(--fs-lg); }
  /* Se señan todos los trabajos y se acumulan: la lista no puede empujar las
     zonas fuera de la pantalla. */
  .lista-senas{ max-height:11rem; overflow-y:auto; }
  .sena{ display:flex; align-items:center; gap:var(--sp-2);
         padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil); }
  .sena:last-child{ border-bottom:none; }
  .sena b{ font-variant-numeric:tabular-nums; }
  .sena .quienes{ font-weight:var(--fw-bold); }
  .sena.suya{ background:var(--verde-bg); }
  .sena .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .sena .cuando{ margin-left:auto; font-size:var(--fs-sm); color:var(--text-tenue); }

  /* ----- las zonas ----- */
  .grupo{ margin-bottom:var(--sp-4); }
  .grupo h3{ margin:0 0 var(--sp-2); font-size:var(--fs-base); color:var(--text-tenue);
             text-transform:uppercase; letter-spacing:.04em; }
  .zonas{ display:grid; gap:var(--sp-2); grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); }
  .zona{ display:flex; flex-direction:column; gap:2px; text-align:left; padding:var(--sp-2) var(--sp-3);
         border:1px solid var(--border); border-radius:var(--r-md); background:var(--bg-card);
         cursor:pointer; font:inherit; color:var(--text); }
  .zona:hover{ border-color:var(--acento); }
  .zona b{ font-weight:var(--fw-bold); }
  /* Los dos precios como en Facturar: manda el de transferencia, que es al que
     se ancla el comprobante, y el de efectivo va de apoyo. Si fuera al revés,
     el número grande no sería el del papel. */
  .zona .p-tr{ font-size:var(--fs-lg); font-weight:var(--fw-bold); color:var(--text-marca);
               font-variant-numeric:tabular-nums; }
  .zona .p-ef{ font-size:var(--fs-xs); color:var(--text-tenue); font-variant-numeric:tabular-nums; }
  .zona.puesta{ border-color:var(--acento); background:var(--bg-header); }

  /* ----- el ticket ----- */
  .ticket{ position:sticky; top:var(--sp-3); }
  .lineas{ margin:var(--sp-3) 0; }
  .lin{ display:flex; gap:var(--sp-2); align-items:baseline; padding:var(--sp-2) 0;
        border-bottom:1px solid var(--border-sutil); }
  .lin .plata{ margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .lin .btn-mini{ padding:1px 7px; }
  .vacio{ color:var(--text-tenue); margin:var(--sp-3) 0; }
  .totales .ren{ display:flex; gap:var(--sp-2); align-items:baseline; padding:var(--sp-2) 0; }
  .totales .ren > :last-child{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .totales .ren.total b{ font-family:var(--font-display); font-size:var(--fs-xl);
                         font-weight:var(--fw-black); color:var(--text-marca); }
  .totales .ren.grande{ border-top:2px solid var(--border); }
  .totales .ren.grande b{ font-family:var(--font-display); font-size:var(--fs-xl);
                          font-weight:var(--fw-black); }
  .totales .ren.flojo{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .totales .ren .btn-mini{ margin-left:var(--sp-2); padding:1px 7px; }
  .totales .falta-forma{ color:var(--text-tenue); font-size:var(--fs-sm); padding:var(--sp-2) 0; }
  .formas{ display:flex; gap:var(--sp-2); margin:var(--sp-3) 0; }
  .formas button{ flex:1; }
  .formas button.on{ background:var(--bronce-400); color:var(--text-sobre-oro);
                     border-color:var(--bronce-500); font-weight:var(--fw-bold); }
  .acc-cobrar{ display:flex; flex-direction:column; gap:var(--sp-2); }
  .hecho{ margin-top:var(--sp-3); padding:var(--sp-3); border-radius:var(--r-md);
          background:var(--verde-bg); border:1px solid var(--verde-borde); }
  .hecho[hidden]{ display:none; }
  .hecho .det{ display:block; font-size:var(--fs-sm); color:var(--text-tenue); margin:2px 0 var(--sp-2); }

  /* ----- solapas -----
     Tres cosas distintas que se hacen en días distintos: cobrar (todo el día),
     cerrar el día (una vez) y mirar para atrás (cuando se pregunta). Una abajo
     de la otra, cobrar quedaba debajo de dos pantallas que casi nunca se usan. */
  .solapas{ display:flex; gap:var(--sp-2); margin-bottom:var(--sp-4); flex-wrap:wrap; }
  .solapas button.on{ background:var(--bronce-400); color:var(--text-sobre-oro);
                      border-color:var(--bronce-500); font-weight:var(--fw-bold); }
  .hoja[hidden]{ display:none; }

  /* Las señas se acumulan: se señan todos los trabajos y la clienta puede tener
     seis. La lista no puede empujar las zonas fuera de la pantalla. */
  .senas .lista{ max-height:9rem; overflow-y:auto; }
  .montos{ display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-2); }
  .montos .det{ width:100%; font-size:var(--fs-sm); color:var(--text-tenue); }

  /* ----- el día ----- */
  .dia-cab{ display:flex; gap:var(--sp-3); align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--sp-3); }
  .dia-cab .campo{ display:flex; flex-direction:column; gap:3px; }
  .dia-cab .campo label{ margin:0; }
  .cuenta .ren{ display:flex; align-items:baseline; gap:var(--sp-2);
                padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil); }
  .cuenta .ren > :last-child{ margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cuenta .ren.chico{ padding:2px 0 2px var(--sp-3); border-bottom:none;
                      font-size:var(--fs-sm); color:var(--text-tenue); }
  .cuenta .ren.chico.falta-fijo{ color:var(--danger); }
  .cuenta .ren.chico.transfer{ font-style:italic; }
  .cuenta .resta{ color:var(--danger); }
  .cuenta .ren.total{ border-bottom:2px solid var(--border); }
  .cuenta .ren.total b{ font-family:var(--font-display); font-size:var(--fs-lg); font-weight:var(--fw-black); }
  .cuenta .ren.mitad{ border-bottom:none; }
  .cuenta .ren.mitad b{ font-weight:var(--fw-bold); }
  .cuenta .ren .btn-mini{ margin-left:6px; padding:1px 7px; }
  .puerta{ max-width:420px; margin:0 auto; text-align:center; }
  .puerta .campos{ display:flex; flex-direction:column; gap:var(--sp-3); margin:var(--sp-3) 0; text-align:left; }
  .err{ color:var(--danger); }
  .tabla-chica{ width:100%; border-collapse:collapse; }
  .tabla-chica th{ text-align:left; font-size:var(--fs-sm); color:var(--text-tenue);
                   text-transform:uppercase; letter-spacing:.04em; padding:var(--sp-2); }
  .tabla-chica td{ padding:var(--sp-2); border-top:1px solid var(--border-sutil); }
  .tabla-chica td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .deuda{ color:var(--danger); }

  /* El formulario de un gasto, igual que el de Sueldos: rótulo arriba, todo en
     una fila y los casilleros sin pisarse. */
  .agregar{ display:flex; flex-wrap:wrap; gap:var(--sp-3); align-items:flex-end;
            margin-top:var(--sp-3); padding-top:var(--sp-3);
            border-top:1px solid var(--border-sutil); }
  .agregar > div{ display:flex; flex-direction:column; min-width:110px; }
  .agregar label{ margin:0 0 4px; font-size:var(--fs-sm); font-weight:var(--fw-bold);
                  text-transform:uppercase; letter-spacing:var(--tracking-eti); color:var(--acento); }
  .agregar select, .agregar input{ width:100%; max-width:100%; }
  .agregar .ancho{ flex:2 1 220px; }
  .agregar .nota{ flex:1 1 100%; margin:0; }
</style>
</head><body>
<header>
  <span>🪒 Depilación</span>
  <nav class="menu"></nav>
</header>

<div class="wrap">
  <div class="card-head">
    <h2>Depilación</h2>
    <p>Las zonas, la seña que la clienta ya dejó y el cobro, en una pantalla.
       Se factura por el mismo lugar que Facturar, así que el comprobante, la caja
       y el reparto del día salen de lo mismo.</p>
  </div>

  <div class="solapas">
    <button class="b-out on" data-hoja="cobrar">Cobrar</button>
    <button class="b-out" data-hoja="dia">El día</button>
    <button class="b-out" data-hoja="historial">Historial</button>
  </div>

  <div class="hoja" id="hCobrar">
  <div class="tablero">
    <div>
      <div class="card senas-card">
        <div class="cab-senas">
          <h3>Señas</h3>
          <button class="b-out btn-mini" id="btnSena">+ Agregar seña</button>
        </div>
        <div id="panelSena"></div>
        <div id="senas"></div>
      </div>

      <div class="card" style="margin-top:var(--sp-4);">
        <div id="catalogo"><p class="muted">Cargando las zonas…</p></div>
      </div>
    </div>

    <div class="card ticket">
      <h3 style="margin:0 0 var(--sp-3);">Facturar</h3>
      <div class="quien">
        <div class="campo cli">
          <label for="cliente">Clienta</label>
          <input id="cliente" autocomplete="off" placeholder="Buscar o escribir el nombre">
          <div class="cli-drop" id="cliDrop"></div>
        </div>
        <div class="campo"><label for="atiende">Atiende</label>
          <select id="atiende"></select></div>
      </div>
      <div class="formas" id="formas">
        <button class="b-out" data-forma="efectivo">Efectivo</button>
        <button class="b-out" data-forma="transfer">Transferencia</button>
      </div>
      <div class="lineas" id="lineas"><p class="vacio">Todavía no hay zonas elegidas.</p></div>
      <div class="totales" id="totales"></div>
      <div class="acc-cobrar">
        <button class="b-ok" id="btnCobrar" disabled>Cobrar</button>
        <button class="b-out" id="btnVaciar" disabled>Vaciar</button>
      </div>
      <div class="hecho" id="hecho" hidden></div>
    </div>
  </div>
  </div>

  <div class="hoja" id="hDia" hidden></div>
  <div class="hoja" id="hHistorial" hidden></div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script src="/static/js/senas.js"></script>
<script>
requireLogin();
pintarNav();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "$" + (n || 0).toLocaleString("es-AR");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}

let ZONAS = [], TICKET = [], CLI = null, SENAS = [], FORMA = null;

/* Lo que está a medio cargar se guarda en el aparato.

   No es por las recargas: es porque el recibo de la seña es una navegación —el
   papel sale por RawBT, que es otra app— y tomar una seña en el medio de un
   ticket se lleva la pantalla puesta. Volviendo, las zonas siguen ahí. */
const BORRADOR = "depi_borrador";
function guardarBorrador(){
  try{
    if(TICKET.length) localStorage.setItem(BORRADOR, JSON.stringify({TICKET, CLI, FORMA}));
    else localStorage.removeItem(BORRADOR);
  }catch(e){}
}
async function restaurarBorrador(){
  let b;
  try{ b = JSON.parse(localStorage.getItem(BORRADOR) || "null"); }catch(e){ return; }
  if(!b || !b.TICKET || !b.TICKET.length) return;
  TICKET = b.TICKET; CLI = b.CLI || null; FORMA = b.FORMA || null;
  document.querySelectorAll("#formas button").forEach(x =>
    x.classList.toggle("on", x.dataset.forma === FORMA));
  if(CLI){ $("#cliente").value = CLI.nombre; await mostrarSenas(); }
  pintar();
}

async function cargar(){
  ZONAS = await (await authFetch("/api/catalogo?de=depi")).json();
  const cfg = await (await authFetch("/api/config")).json();
  const emps = await (await authFetch("/api/empleados")).json();
  const quien = cfg.depi_a_cargo || "";
  // Viene puesta la que lleva la depilación: es la que atiende casi siempre, y
  // el desplegable en blanco termina en tickets sin nombre.
  $("#atiende").innerHTML = `<option value="">—</option>` + emps.filter(e => e.activo !== false)
    .map(e => `<option${e.nombre === quien ? " selected" : ""}>${esc(e.nombre)}</option>`).join("");
  pintarCatalogo();
  await mostrarSenas();      // el cartelito de "elegí la clienta" desde el arranque
  await restaurarBorrador();
}

function pintarCatalogo(){
  const cont = $("#catalogo");
  if(!ZONAS.length){
    cont.innerHTML = `<p class="muted">No hay zonas de depilación en el catálogo.
      Se marcan en Admin con "Es depilación", o se cargan de una con el script de la lista de precios.</p>`;
    return;
  }
  // Por precio y no por nombre: el catálogo ordena alfabéticamente y así "10
  // zonas" cae entre "1 zona" y "2 zonas", justo donde se toca de apurado.
  const porCat = {};
  [...ZONAS].sort((a, b) => a.precio_transfer - b.precio_transfer)
            .forEach(z => (porCat[z.categoria] = porCat[z.categoria] || []).push(z));
  cont.innerHTML = Object.keys(porCat).map(c => `
    <div class="grupo"><h3>${esc(c)}</h3>
      <div class="zonas">${porCat[c].map(z => `
        <button class="zona${TICKET.some(l => l.id === z.id) ? " puesta" : ""}" data-id="${z.id}">
          <b>${esc(z.nombre)}</b>
          <span class="p-tr">${fmt(z.precio_transfer)}</span>
          <span class="p-ef">c/desc ${fmt(z.precio)}</span>
        </button>`).join("")}</div>
    </div>`).join("");
  cont.querySelectorAll(".zona").forEach(b => {
    b.onclick = () => agregar(Number(b.dataset.id));
  });
}

function agregar(id){
  const z = ZONAS.find(x => x.id === id);
  if(!z) return;
  const ya = TICKET.find(l => l.id === id);
  if(ya) ya.cantidad++;
  else TICKET.push({id, nombre: z.nombre, precio: z.precio,
                    transfer: z.precio_transfer, cantidad: 1});
  pintar();
}

/* Lo que una seña tapa de esta cuenta.

   La misma cuenta que hace el backend al aplicarla (sena_saldado): una seña en
   efectivo tapa más que su monto cuando la cuenta está en la lista de
   transferencia. Acá solo se muestra, pero tiene que dar igual: lo que se le
   dice a la clienta es lo que se le va a cobrar. */
function tapaSena(s){
  return (FORMA === "efectivo" || s.forma_pago !== "Efectivo")
    ? s.monto : Math.ceil((s.monto / 0.9) / 100) * 100;
}

function pintar(){
  const cont = $("#lineas");
  cont.innerHTML = TICKET.length
    ? TICKET.map((l, i) => `<div class="lin">
        <span>${esc(l.nombre)}${l.cantidad > 1 ? ` ×${l.cantidad}` : ""}</span>
        <span class="plata">${fmt(l.transfer * l.cantidad)}
          <button class="b-out btn-mini" data-i="${i}" title="Sacar">✕</button></span>
      </div>`).join("")
    : `<p class="vacio">Todavía no hay zonas elegidas.</p>`;
  cont.querySelectorAll("button[data-i]").forEach(b => {
    b.onclick = () => { TICKET.splice(Number(b.dataset.i), 1); pintar(); };
  });

  const efvo  = TICKET.reduce((a, l) => a + l.precio * l.cantidad, 0);
  const trans = TICKET.reduce((a, l) => a + l.transfer * l.cantidad, 0);
  const hayFormaYa = FORMA !== null;
  const total = FORMA === "efectivo" ? efvo : trans;
  const tapa = Math.min(total, SENAS.reduce((a, s) => a + tapaSena(s), 0));
  const botonSena = `<button class="b-out btn-mini" id="masSena"
      title="Tomar una seña que la clienta dejó y no quedó cargada">+ seña no cargada</button>`;
  $("#totales").innerHTML = TICKET.length ? `
    <div class="ren total"><span>Total</span><b>${fmt(trans)}</b></div>
    <div class="ren flojo"><span>En efectivo</span><span>${fmt(efvo)}</span></div>
    ${SENAS.length ? `<div class="ren"><span>Tiene de seña ${botonSena}</span>
        <b>${hayFormaYa ? "−" + fmt(tapa) : fmt(SENAS.reduce((a, s) => a + s.monto, 0))}</b></div>` : ""}
    ${hayFormaYa
      ? `<div class="ren grande"><span>${SENAS.length ? "Falta cobrar" : "A cobrar"}
           <em class="det">en ${FORMA === "efectivo" ? "efectivo" : "transferencia"}</em></span>
         <b>${fmt(Math.max(total - tapa, 0))}</b></div>`
      : `<div class="falta-forma">Elegí arriba cómo paga para ver lo que hay que cobrar.</div>`}` : "";
  const mas = $("#masSena");
  if(mas) mas.onclick = abrirPanelSena;

  // Sin forma de pago no se cobra: es lo que decide con qué lista se cobra y,
  // con una puesta de entrada, el día que se cobre distinto nadie la cambia.
  $("#btnCobrar").disabled = !TICKET.length || !hayFormaYa;
  $("#btnVaciar").disabled = !TICKET.length;
  guardarBorrador();
  document.querySelectorAll(".zona").forEach(b => {
    b.classList.toggle("puesta", TICKET.some(l => l.id === Number(b.dataset.id)));
  });
}

/* ---------- la clienta ---------- */
let timer;
$("#cliente").addEventListener("input", () => {
  CLI = null; mostrarSenas();
  const q = $("#cliente").value.trim();
  clearTimeout(timer);
  if(!q){ $("#cliDrop").style.display = "none"; return; }
  timer = setTimeout(async () => {
    const res = await (await authFetch("/api/clientes?q=" + encodeURIComponent(q))).json();
    if(!res.length){ $("#cliDrop").style.display = "none"; return; }
    $("#cliDrop").innerHTML = res.slice(0, 8).map(c => `
      <div class="cli-opt" data-id="${c.id}" data-nom="${esc(c.nombre)}">
        <b>${esc(c.nombre)}</b>
        <span class="det">#${c.id}${c.telefono ? " · " + esc(c.telefono) : ""}</span>
      </div>`).join("");
    $("#cliDrop").style.display = "block";
  }, 200);
});
$("#cliDrop").addEventListener("click", async e => {
  const o = e.target.closest(".cli-opt"); if(!o) return;
  CLI = {id: Number(o.dataset.id), nombre: o.dataset.nom};
  $("#cliente").value = CLI.nombre;
  $("#cliDrop").style.display = "none";
  await mostrarSenas(true);
});
document.addEventListener("click", e => {
  if(!$("#cliente").contains(e.target) && !$("#cliDrop").contains(e.target))
    $("#cliDrop").style.display = "none";
});

/* Todas las señas sin usar, de quien sean.

   La lista no es de la clienta que se está facturando: es el pizarrón de lo que
   el local debe trabajo. Se señan todos los turnos y la clienta que viene hoy
   puede no ser la que señó ayer; con la lista atada a la de arriba, esa plata no
   se veía hasta que alguien la buscaba cliente por cliente. */
let TODAS_SENAS = [];

/* De cuánto es la seña, en los precios de la lista.

   Lo guardado es la plata que entró, que en efectivo es el 10% menos. Lo que la
   clienta tiene a favor es el otro número —el que se le dijo— y es el que esta
   lista tiene que mostrar: es la misma cuenta que hace el backend al aplicarla. */
const valorSena = s => (s.forma_pago || "") === "Efectivo"
  ? Math.ceil((s.monto / 0.9) / 100) * 100 : s.monto;

async function mostrarSenas(avisar){
  try{ TODAS_SENAS = await (await authFetch("/api/senas?solo_libres=true")).json(); }
  catch(e){ TODAS_SENAS = []; }
  SENAS = CLI ? TODAS_SENAS.filter(s => s.cliente_id === CLI.id) : [];
  // El aviso salta al elegir a la clienta: una seña que aparece DESPUÉS de
  // cobrar es plata que hay que devolver en el mostrador.
  if(avisar && SENAS.length)
    toast(`${CLI.nombre} tiene ${fmt(SENAS.reduce((a, s) => a + s.monto, 0))} de seña`);

  const caja = $("#senas");
  caja.innerHTML = !TODAS_SENAS.length
    ? `<p class="muted">No hay ninguna seña sin usar. Las que se tomen aparecen acá
       hasta que se le facture a la clienta.</p>`
    : `<div class="lista-senas">${TODAS_SENAS.map(s => `
        <div class="sena${CLI && s.cliente_id === CLI.id ? " suya" : ""}">
          <b>${fmt(valorSena(s))}</b>
          <span class="quienes">${esc(s.cliente || "—")}</span>
          <span class="det">${(s.forma_pago || "") === "Efectivo"
            ? `entraron ${fmt(s.monto)} en efectivo` : esc(s.forma_pago || "")}</span>
          <span class="cuando">${esc(s.fecha || "")}</span>
          <button class="b-out btn-mini borrar-sena" data-id="${s.id}"
                  title="Se le devolvió la plata">✕</button>
        </div>`).join("")}</div>`;
  caja.querySelectorAll(".borrar-sena").forEach(b => {
    b.onclick = async () => {
      if(!confirm("¿Se le devolvió esta seña?\n\nSale de las que están a favor y queda anotada como devuelta.")) return;
      const r = await authFetch("/api/senas/" + b.dataset.id, {method:"DELETE"});
      if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
      toast("Seña devuelta");
      mostrarSenas();
    };
  });
  pintar();
}

/* Tomar una seña es una cosa aparte de facturar: la clienta se elige adentro
   del formulario y lo que esté a medio cargar en Facturar no se toca. */
function abrirPanelSena(){
  $("#panelSena").innerHTML = "";
  $("#panelSena").appendChild(panelSena(null, null, () => mostrarSenas()));
  $("#panelSena").scrollIntoView({behavior:"smooth", block:"nearest"});
}
$("#btnSena").onclick = abrirPanelSena;

document.querySelectorAll("#formas button").forEach(b => {
  b.onclick = () => {
    FORMA = b.dataset.forma;
    document.querySelectorAll("#formas button").forEach(x => x.classList.toggle("on", x === b));
    pintar();
  };
});

$("#btnVaciar").onclick = () => { TICKET = []; pintar(); };

/* Cobrar es el mismo camino que Facturar: se crea el comprobante, se aplican las
   señas y recién después se paga lo que falta. En ese orden, porque la seña baja
   el saldo: cobrando primero, la plata que ya dejó le queda a favor para siempre.

   Nada de la cuenta se hace acá: el total, el descuento en efectivo y lo que
   tapa la seña los calcula el backend. Lo de esta pantalla es lo que se le
   muestra, y sale de pedirle el comprobante después de cada paso. */
$("#btnCobrar").onclick = async () => {
  const nombre = $("#cliente").value.trim();
  if(!nombre){ toast("Falta el nombre de la clienta"); $("#cliente").focus(); return; }
  if(!TICKET.length) return;
  const b = $("#btnCobrar");
  b.disabled = true;

  if(!FORMA){ toast("Elegí cómo paga"); b.disabled = false; return; }
  const total = TICKET.reduce((a, l) => a + (FORMA === "efectivo" ? l.precio : l.transfer) * l.cantidad, 0);
  if(!confirm(`${nombre}\n${TICKET.length} ${TICKET.length === 1 ? "zona" : "zonas"} · `
            + `${fmt(total)} en ${FORMA === "efectivo" ? "efectivo" : "transferencia"}`
            + `${SENAS.length ? "\n\nSe le aplican las señas que tiene a favor." : ""}`
            + `\n\n¿Lo cobramos?`)){ b.disabled = false; return; }

  const cuerpo = {tipo: "ticket", cliente_id: CLI ? CLI.id : null,
                  cliente_nombre: CLI ? null : nombre,
                  peluquero: $("#atiende").value || null,
                  forma_pago: FORMA, descuento_pct: 0, mostrar_motivo: false,
                  lineas: TICKET.map(l => ({item_id: l.id, nombre: l.nombre, cantidad: l.cantidad})),
                  extras: []};
  const r = await authFetch("/api/comprobantes", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(cuerpo)});
  if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo crear"); b.disabled = false; return; }
  const d = await r.json();

  if(CLI && SENAS.length)
    await authFetch(`/api/comprobantes/${d.id}/aplicar-senas`, {method:"POST"});

  const c = await (await authFetch("/api/comprobantes/" + d.id)).json();
  let aviso = "";
  if(c.saldo > 0){
    const rp = await authFetch(`/api/comprobantes/${d.id}/pagos`, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({monto: c.saldo, saldado: c.saldo,
                            forma_pago: FORMA === "efectivo" ? "Efectivo" : "Transferencia",
                            alias: null, del_servicio: true})});
    if(!rp.ok) aviso = "Se creó el comprobante pero el cobro falló: cobralo desde la cuenta de la clienta.";
  }
  const fin = await (await authFetch("/api/comprobantes/" + d.id)).json();
  const num = "N-" + String(d.numero).padStart(5, "0");
  const sena = fin.pagos.filter(p => p.es_sena);
  $("#hecho").hidden = false;
  $("#hecho").innerHTML = `<b>${num} cobrado</b>
    <span class="det">${fmt(fin.total_final)} de cuenta${
      sena.length ? ` · seña ${fmt(sena.reduce((a,p)=>a+p.monto,0))}`
                  + (sena.some(p => p.desc_aplicado) ? ` (saldó ${fmt(sena.reduce((a,p)=>a+(p.saldado||p.monto),0))} por ser en efectivo)` : "")
                  : ""}${fin.saldo > 0 ? ` · queda debiendo ${fmt(fin.saldo)}` : ""}</span>
    <a class="b-out" href="/ticket?id=${d.id}">🖨️ Imprimir</a>
    ${aviso ? `<p class="nota">${aviso}</p>` : ""}`;
  toast(fin.saldo > 0 ? `${num} con saldo pendiente` : `${num} cobrado ✓`);
  /* El papel se ofrece y no sale solo: imprimir es una navegación a RawBT y se
     lleva la pantalla puesta, así que primero se guarda y recién después se
     pregunta. El que dice que no tiene el botón de Imprimir ahí abajo. */
  if(confirm(`${num} cobrado.\n\n¿Le imprimimos el comprobante?`))
    location.href = "/ticket?id=" + d.id;
  TICKET = []; CLI = null; FORMA = null;
  document.querySelectorAll("#formas button").forEach(x => x.classList.remove("on"));
  $("#cliente").value = ""; $("#panelSena").innerHTML = "";
  // mostrarSenas() y no pintar(): sin esto la caja de señas seguía mostrando las
  // de la clienta anterior, ya aplicadas, como si todavía las tuviera a favor.
  mostrarSenas();
};

/* ---------- el día ----------

   El cierre de caja de la depilación: lo que se facturó, lo que entró, los
   gastos y el reparto. Está acá y no en Sueldos porque son dos negocios
   distintos: en Sueldos se paga la peluquería y acá se paga el día.

   Todo lo de esta pantalla lo hacen las dos, sin código en el medio: el día de
   depilación se trabaja entre dos con una sola tablet. */
let DIA = null;
let fechaDia = new Date(Date.now() - 3*3600*1000).toISOString().slice(0, 10);

const pedir = (url, opts) => authFetch(url, opts);

async function verDia(){
  const r = await pedir(`/api/depilacion/dia?fecha=${fechaDia}`);
  if(!r.ok){ $("#hDia").innerHTML = `<div class="card"><p class="err">${
      (await r.json().catch(()=>({}))).detail || "No se pudo abrir el día"}</p></div>`; return; }
  DIA = await r.json();
  pintarDia();
}

function pintarDia(){
  const d = DIA, q = d.cuenta;
  const ayudantes = q.egresos_detalle.filter(e => e.ayudante);
  const maquinas  = q.egresos_detalle.filter(e => e.maquina);
  const otros     = q.egresos_detalle.filter(e => !e.ayudante && !e.maquina);
  const pagado = d.cerrado ? d.cerrado.total : 0;
  // "Cerrado" es que no quede nada por pagar. Lo facturado después de un cierre
  // sube el reparto, y esa diferencia se cobra con otro cierre.
  const cerrado = pagado > 0 && d.pendiente <= 0;
  // Con el día pagado los gastos no se tocan: cambiarlos movería una cuenta que
  // ya se liquidó. Mientras tanto se corrigen acá mismo, que equivocarse en un
  // monto es lo más común y borrar y volver a cargar pierde la fecha y el número.
  const acciones = e => pagado ? "" : `
      <button class="b-out btn-mini editar-gasto" data-id="${e.id}" data-monto="${e.monto}"
              title="Corregir el monto">✎</button>
      <button class="b-out btn-mini borrar-gasto" data-id="${e.id}"
              title="Sacar este gasto del día">✕</button>`;
  const gasto = (e, rot) => `<div class="ren chico" data-gasto="${e.id}">
      <span>${rot}${e.notas ? ` <em class="det">(${esc(e.notas)})</em>` : ""}</span>
      <span>−${fmt(e.monto)} ${acciones(e)}</span></div>`;
  const falta = (clase, rot) => cerrado ? "" : `<div class="ren chico falta-fijo">
      <span>${rot}</span>
      <span><button class="b-out btn-mini btn-${clase}">Cargar</button></span></div>`;
  const cobrado = Object.keys(d.cobrado || {});

  $("#hDia").innerHTML = `
    <div class="card">
      <div class="dia-cab">
        <div class="campo"><label for="fDia">Día</label>
          <input type="date" id="fDia" value="${d.fecha}"></div>
        <div class="campo"><label>Lo lleva</label>
          <b>${d.a_cargo ? esc(d.a_cargo) : "—"}</b></div>
        ${pagado ? `<span class="tag">${cerrado ? "Ya pagado" : "Pagado en parte"} · ${fmt(pagado)}${
            d.cerrado.veces > 1 ? ` · ${d.cerrado.veces} cierres` : ""}</span>` : ""}
      </div>
      ${d.es_dia ? "" : `<p class="muted">Todavía no hay nada de depilación en este día.</p>`}
    </div>

    <div class="card" style="margin-top:var(--sp-4);">
      <h3 style="margin:0 0 var(--sp-3);">Gastos del día</h3>
      <div class="cuenta">
        ${maquinas.map(e => gasto(e, "Máquina")).join("")}
        ${maquinas.length ? "" : falta("maquina", "Máquina")}
        ${otros.map(e => gasto(e, (e.numero ? "#" + e.numero + " " : "") + esc(e.concepto || e.tipo || "Gasto"))).join("")}
        ${ayudantes.map(e => gasto(e, "Ayudante · " + esc(e.concepto || "sin nombre"))).join("")}
        ${ayudantes.length ? "" : falta("ayudante", "Pago a la ayudante")}
        <div class="ren"><span>Total de gastos</span><b class="${q.gastos ? "resta" : ""}">${q.gastos ? "−" : ""}${fmt(q.gastos)}</b></div>
      </div>
      ${cerrado ? "" : `<div class="acc-cobrar" style="flex-direction:row;flex-wrap:wrap;margin-top:var(--sp-3);">
        <button class="b-out btn-mini btn-gasto">+ Otro gasto</button>
        ${ayudantes.length ? `<button class="b-out btn-mini btn-ayudante">+ Otra ayudante</button>` : ""}
      </div>`}
      <div id="panelGasto"></div>
    </div>

    <div class="card" style="margin-top:var(--sp-4);">
      <h3 style="margin:0 0 var(--sp-2);">El reparto</h3>
      <div class="cuenta">
        <div class="ren"><span>Total ingresado
            <em class="det">lo que facturó el día, como se cobró</em></span><b>${fmt(d.facturado)}</b></div>
        <div class="ren chico transfer"><span>Los mismos trabajos en efectivo, que es con lo que se reparte</span><span>${fmt(q.base)}</span></div>
        <div class="ren"><span>Gastos del día</span><b class="${q.gastos ? "resta" : ""}">${q.gastos ? "−" : ""}${fmt(q.gastos)}</b></div>
        <div class="ren total"><span>Queda</span><b>${fmt(q.resto)}</b></div>
        <div class="ren mitad"><span>Para ${d.a_cargo ? esc(d.a_cargo) : "quien lo lleva"}</span><b>${fmt(q.parte_empleada)}</b></div>
        <div class="ren mitad"><span>Para el salón</span><b>${fmt(q.parte_salon)}</b></div>
        ${pagado ? `<div class="ren chico"><span>Ya se le pagó</span><span>−${fmt(pagado)}</span></div>
          <div class="ren total"><span>${d.pendiente > 0 ? "Queda por pagar" : "No queda nada por pagar"}</span>
            <b>${fmt(d.pendiente)}</b></div>` : ""}
      </div>
      ${q.falta_cobrar > 0 ? `<div class="aviso">⚠️ De este día falta cobrar ${fmt(q.falta_cobrar)}.
        El reparto es de lo que se trabajó, así que ya está contado: esa plata todavía no entró al cajón.</div>` : ""}
      ${q.resto < 0 ? `<div class="aviso">⚠️ Los gastos superan lo que se facturó. No hay nada para repartir.</div>` : ""}
    </div>

    <div class="card" style="margin-top:var(--sp-4);">
      <h3 style="margin:0 0 var(--sp-2);">Lo que entró</h3>
      ${cobrado.length ? `<div class="cuenta">${cobrado.map(f => `
        <div class="ren"><span>${esc(f)}</span><b>${fmt(d.cobrado[f])}</b></div>`).join("")}
        ${q.falta_cobrar > 0 ? `<div class="ren chico"><span>Falta cobrar</span><span class="deuda">${fmt(q.falta_cobrar)}</span></div>` : ""}
      </div>` : `<p class="muted">Todavía no se cobró nada de este día.</p>`}
      <p class="nota">Esta plata está también en la caja del local, con el resto del día:
        la clienta paga en el mostrador. Acá se ve sola, para poder cerrar la depilación aparte.</p>
    </div>

    <details class="card" style="margin-top:var(--sp-4);">
      <summary><b>Los trabajos del día</b> <span class="det">${d.comprobantes.length} ${
        d.comprobantes.length === 1 ? "ticket" : "tickets"}</span></summary>
      ${d.comprobantes.length ? tablaComprobantes(d.comprobantes)
        : `<p class="muted">Todavía no se facturó nada.</p>`}
    </details>

    ${d.pendiente > 0 ? `
    <div class="card" style="margin-top:var(--sp-4);">
      <h3 style="margin:0 0 var(--sp-2);">${pagado ? "Pagar la diferencia" : "Cerrar el día"}</h3>
      ${pagado ? `<p class="nota" style="margin-top:0;">El día se cerró con ${fmt(pagado)} y
        después se facturó más, así que quedó esta diferencia.</p>` : ""}
      <div class="dia-cab">
        <div class="campo"><label for="cForma">Se paga con</label>
          <select id="cForma"><option>Efectivo</option><option>Transferencia</option></select></div>
        <div class="campo"><label for="cFecha">El egreso va a la caja del</label>
          <input type="date" id="cFecha" value="${hoyArg()}"></div>
        <div class="campo"><label for="cNota">Nota (opcional)</label>
          <input id="cNota" maxlength="80"></div>
        <button class="b-ok" id="cCerrar">Cerrar y pagar ${fmt(d.pendiente)}</button>
      </div>
      <p class="nota">Queda la foto del reparto y el egreso anotado. No se puede deshacer.</p>
    </div>` : ""}`;

  $("#fDia").onchange = e => { fechaDia = e.target.value; verDia(); };
  const bg = $("#hDia").querySelector(".btn-gasto");
  if(bg) bg.onclick = () => formGasto("insumo");
  const ba = $("#hDia").querySelector(".btn-ayudante");
  if(ba) ba.onclick = () => formGasto("ayudante");
  const bm = $("#hDia").querySelector(".btn-maquina");
  if(bm) bm.onclick = () => formGasto("maquina");
  $("#hDia").querySelectorAll(".editar-gasto").forEach(b => {
    b.onclick = () => editarGasto(b);
  });
  $("#hDia").querySelectorAll(".borrar-gasto").forEach(b => {
    b.onclick = async () => {
      if(!confirm("¿Sacar este gasto del día? El reparto se recalcula solo.")) return;
      const r = await pedir(`/api/depilacion/gasto/${b.dataset.id}?empleado_id=${DIA.empleado_id}`,
                            {method:"DELETE"});
      if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
      verDia();
    };
  });
  const cerrar = $("#cCerrar");
  if(cerrar) cerrar.onclick = async () => {
    if(!confirm(`Se le pagan ${fmt(d.pendiente)} a ${d.a_cargo} por el día ${d.fecha}.\n\n`
              + `Queda la foto del reparto y el egreso anotado. Esto no se puede deshacer.`)) return;
    const r = await pedir("/api/depilacion/cerrar", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({fecha: d.fecha, forma_pago: $("#cForma").value,
                            fecha_pago: $("#cFecha").value,
                            notas: $("#cNota").value.trim() || null})});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo cerrar"); return; }
    toast("Día cerrado ✓");
    verDia();
  };
}

/* Corregir el monto de un gasto, en el renglón. El egreso es el mismo —mismo
   número y misma fecha—, así que la caja del día sigue contándolo una sola vez. */
function editarGasto(boton){
  const fila = boton.closest("[data-gasto]");
  if(fila.querySelector(".gEdit")) return;
  const caja = document.createElement("span");
  caja.className = "gEdit";
  caja.innerHTML = `<input type="number" class="gNuevo" min="1" inputmode="numeric"
      value="${boton.dataset.monto}" style="width:7rem;">
    <button class="b-ok btn-mini gSi">Guardar</button>
    <button class="b-out btn-mini gNo">Cancelar</button>`;
  fila.appendChild(caja);
  const inp = caja.querySelector(".gNuevo");
  inp.focus(); inp.select();
  caja.querySelector(".gNo").onclick = () => caja.remove();
  caja.querySelector(".gSi").onclick = async () => {
    const monto = parseInt(inp.value, 10) || 0;
    if(monto <= 0){ toast("Poné cuánto fue"); return; }
    const r = await pedir("/api/depilacion/gasto/" + boton.dataset.id, {method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({empleado_id: DIA.empleado_id, monto})});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
    toast("Corregido");
    verDia();
  };
  inp.addEventListener("keydown", e => {
    if(e.key === "Enter") caja.querySelector(".gSi").click();
    if(e.key === "Escape") caja.remove();
  });
}

function tablaComprobantes(filas){
  return `<table class="tabla-chica"><thead><tr>
      <th>N°</th><th>Hora</th><th>Clienta</th><th>Zonas</th><th>Forma</th>
      <th class="num">Total</th><th class="num">Debe</th></tr></thead><tbody>
    ${filas.map(c => `<tr>
      <td>N-${String(c.numero).padStart(5,"0")}</td>
      <td>${esc(c.hora || "")}</td>
      <td>${esc(c.cliente || "—")}</td>
      <td>${c.lineas.map(l => esc(l.nombre) + (l.cantidad > 1 ? ` ×${l.cantidad}` : "")).join(", ")}</td>
      <td>${esc(c.forma || "")}</td>
      <td class="num">${fmt(c.total)}</td>
      <td class="num ${c.saldo > 0 ? "deuda" : ""}">${c.saldo > 0 ? fmt(c.saldo) : "—"}</td>
    </tr>`).join("")}</tbody></table>`;
}

/* El formulario de un gasto del día. El de la ayudante pide QUIÉN, porque es un
   pago a una persona; el de la máquina y el común piden qué y cuánto. La
   máquina no viene con monto: se alquila por jornada y un día corto sale menos. */
async function formGasto(clase){
  const esAyudante = clase === "ayudante";
  const otras = (await (await authFetch("/api/empleados")).json())
    .filter(e => e.activo !== false && e.nombre !== DIA.a_cargo);
  const fijo = esAyudante ? (DIA.cuenta.pago_ayudante || 0) : 0;
  const caja = document.createElement("div");
  caja.className = "agregar form-gasto";
  caja.innerHTML = esAyudante
    ? `<div class="ancho"><label>¿Quién ayudó?</label>
         <select class="gQuien">
           ${otras.map(e => `<option value="${esc(e.nombre)}">${esc(e.nombre)}</option>`).join("")}
           <option value="">Otra persona…</option></select></div>
       <div class="ancho gOtra" style="display:none;"><label>Nombre</label>
         <input class="gNombre" maxlength="60" placeholder="No es del salón"></div>
       <div style="flex:0 0 130px;"><label>Se le paga</label>
         <input type="number" class="gMonto" min="1" inputmode="numeric" value="${fijo || ""}"></div>
       <button class="b-ok gOk">Anotar el pago</button>
       <button class="b-out gNo">Cancelar</button>
       ${fijo ? `<span class="nota">El fijo son ${fmt(fijo)}. Si ponés otro número queda escrito que se cambió.</span>` : ""}`
    : `<div class="ancho"><label>${clase === "maquina" ? "Máquina del día" : "Gasto del día"}</label>
         <input class="gConcepto" maxlength="80" value="${clase === "maquina" ? "Alquiler de la máquina" : ""}"
                placeholder="Cera, descartables…"></div>
       <div style="flex:0 0 130px;"><label>${clase === "maquina" ? "Costó" : "Monto"}</label>
         <input type="number" class="gMonto" min="1" inputmode="numeric"></div>
       <button class="b-ok gOk">Anotar</button>
       <button class="b-out gNo">Cancelar</button>
       <span class="nota">Entra en la resta del día, así que baja las dos mitades.</span>`;
  $("#panelGasto").innerHTML = "";
  $("#panelGasto").appendChild(caja);
  const sel = caja.querySelector(".gQuien");
  if(sel) sel.onchange = () => {
    caja.querySelector(".gOtra").style.display = sel.value ? "none" : "";
    if(!sel.value) caja.querySelector(".gNombre").focus();
  };
  caja.querySelector(".gNo").onclick = () => caja.remove();
  caja.querySelector(".gOk").onclick = async () => {
    const monto = parseInt(caja.querySelector(".gMonto").value, 10) || 0;
    if(monto <= 0){ toast("Poné cuánto fue"); return; }
    let cuerpo = {empleado_id: DIA.empleado_id, fecha: DIA.fecha, monto};
    if(esAyudante){
      const elegida = sel.value || caja.querySelector(".gNombre").value.trim();
      if(!elegida){ toast("Decí quién ayudó"); return; }
      const suya = otras.find(e => e.nombre === elegida);
      cuerpo = {...cuerpo, ayudante: true, concepto: elegida,
                ayudante_id: suya ? suya.id : null, tipo: "Ayudante depilación"};
    } else {
      const que = caja.querySelector(".gConcepto").value.trim();
      if(!que){ toast("Poné qué se gastó"); return; }
      cuerpo = clase === "maquina"
        ? {...cuerpo, concepto: que, tipo: "Máquina depilación", maquina: true}
        : {...cuerpo, concepto: que, tipo: "Insumos"};
    }
    const r = await pedir("/api/depilacion/gasto", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(cuerpo)});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
    verDia();
  };
  caja.querySelector(esAyudante ? ".gMonto" : ".gConcepto").focus();
}

/* ---------- historial ----------
   El de depilación y nada más: el de peluquería sigue en Historial, y mezclarlos
   es justo lo que no se quiere. */
async function verHistorial(){
  const hasta = hoyArg();
  const desde = new Date(new Date(hasta + "T12:00:00") - 60*24*3600*1000).toISOString().slice(0, 10);
  $("#hHistorial").innerHTML = `<div class="card">
    <div class="dia-cab">
      <div class="campo"><label for="hDesde">Desde</label><input type="date" id="hDesde" value="${desde}"></div>
      <div class="campo"><label for="hHasta">Hasta</label><input type="date" id="hHasta" value="${hasta}"></div>
      <button class="b-out" id="hVer">Ver</button>
    </div>
    <div id="hLista"><p class="muted">Cargando…</p></div>
  </div>
  <div class="card" style="margin-top:var(--sp-4);">
    <h3 style="margin:0 0 var(--sp-2);">Los días</h3>
    <div id="hDias"><p class="muted">Cargando…</p></div></div>`;
  $("#hVer").onclick = cargarHistorial;
  cargarHistorial();
  cargarDias();
}

async function cargarHistorial(){
  const r = await authFetch(`/api/comprobantes?de=depi&desde=${$("#hDesde").value}`
    + `&hasta=${$("#hHasta").value}&limite=200`);
  const d = await r.json();
  const filas = d.comprobantes || [];
  const hoy = hoyArg();
  $("#hLista").innerHTML = filas.length ? `
    <p class="muted">${filas.length} de ${d.total} · deuda ${fmt(d.deuda_total || 0)}</p>
    <table class="tabla-chica"><thead><tr>
      <th>N°</th><th>Fecha</th><th>Clienta</th><th>Atendió</th>
      <th class="num">Total</th><th class="num">Debe</th><th></th></tr></thead><tbody>
    ${filas.map(c => `<tr>
      <td><a href="/ticket?id=${c.id}">N-${String(c.numero).padStart(5,"0")}</a></td>
      <td>${esc((c.fecha || "").slice(0,10).split("-").reverse().join("/"))}</td>
      <td>${esc(c.cliente_nombre || "—")}</td>
      <td>${esc(c.peluquero || "—")}</td>
      <td class="num">${fmt(c.total_final)}</td>
      <td class="num ${c.saldo > 0 ? "deuda" : ""}">${c.saldo > 0 ? fmt(c.saldo) : "—"}</td>
      <td>${(c.fecha || "").slice(0,10) === hoy
            ? `<button class="b-del btn-mini anular" data-id="${c.id}"
                       data-num="${String(c.numero).padStart(5,"0")}">Anular</button>` : ""}</td>
    </tr>`).join("")}</tbody></table>`
    : `<p class="muted">No hay depilación en esas fechas.</p>`;
  /* Anular solo lo de HOY: un ticket de la semana pasada ya se arqueó y puede
     estar adentro de un día cerrado, así que sacarlo le cambia la cuenta a una
     liquidación que ya se pagó. El error del momento, en cambio, se corrige en
     el momento. */
  $("#hLista").querySelectorAll(".anular").forEach(b => {
    b.onclick = async () => {
      if(!confirm(`¿Anular el N-${b.dataset.num}?\n\nSe le devuelven las señas que haya usado `
                + `y sale del día. Esto no se puede deshacer.`)) return;
      const r = await authFetch("/api/comprobantes/" + b.dataset.id, {method:"DELETE"});
      if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo anular"); return; }
      toast("Anulado");
      cargarHistorial(); cargarDias();
    };
  });
}

async function cargarDias(){
  const r = await authFetch("/api/depilacion/dias");
  if(!r.ok){ $("#hDias").innerHTML = ""; return; }
  const dias = await r.json();
  $("#hDias").innerHTML = dias.length ? `
    <table class="tabla-chica"><thead><tr>
      <th>Día</th><th>Lo llevó</th><th class="num">Trabajos</th>
      <th class="num">Le tocó</th><th></th></tr></thead><tbody>
    ${dias.map(d => `<tr>
      <td><a href="#" class="ver-dia" data-f="${d.fecha}">${esc(d.fecha.split("-").reverse().join("/"))}</a></td>
      <td>${esc(d.a_cargo || "—")}</td>
      <td class="num">${fmt(d.base)}</td>
      <td class="num">${fmt(d.parte_empleada)}</td>
      <td>${d.cerrado ? "pagado"
            : d.pagado ? `<b class="deuda">falta ${fmt(d.parte_empleada - d.pagado)}</b>`
            : `<b class="deuda">sin cerrar</b>`}</td>
    </tr>`).join("")}</tbody></table>`
    : `<p class="muted">Todavía no hubo días de depilación.</p>`;
  $("#hDias").querySelectorAll(".ver-dia").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      fechaDia = a.dataset.f;
      document.querySelector('.solapas button[data-hoja="dia"]').click();
    };
  });
}

const DUENO = getRol() === "dueno";
const hoyArg = () => new Date(Date.now() - 3*3600*1000).toISOString().slice(0, 10);

cargar();
</script>
