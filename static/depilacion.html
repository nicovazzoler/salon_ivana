<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Depilación — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  /* La pantalla de depilación es la de facturar con todo lo que no se usa
     sacado: zonas, la seña que ya dejó y cobrar. Nada de descuentos, ajustes por
     línea, presupuestos ni productos: el día de depilación se atiende con una
     mano sola y lo que sobra en la pantalla es tiempo. */
  .wrap{ max-width:1100px; }
  .tablero{ display:grid; gap:var(--sp-4); grid-template-columns:minmax(0,1fr) minmax(320px,.8fr); align-items:start; }
  @media (max-width:860px){ .tablero{ grid-template-columns:1fr; } }

  /* ----- la clienta ----- */
  .quien{ display:flex; flex-wrap:wrap; gap:var(--sp-3); align-items:flex-end;
          margin-bottom:var(--sp-3); }
  .quien .campo{ display:flex; flex-direction:column; gap:4px; }
  .quien .campo label{ margin:0; font-size:var(--fs-sm); font-weight:var(--fw-bold);
                       text-transform:uppercase; letter-spacing:var(--tracking-eti);
                       color:var(--acento); }
  .quien .cli{ flex:1 1 240px; min-width:0; position:relative; }
  .panel-sena .sCli{ position:relative; }
  .cli-drop{ position:absolute; z-index:20; left:0; right:0; top:100%; display:none;
             background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-md);
             box-shadow:var(--sombra-flote); max-height:260px; overflow:auto; }
  .cli-opt{ padding:var(--sp-2) var(--sp-3); cursor:pointer; }
  .cli-opt:hover{ background:var(--bg-header); }
  .cli-opt .det{ display:block; font-size:var(--fs-sm); color:var(--text-tenue); }

  /* ----- las señas que ya dejó -----
     Arriba y a la vista: una seña que aparece después de cobrar es plata que hay
     que devolver en el mostrador. */
  .cab-senas{ display:flex; align-items:center; gap:var(--sp-3);
              padding-bottom:var(--sp-2); margin-bottom:var(--sp-2);
              border-bottom:1px solid var(--border-sutil); }
  .cab-senas h3{ margin:0; }
  .cab-senas button{ margin-left:auto; }
  .tiene{ margin-bottom:var(--sp-3); padding:var(--sp-2) var(--sp-3); border-radius:var(--r-md);
          background:var(--verde-bg); border:1px solid var(--verde-borde);
          font-family:var(--font-display); font-size:var(--fs-lg); }
  /* Se señan todos los trabajos y se acumulan: la lista no puede empujar las
     zonas fuera de la pantalla. */
  .lista-senas{ max-height:11rem; overflow-y:auto; }
  .sena{ display:flex; align-items:center; gap:var(--sp-2);
         padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil); }
  .sena:last-child{ border-bottom:none; }
  .sena b{ font-variant-numeric:tabular-nums; }
  .sena .quienes{ font-weight:var(--fw-bold); }
  .sena.suya{ background:var(--verde-bg); }
  .sena .det{ font-size:var(--fs-sm); color:var(--text-tenue); }
  .sena .cuando{ margin-left:auto; font-size:var(--fs-sm); color:var(--text-tenue); }

  /* ----- las zonas ----- */
  .grupo{ margin-bottom:var(--sp-4); }
  .grupo h3{ margin:0 0 var(--sp-2); padding-bottom:4px;
             border-bottom:1px solid var(--border-sutil);
             font-size:var(--fs-base); color:var(--text-tenue);
             text-transform:uppercase; letter-spacing:.04em; }
  .zonas{ display:grid; gap:var(--sp-2); grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); }
  .zona{ display:flex; flex-direction:column; gap:2px; text-align:left; padding:var(--sp-2) var(--sp-3);
         border:1px solid var(--border); border-radius:var(--r-md); background:var(--bg-card);
         cursor:pointer; font:inherit; color:var(--text); }
  .zona:hover{ border-color:var(--acento); }
  .zona b{ font-weight:var(--fw-bold); }
  /* Los dos precios como en Facturar: manda el de transferencia, que es al que
     se ancla el comprobante, y el de efectivo va de apoyo. Si fuera al revés,
     el número grande no sería el del papel. */
  .zona .p-tr{ font-size:var(--fs-lg); font-weight:var(--fw-bold); color:var(--text-marca);
               font-variant-numeric:tabular-nums; }
  .zona .p-ef{ font-size:var(--fs-xs); color:var(--text-tenue); font-variant-numeric:tabular-nums; }
  .zona.puesta{ border-color:var(--acento); background:var(--bg-header); }
  /* La casilla de agregar: misma medida que una zona pero se lee como un hueco,
     no como un precio más para tocar de apurado. */
  .zona.nueva{ align-items:center; justify-content:center; text-align:center;
               border-style:dashed; color:var(--text-tenue); }
  /* El hueco no se pinta como una zona al pasarle por encima: la de al lado es
     un precio para tocar de apurado y las dos iguales se confunden. */
  .zona.nueva:hover{ background:var(--oro-a08); border-color:var(--acento);
                     color:var(--acento); }
  .alta{ display:flex; flex-wrap:wrap; gap:var(--sp-3); align-items:flex-end;
         margin-top:var(--sp-3); padding:var(--sp-3);
         background:var(--bg-sutil); border:1px solid var(--acento-border);
         border-radius:var(--r-md); }
  .alta[hidden]{ display:none; }
  .alta .campo{ display:flex; flex-direction:column; gap:4px; flex:1 1 160px; }
  .alta .campo label{ margin:0; font-size:var(--fs-sm); font-weight:var(--fw-bold);
                      text-transform:uppercase; letter-spacing:var(--tracking-eti);
                      color:var(--acento); }
  .alta .acc{ display:flex; gap:var(--sp-2); }
  .alta .nota{ flex:1 1 100%; margin:0; font-size:var(--fs-sm); color:var(--text-tenue); }

  /* ----- el ticket -----
     Cuatro pasos, uno abajo del otro: con qué paga, a quién se le hace, qué se
     hizo y cuánto da. Cada uno cerrado con su línea; de corrido se leían como
     un bloque solo y había que buscar dónde terminaba uno y empezaba el otro. */
  .ticket{ position:sticky; top:var(--sp-3); }
  /* A qué sesión va este cobro: un renglón chico abajo del título, que no compite
     con el total pero contesta la pregunta sin cambiar de solapa. */
  .a-que-sesion{ margin:calc(var(--sp-3) * -1 + 2px) 0 var(--sp-3);
                 font-size:var(--fs-sm); color:var(--text-tenue); }
  /* Cada tarjeta arranca con su título cerrado por una línea: son cinco fichas
     una abajo de la otra y sin el filete se leían todas de corrido. */
  .card > h3{ margin:0 0 var(--sp-3); padding-bottom:var(--sp-2);
              border-bottom:1px solid var(--border-sutil); }
  .formas, .quien{ padding-bottom:var(--sp-3); margin-bottom:var(--sp-3);
                   border-bottom:1px solid var(--border-sutil); }
  /* Los ítems en su propio recuadro, igual que el bloque de cobro de Facturar:
     es la parte que se toca y se lee aparte de la cuenta de abajo. */
  .lineas{ margin:0 0 var(--sp-3); padding:var(--sp-2) var(--sp-3) var(--sp-3);
           border:1px solid var(--border-sutil); border-radius:var(--r-md);
           background:var(--bg-sutil); }
  /* La línea de un ítem, entera en un renglón: la cantidad adelante, el nombre,
     el precio a la derecha con el de efectivo abajo y el quitar al final.
     Facturar la parte en dos renglones porque ahí hay seis controles por línea;
     acá son tres y, partida, la tira quedaba sola con medio renglón vacío al
     lado y cada zona ocupaba el doble de alto. */
  .lin{ display:grid; grid-template-columns:auto minmax(0,1fr) auto auto;
        align-items:center; gap:var(--sp-2) var(--sp-3); padding:var(--sp-2) 0;
        border-bottom:1px solid var(--border-sutil); }
  .lin:last-child{ border-bottom:none; }
  .lin .n{ font-family:var(--font-display); font-size:var(--fs-base);
           color:var(--text-titulo); line-height:1.25; overflow-wrap:anywhere; }
  .lin .plata{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;
               font-weight:var(--fw-bold); }
  .lin .ef{ display:block; font-size:var(--fs-xs); font-weight:var(--fw-normal);
            color:var(--text-tenue); }
  .lin .qty{ display:flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums; }
  .lin .qty span{ min-width:1.1em; text-align:center; }
  .lin .qty button{ width:28px; height:28px; padding:0; line-height:1;
                    background:var(--bg-input); border:1px solid var(--border);
                    color:var(--text); }
  .lin .quitar{ width:28px; height:28px; padding:0; line-height:1;
                background:transparent; border:1px solid var(--border);
                color:var(--danger); }
  .vacio{ color:var(--text-tenue); margin:var(--sp-3) 0; }

  /* La cuenta: cada renglón con su línea, que son cuentas encadenadas —subtotal,
     seña, subtotal otra vez— y no una lista de números sueltos. */
  .totales .ren{ display:flex; gap:var(--sp-2); align-items:baseline;
                 padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil); }
  .totales .ren > :last-child{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .totales .ren.sub b{ font-weight:var(--fw-bold); color:var(--text-titulo); }
  /* La seña es plata a favor y el descuento es plata que se resta: cada uno con
     el color con el que ya se lee en el resto de la app. */
  .totales .ren.sena b{ color:var(--success); }
  .totales .ren.sena .sin{ font-weight:var(--fw-normal); color:var(--text-tenue); }
  .totales .ren.desc{ color:var(--warn); }
  /* El total, como el de Facturar: el rótulo y el número del mismo cuerpo y el
     número en dorado, que en estas pantallas el dorado quiere decir plata. */
  .totales .ren.grande{ border-top:2px solid var(--border); border-bottom:none;
                        font-family:var(--font-display); font-size:var(--fs-xl);
                        color:var(--text-titulo); }
  .totales .ren.grande b{ font-weight:var(--fw-black); color:var(--text-marca); }
  .totales .ren .btn-mini{ margin-left:var(--sp-2); padding:1px 7px; }
  .totales .falta-forma{ color:var(--text-tenue); font-size:var(--fs-sm); padding:var(--sp-2) 0; }
  .formas{ display:flex; gap:var(--sp-2); }
  .formas button{ flex:1; }
  .formas button.on{ background:var(--bronce-400); color:var(--text-sobre-oro);
                     border-color:var(--bronce-500); font-weight:var(--fw-bold); }
  .acc-cobrar{ display:flex; flex-direction:column; gap:var(--sp-2); }
  .hecho{ margin-top:var(--sp-3); padding:var(--sp-3); border-radius:var(--r-md);
          background:var(--verde-bg); border:1px solid var(--verde-borde); }
  .hecho[hidden]{ display:none; }
  .hecho .det{ display:block; font-size:var(--fs-sm); color:var(--text-tenue); margin:2px 0 var(--sp-2); }

  /* ----- solapas -----
     Tres cosas distintas que se hacen en días distintos: cobrar (todo el día),
     cerrar el día (una vez) y mirar para atrás (cuando se pregunta). Una abajo
     de la otra, cobrar quedaba debajo de dos pantallas que casi nunca se usan. */
  .solapas{ display:flex; gap:var(--sp-2); margin-bottom:var(--sp-4); flex-wrap:wrap; }
  .solapas button.on{ background:var(--bronce-400); color:var(--text-sobre-oro);
                      border-color:var(--bronce-500); font-weight:var(--fw-bold); }
  .hoja[hidden]{ display:none; }

  /* Las señas se acumulan: se señan todos los trabajos y la clienta puede tener
     seis. La lista no puede empujar las zonas fuera de la pantalla. */
  .senas .lista{ max-height:9rem; overflow-y:auto; }
  .montos{ display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-2); }
  .montos .det{ width:100%; font-size:var(--fs-sm); color:var(--text-tenue); }

  /* ----- el día ----- */
  .dia-cab{ display:flex; gap:var(--sp-3); align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--sp-3); }
  /* La cabecera, en un renglón: "Sesión #6 · la lleva Carolina · lunes 12/10".
     Con rótulo arriba y dato abajo eran tres columnitas de distinto alto —el
     lapicito estiraba la del medio— y la línea quedaba toda escalonada. */
  .cab-sesion{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2);
               margin-bottom:var(--sp-3); }
  .cab-sesion .sep{ color:var(--text-tenue); }
  /* El lapicito, al alto del renglón y no al de un botón: acá es un detalle al
     lado de un nombre, no una acción de la tarjeta. */
  .cab-sesion .btn-mini{ padding:2px 8px; }
  .n-sesion{ font-family:var(--font-display); font-size:var(--fs-lg); color:var(--text-marca); }
  .tag.abierta{ background:var(--verde-bg); color:var(--success); }
  .tag.sin-pagar{ background:var(--rojo-bg); color:var(--danger); }
  /* El día, adentro de los trabajos de una sesión de varios días. */
  .dia-titulo{ margin:var(--sp-3) 0 var(--sp-2); font-size:var(--fs-base);
               text-transform:uppercase; letter-spacing:.04em; color:var(--text-tenue); }
  .dia-cab .campo{ display:flex; flex-direction:column; gap:3px; }
  .dia-cab .campo label{ margin:0; }
  .cuenta .ren{ display:flex; align-items:baseline; gap:var(--sp-2);
                padding:var(--sp-2) 0; border-bottom:1px solid var(--border-sutil); }
  .cuenta .ren > :last-child{ margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cuenta .ren.chico{ padding:2px 0 2px var(--sp-3); border-bottom:none;
                      font-size:var(--fs-sm); color:var(--text-tenue); }
  .cuenta .ren.chico.falta-fijo{ color:var(--danger); }
  .cuenta .resta{ color:var(--danger); }
  /* El número del que sale el reparto, en dorado: en estas pantallas el dorado
     quiere decir plata, igual que el total de un cobro. */
  .cuenta .ren.total{ border-bottom:2px solid var(--border); }
  .cuenta .ren.total b{ font-family:var(--font-display); font-size:var(--fs-lg);
                        font-weight:var(--fw-black); color:var(--text-marca); }
  .cuenta .ren.mitad{ border-bottom:none; }
  .cuenta .ren.mitad b{ font-weight:var(--fw-bold); }
  .cuenta .ren .btn-mini{ margin-left:6px; padding:1px 7px; }
  .puerta{ max-width:420px; margin:0 auto; text-align:center; }
  .puerta .campos{ display:flex; flex-direction:column; gap:var(--sp-3); margin:var(--sp-3) 0; text-align:left; }
  .err{ color:var(--danger); }
  /* La tabla desliza sola. Las columnas de plata no se parten (`nowrap`), así
     que abajo de 600px no entra: sin esto desbordaba la PÁGINA y se iba de
     costado todo —menú, tarjetas— y el botón de la última columna quedaba
     fuera de la pantalla del celular. */
  .tabla-scroll{ overflow-x:auto; }
  .tabla-chica{ width:100%; border-collapse:collapse; }
  .tabla-chica th{ text-align:left; font-size:var(--fs-sm); color:var(--text-tenue);
                   text-transform:uppercase; letter-spacing:.04em; padding:var(--sp-2); }
  .tabla-chica td{ padding:var(--sp-2); border-top:1px solid var(--border-sutil); }
  .tabla-chica td.num, .tabla-chica th.num{ text-align:right;
                   font-variant-numeric:tabular-nums; white-space:nowrap; }
  .deuda{ color:var(--danger); }

  /* El formulario de un gasto, igual que el de Sueldos: rótulo arriba, todo en
     una fila y los casilleros sin pisarse. */
  .agregar{ display:flex; flex-wrap:wrap; gap:var(--sp-3); align-items:flex-end;
            margin-top:var(--sp-3); padding-top:var(--sp-3);
            border-top:1px solid var(--border-sutil); }
  .agregar > div{ display:flex; flex-direction:column; min-width:110px; }
  .agregar label{ margin:0 0 4px; font-size:var(--fs-sm); font-weight:var(--fw-bold);
                  text-transform:uppercase; letter-spacing:var(--tracking-eti); color:var(--acento); }
  .agregar select, .agregar input{ width:100%; max-width:100%; }
  .agregar .ancho{ flex:2 1 220px; }
  .agregar .nota{ flex:1 1 100%; margin:0; }
</style>
</head><body>
<header>
  <span>🪒 Depilación</span>
  <nav class="menu"></nav>
</header>

<div class="wrap">
  <div class="card-head">
    <h2>Depilación</h2>
    <p>Las zonas, la seña que el cliente ya dejó y el cobro, en una pantalla.
       Se factura por el mismo lugar que Facturar, así que el comprobante, la caja
       y el reparto de la sesión salen de lo mismo.</p>
  </div>

  <div class="solapas">
    <button class="b-out on" data-hoja="cobrar">Cobrar</button>
    <button class="b-out" data-hoja="dia">La sesión</button>
    <button class="b-out" data-hoja="historial">Historial</button>
    <button class="b-out" data-hoja="sesiones">Las sesiones</button>
  </div>

  <div class="hoja" id="hCobrar">
  <div class="tablero">
    <div>
      <div class="card senas-card">
        <div class="cab-senas">
          <h3>Señas</h3>
          <button class="b-out btn-mini" id="btnSena">+ Agregar seña</button>
        </div>
        <div id="panelSena"></div>
        <div id="senas"></div>
      </div>

      <div class="card" style="margin-top:var(--sp-4);">
        <div id="catalogo"><p class="muted">Cargando las zonas…</p></div>
      </div>
    </div>

    <div class="card ticket">
      <h3>Facturar</h3>
      <div class="a-que-sesion" id="aQueSesion"></div>
      <div class="formas" id="formas">
        <button class="b-out" data-forma="efectivo">Efectivo</button>
        <button class="b-out" data-forma="transfer">Transferencia</button>
      </div>
      <div class="quien">
        <div class="campo cli">
          <label for="cliente">Cliente</label>
          <input id="cliente" autocomplete="off" placeholder="Buscar o escribir el nombre">
          <div class="cli-drop" id="cliDrop"></div>
        </div>
        <div class="campo"><label for="atiende">Atiende</label>
          <select id="atiende"></select></div>
      </div>
      <div class="lineas" id="lineas"><p class="vacio">Todavía no hay zonas elegidas.</p></div>
      <div class="totales" id="totales"></div>
      <div class="acc-cobrar">
        <button class="b-ok" id="btnCobrar" disabled>Cobrar</button>
        <button class="b-out" id="btnVaciar" disabled>Vaciar</button>
      </div>
      <div class="hecho" id="hecho" hidden></div>
    </div>
  </div>
  </div>

  <div class="hoja" id="hDia" hidden></div>
  <div class="hoja" id="hHistorial" hidden></div>
  <div class="hoja" id="hSesiones" hidden></div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script src="/static/js/senas.js"></script>
<script>
requireLogin();
pintarNav();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "$" + (n || 0).toLocaleString("es-AR");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}

let ZONAS = [], TICKET = [], CLI = null, SENAS = [], FORMA = null;

/* Lo que está a medio cargar se guarda en el aparato.

   No es por las recargas: es porque el recibo de la seña es una navegación —el
   papel sale por RawBT, que es otra app— y tomar una seña en el medio de un
   ticket se lleva la pantalla puesta. Volviendo, las zonas siguen ahí. */
const BORRADOR = "depi_borrador";
function guardarBorrador(){
  try{
    if(TICKET.length) localStorage.setItem(BORRADOR, JSON.stringify({TICKET, CLI, FORMA}));
    else localStorage.removeItem(BORRADOR);
  }catch(e){}
}
async function restaurarBorrador(){
  let b;
  try{ b = JSON.parse(localStorage.getItem(BORRADOR) || "null"); }catch(e){ return; }
  if(!b || !b.TICKET || !b.TICKET.length) return;
  TICKET = b.TICKET; CLI = b.CLI || null; FORMA = b.FORMA || null;
  document.querySelectorAll("#formas button").forEach(x =>
    x.classList.toggle("on", x.dataset.forma === FORMA));
  if(CLI){ $("#cliente").value = CLI.nombre; await mostrarSenas(); }
  pintar();
}

async function cargar(){
  ZONAS = await (await authFetch("/api/catalogo?de=depi")).json();
  const cfg = await (await authFetch("/api/config")).json();
  const emps = await (await authFetch("/api/empleados")).json();
  const quien = cfg.depi_a_cargo || "";
  // Viene puesta la que lleva la depilación: es la que atiende casi siempre, y
  // el desplegable en blanco termina en tickets sin nombre.
  $("#atiende").innerHTML = `<option value="">—</option>` + emps.filter(e => e.activo !== false)
    .map(e => `<option${e.nombre === quien ? " selected" : ""}>${esc(e.nombre)}</option>`).join("");
  pintarCatalogo();
  await mostrarSenas();      // el cartelito de "elegí la clienta" desde el arranque
  await restaurarBorrador();
  await decirLaSesion();
}

/* A qué sesión va lo que se está por cobrar.

   Es la pregunta que el cobro tiene que poder contestar sin cambiar de solapa:
   de la sesión cuelga de quién es la mitad, y cobrar en la sesión equivocada se
   descubre recién al repartir. */
async function decirLaSesion(){
  const caja = $("#aQueSesion");
  if(!caja) return;
  const r = await authFetch("/api/depilacion/sesion");
  const d = r.ok ? await r.json() : null;
  caja.innerHTML = d && d.sesion !== null
    ? `Va a la <b>sesión #${d.numero}</b>${d.a_cargo ? ` · la lleva ${esc(d.a_cargo)}` : ""}`
    : `No hay ninguna sesión abierta: se abre sola al cobrar.`;
}

function pintarCatalogo(){
  const cont = $("#catalogo");
  if(!ZONAS.length){
    cont.innerHTML = `<p class="muted">No hay zonas de depilación en el catálogo.
      Se marcan en Admin con "Es depilación", o se cargan de una con el script de la lista de precios.</p>`;
    return;
  }
  // Por precio y no por nombre: el catálogo ordena alfabéticamente y así "10
  // zonas" cae entre "1 zona" y "2 zonas", justo donde se toca de apurado.
  const porCat = {};
  [...ZONAS].sort((a, b) => a.precio_transfer - b.precio_transfer)
            .forEach(z => (porCat[z.categoria] = porCat[z.categoria] || []).push(z));
  cont.innerHTML = Object.keys(porCat).map(c => `
    <div class="grupo"><h3>${esc(c)}</h3>
      <div class="zonas">${porCat[c].map(z => `
        <button class="zona${TICKET.some(l => l.id === z.id) ? " puesta" : ""}" data-id="${z.id}">
          <b>${esc(z.nombre)}</b>
          <span class="p-tr">${fmt(z.precio_transfer)}</span>
          <span class="p-ef">c/desc ${fmt(z.precio)}</span>
        </button>`).join("")}
        <button class="zona nueva" data-cat="${esc(c)}"
                title="Agregar una zona a esta lista">+ Agregar</button>
      </div>
      <div class="alta" data-alta="${esc(c)}" hidden></div>
    </div>`).join("");
  cont.querySelectorAll(".zona[data-id]").forEach(b => {
    b.onclick = () => agregar(Number(b.dataset.id));
  });
  cont.querySelectorAll(".zona.nueva").forEach(b => {
    b.onclick = () => abrirAlta(b.dataset.cat);
  });
}

/* Agregar una zona desde acá, sin pasar por Admin.

   El precio que se pone es el de TRANSFERENCIA, que es el de la lista impresa
   en el local; el de efectivo lo saca el backend con la misma cuenta que el
   script de la lista. Es la peluquería al revés, y es el único orden en el que
   la chica puede copiar un renglón del papel sin hacer ninguna cuenta. */
function abrirAlta(cat){
  const caja = document.querySelector(`.alta[data-alta="${CSS.escape(cat)}"]`);
  if(!caja) return;
  if(!caja.hidden){ caja.hidden = true; caja.innerHTML = ""; return; }
  caja.hidden = false;
  caja.innerHTML = `
    <div class="campo"><label>Cómo se llama</label>
      <input class="aNombre" placeholder="Ej: 6 zonas" autocomplete="off"></div>
    <div class="campo"><label>Precio por transferencia</label>
      <input class="aPrecio" type="number" inputmode="numeric" placeholder="0"></div>
    <div class="acc">
      <button class="b-ok aGuardar">Agregar</button>
      <button class="b-out aCancelar">Cancelar</button>
    </div>
    <p class="nota aCuenta"></p>`;
  const nom = caja.querySelector(".aNombre"), pre = caja.querySelector(".aPrecio");
  const cuenta = () => {
    const v = parseInt(pre.value, 10) || 0;
    caja.querySelector(".aCuenta").textContent = v
      ? `Pagando en efectivo sale ${fmt(Math.round(v * 0.9))}.` : "";
  };
  pre.addEventListener("input", cuenta);
  caja.querySelector(".aCancelar").onclick = () => { caja.hidden = true; caja.innerHTML = ""; };
  caja.querySelector(".aGuardar").onclick = async () => {
    const nombre = nom.value.trim(), transfer = parseInt(pre.value, 10) || 0;
    if(!nombre){ toast("Falta el nombre"); nom.focus(); return; }
    if(transfer <= 0){ toast("Falta el precio"); pre.focus(); return; }
    const r = await authFetch("/api/items", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({categoria: cat, nombre, precio_transfer: transfer,
                            es_depilacion: true})});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo agregar"); return; }
    toast(`${nombre} agregada`);
    ZONAS = await (await authFetch("/api/catalogo?de=depi")).json();
    pintarCatalogo();
  };
  [nom, pre].forEach(i => i.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); caja.querySelector(".aGuardar").click(); }
  }));
  nom.focus();
}

function agregar(id){
  const z = ZONAS.find(x => x.id === id);
  if(!z) return;
  const ya = TICKET.find(l => l.id === id);
  if(ya) ya.cantidad++;
  else TICKET.push({id, nombre: z.nombre, precio: z.precio,
                    transfer: z.precio_transfer, cantidad: 1});
  pintar();
}

function pintar(){
  const cont = $("#lineas");
  cont.innerHTML = TICKET.length
    ? TICKET.map((l, i) => `<div class="lin">
        <div class="qty">
          <button data-menos="${i}" title="Una menos">−</button>
          <span>${l.cantidad}</span>
          <button data-mas="${i}" title="Una más">+</button>
        </div>
        <span class="n">${esc(l.nombre)}</span>
        <span class="plata">${fmt(l.transfer * l.cantidad)}
          <span class="ef">c/desc ${fmt(l.precio * l.cantidad)}</span></span>
        <button class="quitar" data-i="${i}" title="Sacar">×</button>
      </div>`).join("")
    : `<p class="vacio">Todavía no hay zonas elegidas.</p>`;
  cont.querySelectorAll("button[data-i]").forEach(b => {
    b.onclick = () => { TICKET.splice(Number(b.dataset.i), 1); pintar(); };
  });
  cont.querySelectorAll("button[data-mas]").forEach(b => {
    b.onclick = () => { TICKET[Number(b.dataset.mas)].cantidad++; pintar(); };
  });
  // Llegar a cero es sacar la línea: dejarla en 0 es un renglón que no cobra nada.
  cont.querySelectorAll("button[data-menos]").forEach(b => {
    b.onclick = () => {
      const l = TICKET[Number(b.dataset.menos)];
      if(--l.cantidad < 1) TICKET.splice(Number(b.dataset.menos), 1);
      pintar();
    };
  });

  /* La cuenta se lee de arriba a abajo y toda en la lista de transferencia, que
     es a la que se ancla el comprobante: subtotal, la seña que ya dejó, y recién
     al final el 10% de pagar en efectivo. Puesto al revés —la seña ya
     descontada— el renglón de la seña mostraba un número más chico del que la
     clienta tiene a favor y no había forma de explicarlo en el mostrador.

     El descuento sale de restar, no de multiplicar por 0,9: así el total de
     acá es exactamente el que va a cobrar el backend. */
  const trans = TICKET.reduce((a, l) => a + l.transfer * l.cantidad, 0);
  const efvo  = TICKET.reduce((a, l) => a + l.precio * l.cantidad, 0);
  const enEfvo = FORMA === "efectivo";
  const tapaT = Math.min(trans, SENAS.reduce((a, s) => a + valorSena(s), 0));   // la seña, en transfer
  const tapaE = Math.min(efvo, SENAS.reduce((a, s) => a + valorSenaEfectivo(s), 0)); // y en efectivo
  const restoT = Math.max(trans - tapaT, 0);
  const total = enEfvo ? Math.max(efvo - tapaE, 0) : restoT;
  const desc = restoT - total;
  const pct = restoT ? Math.round(desc / restoT * 1000) / 10 : 0;
  const botonSena = `<button class="b-out btn-mini" id="masSena"
      title="Tomar una seña que el cliente dejó y no quedó cargada">+ seña</button>`;

  const ren = (rot, monto, clase) =>
    `<div class="ren${clase ? " " + clase : ""}"><span>${rot}</span><b>${monto}</b></div>`;
  let filas = "";
  // Con transferencia y sin seña no hay nada que explicar: va el total y listo.
  if(SENAS.length || enEfvo) filas += ren("Subtotal", fmt(trans), "sub");
  // El renglón de la seña va SIEMPRE, aunque no tenga: ahí vive el botón para
  // cargar la que dejó y no quedó anotada, y escondiéndolo cuando no había
  // ninguna el botón solo aparecía cuando ya no hacía falta.
  filas += SENAS.length
    ? ren(`Seña ${botonSena}`, "−" + fmt(tapaT), "sena")
    : ren(`Seña ${botonSena}`, `<span class="sin">sin seña</span>`, "sena");
  if(SENAS.length && enEfvo) filas += ren("Subtotal", fmt(restoT), "sub");
  if(enEfvo) filas += ren(`Desc. efectivo ${pct}%`, "−" + fmt(desc), "desc");
  filas += FORMA
    ? ren("Total", fmt(total), "grande")
    : `<div class="falta-forma">Elegí arriba cómo paga para ver el total.</div>`;
  $("#totales").innerHTML = TICKET.length ? filas : "";
  const mas = $("#masSena");
  if(mas) mas.onclick = abrirPanelSena;

  // Sin forma de pago no se cobra: es lo que decide con qué lista se cobra y,
  // con una puesta de entrada, el día que se cobre distinto nadie la cambia.
  $("#btnCobrar").disabled = !TICKET.length || !FORMA;
  $("#btnVaciar").disabled = !TICKET.length;
  guardarBorrador();
  document.querySelectorAll(".zona").forEach(b => {
    b.classList.toggle("puesta", TICKET.some(l => l.id === Number(b.dataset.id)));
  });
}

/* La clienta que se tipeó y no se eligió de la lista.

   Igual que en Facturar: si el nombre existe tal cual, es esa; si no, se
   pregunta antes de crearla. Sin esto, la seña quedaba a nombre de una clienta
   nueva escrita apenas distinto y no se le aplicaba nunca. */
async function resolverCliente(nombre){
  const res = await (await authFetch("/api/clientes?q=" + encodeURIComponent(nombre))).json();
  const igual = res.find(c => c.nombre.toLowerCase() === nombre.toLowerCase());
  if(igual) return {id: igual.id, nombre: igual.nombre};
  if(!confirm(`"${nombre}" no está en la lista de clientes.\n\n¿Lo creamos?`)) return null;
  const r = await authFetch("/api/clientes", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({nombre})});
  if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo crear"); return null; }
  return {id: (await r.json()).id, nombre};
}

/* ---------- la clienta ---------- */

/* Todas las señas sin usar, de quien sean.

   La lista no es de la clienta que se está facturando: es el pizarrón de lo que
   el local debe trabajo. Se señan todos los turnos y la clienta que viene hoy
   puede no ser la que señó ayer; con la lista atada a la de arriba, esa plata no
   se veía hasta que alguien la buscaba cliente por cliente. */
let TODAS_SENAS = [];

async function mostrarSenas(avisar){
  try{ TODAS_SENAS = await (await authFetch("/api/senas?solo_libres=true")).json(); }
  catch(e){ TODAS_SENAS = []; }
  SENAS = CLI ? TODAS_SENAS.filter(s => s.cliente_id === CLI.id) : [];
  // El aviso salta al elegir a la clienta: una seña que aparece DESPUÉS de
  // cobrar es plata que hay que devolver en el mostrador.
  if(avisar && SENAS.length)
    toast(`${CLI.nombre} tiene ${fmt(SENAS.reduce((a, s) => a + valorSena(s), 0))} de seña`);

  const caja = $("#senas");
  caja.innerHTML = !TODAS_SENAS.length
    ? `<p class="muted">No hay ninguna seña sin usar. Las que se tomen aparecen acá
       hasta que se le facture.</p>`
    : `<div class="lista-senas">${TODAS_SENAS.map(s => `
        <div class="sena${CLI && s.cliente_id === CLI.id ? " suya" : ""}">
          <b>${fmt(valorSena(s))}</b>
          <span class="quienes">${esc(s.cliente || "—")}</span>
          <span class="det">${(s.forma_pago || "") === "Efectivo"
            ? `entraron ${fmt(s.monto)} en efectivo` : esc(s.forma_pago || "")}</span>
          <span class="cuando">${esc(s.fecha || "")}</span>
          <button class="b-out btn-mini borrar-sena" data-id="${s.id}"
                  title="Se le devolvió la plata">✕</button>
        </div>`).join("")}</div>`;
  caja.querySelectorAll(".borrar-sena").forEach(b => {
    b.onclick = async () => {
      if(!confirm("¿Se le devolvió esta seña?\n\nSale de las que están a favor y queda anotada como devuelta.")) return;
      const r = await authFetch("/api/senas/" + b.dataset.id, {method:"DELETE"});
      if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
      toast("Seña devuelta");
      mostrarSenas();
    };
  });
  pintar();
}

/* Tomar una seña es una cosa aparte de facturar: la clienta se elige adentro
   del formulario y lo que esté a medio cargar en Facturar no se toca. */
function abrirPanelSena(){

$("#btnVaciar").onclick = () => { TICKET = []; pintar(); };

/* Cobrar es el mismo camino que Facturar: se crea el comprobante, se aplican las
   señas y recién después se paga lo que falta. En ese orden, porque la seña baja
   el saldo: cobrando primero, la plata que ya dejó le queda a favor para siempre.

   Nada de la cuenta se hace acá: el total, el descuento en efectivo y lo que
   tapa la seña los calcula el backend. Lo de esta pantalla es lo que se le
   muestra, y sale de pedirle el comprobante después de cada paso. */
$("#btnCobrar").onclick = async () => {
  const nombre = $("#cliente").value.trim();
  if(!nombre){ toast("Falta el nombre del cliente"); $("#cliente").focus(); return; }
  if(!TICKET.length) return;
  const b = $("#btnCobrar");
  b.disabled = true;

  if(!FORMA){ toast("Elegí cómo paga"); b.disabled = false; return; }
  // La clienta tiene que existir: de ella salen las señas y la cuenta corriente.
  if(!CLI || CLI.nombre.toLowerCase() !== nombre.toLowerCase()){
    CLI = await resolverCliente(nombre);
    if(!CLI){ b.disabled = false; return; }
    $("#cliente").value = CLI.nombre;
    await mostrarSenas();
  }
  const total = TICKET.reduce((a, l) => a + (FORMA === "efectivo" ? l.precio : l.transfer) * l.cantidad, 0);
  if(!confirm(`${nombre}\n${TICKET.length} ${TICKET.length === 1 ? "zona" : "zonas"} · `
            + `${fmt(total)} en ${FORMA === "efectivo" ? "efectivo" : "transferencia"}`
            + `${SENAS.length ? "\n\nSe le aplican las señas que tiene a favor." : ""}`
            + `\n\n¿Lo cobramos?`)){ b.disabled = false; return; }

  /* Crear, aplicar las señas y cobrar, todo en UN pedido.

     Eran tres: si la segunda o la tercera no llegaba —internet del local, la
     tablet que se duerme— el ticket quedaba cobrado a medias. Con seña quedaba
     cobrado SOLO con la seña y el resto como deuda, y si lo que fallaba era la
     consulta del saldo ni siquiera avisaba. Ahora o queda cobrado o no queda
     nada. */
  const cuerpo = {tipo: "ticket", cliente_id: CLI.id, cliente_nombre: null,
                  peluquero: $("#atiende").value || null,
                  forma_pago: FORMA, descuento_pct: 0, mostrar_motivo: false,
                  lineas: TICKET.map(l => ({item_id: l.id, nombre: l.nombre, cantidad: l.cantidad})),
                  extras: [], aplicar_senas: true, cobrar: true};
  const r = await authFetch("/api/comprobantes", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(cuerpo)});
  if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo cobrar"); b.disabled = false; return; }
  const d = await r.json();
  const num = "N-" + String(d.numero).padStart(5, "0");
  $("#hecho").hidden = false;
  $("#hecho").innerHTML = `<b>${num} cobrado</b>
    <span class="det">${fmt(d.total_final)} de cuenta${
      d.senas_usadas ? ` · con ${d.senas_usadas === 1 ? "la seña que tenía" : `${d.senas_usadas} señas`}` : ""}${
      d.saldo > 0 ? ` · queda debiendo ${fmt(d.saldo)}` : ""}</span>
    <a class="b-out" href="/ticket?id=${d.id}">🖨️ Imprimir</a>`;
  toast(d.saldo > 0 ? `${num} con saldo pendiente` : `${num} cobrado ✓`);
  /* El papel se ofrece y no sale solo: imprimir es una navegación a RawBT y se
     lleva la pantalla puesta, así que primero se guarda y recién después se
     pregunta. El que dice que no tiene el botón de Imprimir ahí abajo. */
  if(confirm(`${num} cobrado.\n\n¿Le imprimimos el comprobante?`))
    location.href = "/ticket?id=" + d.id;
  TICKET = []; CLI = null; FORMA = null;
  document.querySelectorAll("#formas button").forEach(x => x.classList.remove("on"));
  $("#cliente").value = ""; $("#panelSena").innerHTML = "";
  // mostrarSenas() y no pintar(): sin esto la caja de señas seguía mostrando las
  // de la clienta anterior, ya aplicadas, como si todavía las tuviera a favor.
  mostrarSenas();
  decirLaSesion();           // el primer cobro puede haber abierto la sesión
};

/* ---------- el día ----------

   El cierre de caja de la depilación: lo que se facturó, lo que entró, los
   gastos y el reparto. Está acá y no en Sueldos porque son dos negocios
   distintos: en Sueldos se paga la peluquería y acá se paga el día.

   Todo lo de esta pantalla lo hacen las dos, sin código en el medio: el día de
   depilación se trabaja entre dos con una sola tablet. */
let DIA = null;              // la sesión que se está mirando
let SESION_VISTA = null;     // null = la abierta; un id = una del historial

const pedir = (url, opts) => authFetch(url, opts);

async function verDia(){
  const r = await pedir("/api/depilacion/sesion" + (SESION_VISTA ? "?id=" + SESION_VISTA : ""));
  if(!r.ok){ $("#hDia").innerHTML = `<div class="card"><p class="err">${
      (await r.json().catch(()=>({}))).detail || "No se pudo abrir la sesión"}</p></div>`; return; }
  const d = await r.json();
  if(!d || d.sesion === null){ DIA = null; pintarSinSesion(); return; }
  DIA = d;
  pintarDia();
}

/* Sin sesión abierta no hay nada que mirar: lo único que se ofrece es abrirla.
   Se elige quién la lleva porque de eso cuelga de quién es la mitad; deducirlo
   de quién facturó más alcanzaba hasta el día que se olvida de ponerse en un
   ticket y el reparto se lo lleva la que la ayudó. */
async function pintarSinSesion(){
  const emps = await (await authFetch("/api/empleados")).json();
  const cfg = await (await authFetch("/api/config")).json();
  const quien = cfg.depi_a_cargo || "";
  $("#hDia").innerHTML = `
    <div class="card">
      <h3>No hay ninguna sesión abierta</h3>
      <p class="nota" style="margin-top:0;">Una sesión es una jornada de depilación entera:
         se abre, se trabaja uno o varios días, se cargan los gastos cuando se pagan,
         y al final se cierra y se reparte <b>una sola vez</b>.</p>
      <div class="dia-cab">
        <div class="campo"><label for="aQuien">La lleva</label>
          <select id="aQuien">${emps.filter(e => e.activo !== false).map(e =>
            `<option value="${e.id}"${e.nombre === quien ? " selected" : ""}>${esc(e.nombre)}</option>`).join("")}</select></div>
        <button class="b-ok" id="aAbrir">Abrir la sesión</button>
      </div>
      <p class="nota">Si se cobra o se carga un gasto sin abrirla, se abre sola con
         ${quien ? esc(quien) : "la que lleva la depilación en Admin"}: un cobro no se
         puede caer porque nadie apretó un botón.</p>
    </div>`;
  $("#aAbrir").onclick = async () => {
    const r = await pedir("/api/depilacion/abrir", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({empleado_id: Number($("#aQuien").value) || null})});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo abrir"); return; }
    toast("Sesión abierta ✓");
    SESION_VISTA = null; verDia();
  };
}

function pintarDia(){
  const d = DIA, q = d.cuenta;
  const ayudantes = q.egresos_detalle.filter(e => e.ayudante);
  const maquinas  = q.egresos_detalle.filter(e => e.maquina);
  const otros     = q.egresos_detalle.filter(e => !e.ayudante && !e.maquina);
  const pagado = d.cerrado ? d.cerrado.total : 0;
  // "Cerrada" es que no quede nada por pagar. Lo facturado después de un cierre
  // sube el reparto, y esa diferencia se cobra con otro cierre.
  const cerrado = pagado > 0 && d.pendiente <= 0;
  const abierta = !d.cerrada;
  // Con la sesión cerrada los gastos no se tocan: cambiarlos movería una cuenta
  // ya liquidada. Mientras está abierta se corrigen acá mismo, que equivocarse
  // en un monto es lo más común y borrar y volver a cargar pierde el número.
  const acciones = e => !abierta ? "" : `
      <button class="b-out btn-mini editar-gasto" data-id="${e.id}" data-monto="${e.monto}"
              title="Corregir el monto">✎</button>
      <button class="b-out btn-mini borrar-gasto" data-id="${e.id}"
              title="Sacar este gasto de la sesión">✕</button>`;
  const gasto = (e, rot) => `<div class="ren chico" data-gasto="${e.id}">
      <span>${rot}${e.fecha && d.dias.length > 1 ? ` <em class="det">${fechaCorta(e.fecha)}</em>` : ""}${
        e.notas ? ` <em class="det">(${esc(e.notas)})</em>` : ""}</span>
      <span>−${fmt(e.monto)} ${acciones(e)}</span></div>`;
  const falta = (clase, rot) => !abierta ? "" : `<div class="ren chico falta-fijo">
      <span>${rot}</span>
      <span><button class="b-out btn-mini btn-${clase}">Cargar</button></span></div>`;
  const cobrado = Object.keys(d.cobrado || {});
  // Lo que arrastra de otras sesiones: el cierre lo descuenta solo.
  const deuda = (d.deuda_previa || []).reduce((a, x) => a + x.monto, 0);
  const cuando = d.dias.length
    ? (d.dias.length === 1 ? fechaLarga(d.dias[0])
       : `${fechaLarga(d.dias[0])} al ${fechaLarga(d.dias[d.dias.length - 1])} · ${d.dias.length} días`)
    : "todavía sin movimiento";

  $("#hDia").innerHTML = `
    <div class="card">
      <div class="cab-sesion">
        <b class="n-sesion">Sesión #${d.numero}</b>
        <span class="sep">·</span>
        <span>la lleva <b>${d.a_cargo ? esc(d.a_cargo) : "—"}</b></span>
        ${abierta ? `<button class="b-out btn-mini" id="bQuien" title="Corregir quién la lleva">✎</button>` : ""}
        <span class="sep">·</span>
        <span>${cuando}</span>
        ${abierta ? `<span class="tag abierta">Abierta</span>` : ""}
        ${pagado ? `<span class="tag">${cerrado ? "Ya pagada" : "Pagada en parte"} · ${fmt(pagado)}${
            d.cerrado.veces > 1 ? ` · ${d.cerrado.veces} cierres` : ""}</span>` : ""}
        ${!abierta && !pagado ? `<span class="tag sin-pagar">Cerrada sin pagar</span>` : ""}
        ${(d.correcciones || []).length ? `<span class="tag">Corregida</span>` : ""}
      </div>
      <div id="panelQuien"></div>
      ${d.dias.length ? "" : `<p class="muted">Todavía no se facturó ni se gastó nada en esta sesión.</p>`}
      ${SESION_VISTA ? `<p class="nota"><a href="#" id="bVolver">← Volver a la sesión en curso</a></p>` : ""}
      ${(d.otras_abiertas || []).length ? `<div class="aviso">⚠️ Hay
        ${d.otras_abiertas.length === 1 ? "otra sesión abierta" : `otras ${d.otras_abiertas.length} sesiones abiertas`}:
        ${d.otras_abiertas.map(o => `<a href="#" class="ir-sesion" data-id="${o.id}">#${o.numero}</a>`).join(", ")}.</div>` : ""}
    </div>

    <div class="card" style="margin-top:var(--sp-4);">
      <h3>Gastos de la sesión</h3>
      <div class="cuenta">
        ${maquinas.map(e => gasto(e, "Máquina")).join("")}
        ${maquinas.length ? "" : falta("maquina", "Máquina")}
        ${otros.map(e => gasto(e, (e.numero ? "#" + e.numero + " " : "") + esc(e.concepto || e.tipo || "Gasto"))).join("")}
        ${ayudantes.map(e => gasto(e, "Ayudante · " + esc(e.concepto || "sin nombre"))).join("")}
        ${ayudantes.length ? "" : falta("ayudante", "Pago a la ayudante")}
        <div class="ren"><span>Total de gastos</span><b class="${q.gastos ? "resta" : ""}">${q.gastos ? "−" : ""}${fmt(q.gastos)}</b></div>
      </div>
      ${!abierta ? "" : `<div class="acc-cobrar" style="flex-direction:row;flex-wrap:wrap;margin-top:var(--sp-3);">
        <button class="b-out btn-mini btn-gasto">+ Otro gasto</button>
        ${ayudantes.length ? `<button class="b-out btn-mini btn-ayudante">+ Otra ayudante</button>` : ""}
      </div>`}
      <div id="panelGasto"></div>
      <p class="nota">Se restan de la sesión entera, no del día en que se pagaron:
         la máquina se alquila para toda la jornada.</p>
    </div>

    <div class="card" style="margin-top:var(--sp-4);">
      <h3>El reparto</h3>
      <div class="cuenta">
        <div class="ren"><span>Lo facturado en la sesión
            <em class="det">los trabajos de depilación, en efectivo o por transferencia</em></span><b>${fmt(q.base)}</b></div>
        <div class="ren"><span>Gastos de la sesión</span><b class="${q.gastos ? "resta" : ""}">${q.gastos ? "−" : ""}${fmt(q.gastos)}</b></div>
        <div class="ren total"><span>Queda</span><b>${fmt(q.resto)}</b></div>
        <div class="ren mitad"><span>Para ${d.a_cargo ? esc(d.a_cargo) : "quien la lleva"}</span><b>${fmt(q.parte_empleada)}</b></div>
        <div class="ren mitad"><span>Para el salón</span><b>${fmt(q.parte_salon)}</b></div>
        ${pagado ? `<div class="ren chico"><span>Ya se le pagó</span><span>−${fmt(pagado)}</span></div>
          <div class="ren total"><span>${d.pendiente > 0 ? "Queda por pagar" : "No queda nada por pagar"}</span>
            <b>${fmt(d.pendiente)}</b></div>` : ""}
      </div>
      ${q.falta_cobrar > 0 ? `<div class="aviso">⚠️ De esta sesión falta cobrar ${fmt(q.falta_cobrar)}.
        El reparto es de lo que se trabajó, así que ya está contado: esa plata todavía no entró al cajón.</div>` : ""}
      ${q.resto < 0 ? `<div class="aviso">⚠️ Los gastos superan lo que se facturó. No hay nada para repartir.</div>` : ""}
    </div>

    ${(d.correcciones || []).length ? `
    <div class="card" style="margin-top:var(--sp-4);">
      <h3>Correcciones</h3>
      <p class="nota" style="margin-top:0;">Lo que se le tocó a esta sesión después de
        cerrarla. El próximo cierre ajusta solo la diferencia.</p>
      <div class="cuenta">
        ${d.correcciones.map(c => `
          <div class="ren"><span>${esc(c.detalle)}
              <em class="det">${esc(c.fecha)}${c.usuario ? " · " + esc(c.usuario) : ""}</em></span>
            <b>${c.antes === c.despues ? "—" : `${fmt(c.antes)} → ${fmt(c.despues)}`}</b></div>`).join("")}
      </div>
    </div>` : ""}

    <div class="card" style="margin-top:var(--sp-4);">
      <h3>Lo que entró</h3>
      ${cobrado.length ? `<div class="cuenta">${cobrado.map(f => `
        <div class="ren"><span>${esc(f)}</span><b>${fmt(d.cobrado[f])}</b></div>`).join("")}
        ${q.falta_cobrar > 0 ? `<div class="ren chico"><span>Falta cobrar</span><span class="deuda">${fmt(q.falta_cobrar)}</span></div>` : ""}
      </div>` : `<p class="muted">Todavía no se cobró nada de esta sesión.</p>`}
      <p class="nota">Esta plata está también en la caja del local, con el resto del día:
        el cliente paga en el mostrador. Acá se ve sola, para poder cerrar la depilación aparte.</p>
    </div>

    <details class="card" style="margin-top:var(--sp-4);">
      <summary><b>Los trabajos de la sesión</b> <span class="det">${d.comprobantes.length} ${
        d.comprobantes.length === 1 ? "ticket" : "tickets"}</span></summary>
      ${d.comprobantes.length ? d.dias.map(f => {
        const del = d.comprobantes.filter(c => c.dia === f);
        if(!del.length) return "";
        return `${d.dias.length > 1 ? `<h4 class="dia-titulo">${fechaLarga(f)}</h4>` : ""}
                ${tablaComprobantes(del)}`;
      }).join("") : `<p class="muted">Todavía no se facturó nada.</p>`}
    </details>

    ${!abierta ? "" : d.pendiente > 0 ? `
    <div class="card" style="margin-top:var(--sp-4);">
      <h3>${pagado ? "Pagar la diferencia" : "Cerrar la sesión"}</h3>
      ${pagado ? `<p class="nota" style="margin-top:0;">La sesión se cerró con ${fmt(pagado)} y
        después se facturó más, así que quedó esta diferencia.</p>` : ""}
      ${deuda ? `<div class="aviso">⚠️ A ${esc(d.a_cargo || "quien la lleva")} se le pagó de más en
        ${d.deuda_previa.map(x => `la sesión #${x.numero} (${fmt(x.monto)})`).join(", ")}.
        Se le descuenta${d.deuda_previa.length > 1 ? "n" : ""} de este cierre:
        le toca ${fmt(d.pendiente)} y se le dan <b>${fmt(Math.max(d.pendiente - deuda, 0))}</b>.</div>` : ""}
      <div class="dia-cab">
        <div class="campo"><label for="cForma">Se paga con</label>
          <select id="cForma"><option>Efectivo</option><option>Transferencia</option></select></div>
        <div class="campo"><label for="cFecha">El egreso va a la caja del</label>
          <input type="date" id="cFecha" value="${hoyArg()}"></div>
        <div class="campo"><label for="cNota">Nota (opcional)</label>
          <input id="cNota" maxlength="80"></div>
        <button class="b-ok" id="cCerrar">Cerrar y pagar ${fmt(Math.max(d.pendiente - deuda, 0))}</button>
      </div>
      <p class="nota">Queda la foto del reparto y el egreso anotado. Después de esto
         la sesión no recibe más trabajo y los gastos no se tocan.</p>
    </div>` : `
    <div class="card" style="margin-top:var(--sp-4);">
      <h3>Cerrar la sesión</h3>
      <p class="nota" style="margin-top:0;">${pagado
        ? "No queda nada para pagar." : "No hay nada para repartir todavía."}
        Cerrarla es dejar de aceptarle trabajo: no anota ningún egreso.</p>
      <button class="b-out" id="cCerrar">Cerrar la sesión</button>
    </div>`}`;

  const volver = $("#bVolver");
  if(volver) volver.onclick = e => { e.preventDefault(); SESION_VISTA = null; verDia(); };
  $("#hDia").querySelectorAll(".ir-sesion").forEach(a => {
    a.onclick = e => { e.preventDefault(); SESION_VISTA = Number(a.dataset.id); verDia(); };
  });
  const bq = $("#bQuien");
  if(bq) bq.onclick = cambiarQuienLleva;
  const bg = $("#hDia").querySelector(".btn-gasto");
  if(bg) bg.onclick = () => formGasto("insumo");
  const ba = $("#hDia").querySelector(".btn-ayudante");
  if(ba) ba.onclick = () => formGasto("ayudante");
  const bm = $("#hDia").querySelector(".btn-maquina");
  if(bm) bm.onclick = () => formGasto("maquina");
  $("#hDia").querySelectorAll(".editar-gasto").forEach(b => {
    b.onclick = () => editarGasto(b);
  });
  $("#hDia").querySelectorAll(".borrar-gasto").forEach(b => {
    b.onclick = async () => {
      if(!confirm("¿Sacar este gasto de la sesión? El reparto se recalcula solo.")) return;
      const r = await pedir(`/api/depilacion/gasto/${b.dataset.id}`, {method:"DELETE"});
      if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
      verDia();
    };
  });
  const cerrar = $("#cCerrar");
  if(cerrar) cerrar.onclick = async () => {
    // Sin nada para pagar no hay formulario: la sesión se cierra y nada más.
    const paga = d.pendiente > 0;
    const neto = Math.max(d.pendiente - deuda, 0);
    if(!confirm(paga
        ? `Se le pagan ${fmt(neto)} a ${d.a_cargo} por la sesión #${d.numero}.\n\n`
          + (deuda ? `Le toca ${fmt(d.pendiente)} menos ${fmt(Math.min(deuda, d.pendiente))} `
                   + `que se le había pagado de más.\n\n` : "")
          + `Queda la foto del reparto y el egreso anotado. Esto no se puede deshacer.`
        : `Cerrar la sesión #${d.numero} sin pagar nada.\n\n`
          + `Deja de aceptar trabajo y no anota ningún egreso.`)) return;
    const r = await pedir("/api/depilacion/cerrar", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(paga
        ? {sesion_id: d.id, forma_pago: $("#cForma").value, fecha_pago: $("#cFecha").value,
           notas: $("#cNota").value.trim() || null}
        : {sesion_id: d.id})});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo cerrar"); return; }
    toast("Sesión cerrada ✓");
    SESION_VISTA = null; verDia();
  };
}

/* Quién lleva la sesión se corrige: la sesión se abre sola con la de Admin
   cuando nadie la abrió a mano, y de esto cuelga de quién es la mitad. */
async function cambiarQuienLleva(){
  const emps = await (await authFetch("/api/empleados")).json();
  const caja = document.createElement("div");
  caja.className = "agregar";
  caja.innerHTML = `<div class="ancho"><label>La lleva</label>
      <select class="qQuien">${emps.filter(e => e.activo !== false).map(e =>
        `<option value="${e.id}"${e.nombre === DIA.a_cargo ? " selected" : ""}>${esc(e.nombre)}</option>`).join("")}</select></div>
    <button class="b-ok qOk">Guardar</button>
    <button class="b-out qNo">Cancelar</button>`;
  $("#panelQuien").innerHTML = "";
  $("#panelQuien").appendChild(caja);
  caja.querySelector(".qNo").onclick = () => caja.remove();
  caja.querySelector(".qOk").onclick = async () => {
    const r = await pedir(`/api/depilacion/sesion/${DIA.id}`, {method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({empleado_id: Number(caja.querySelector(".qQuien").value)})});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
    toast("Guardado");
    verDia();
  };
}

/* Corregir el monto de un gasto, en el renglón. El egreso es el mismo —mismo
   número y misma fecha—, así que la caja del día sigue contándolo una sola vez. */
function editarGasto(boton){
  const fila = boton.closest("[data-gasto]");
  if(fila.querySelector(".gEdit")) return;
  const caja = document.createElement("span");
  caja.className = "gEdit";
  caja.innerHTML = `<input type="number" class="gNuevo" min="1" inputmode="numeric"
      value="${boton.dataset.monto}" style="width:7rem;">
    <button class="b-ok btn-mini gSi">Guardar</button>
    <button class="b-out btn-mini gNo">Cancelar</button>`;
  fila.appendChild(caja);
  const inp = caja.querySelector(".gNuevo");
  inp.focus(); inp.select();
  caja.querySelector(".gNo").onclick = () => caja.remove();
  caja.querySelector(".gSi").onclick = async () => {
    const monto = parseInt(inp.value, 10) || 0;
    if(monto <= 0){ toast("Poné cuánto fue"); return; }
    const r = await pedir("/api/depilacion/gasto/" + boton.dataset.id, {method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({empleado_id: DIA.empleado_id, monto})});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
    toast("Corregido");
    verDia();
  };
  inp.addEventListener("keydown", e => {
    if(e.key === "Enter") caja.querySelector(".gSi").click();
    if(e.key === "Escape") caja.remove();
  });
}

function tablaComprobantes(filas){
  return `<div class="tabla-scroll"><table class="tabla-chica"><thead><tr>
      <th>N°</th><th>Hora</th><th>Cliente</th><th>Zonas</th><th>Forma</th>
      <th class="num">Total</th><th class="num">Debe</th></tr></thead><tbody>
    ${filas.map(c => `<tr>
      <td>N-${String(c.numero).padStart(5,"0")}</td>
      <td>${esc(c.hora || "")}</td>
      <td>${esc(c.cliente || "—")}</td>
      <td>${c.lineas.map(l => esc(l.nombre) + (l.cantidad > 1 ? ` ×${l.cantidad}` : "")).join(", ")}</td>
      <td>${esc(c.forma || "")}</td>
      <td class="num">${fmt(c.total)}</td>
      <td class="num ${c.saldo > 0 ? "deuda" : ""}">${c.saldo > 0 ? fmt(c.saldo) : "—"}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

/* El formulario de un gasto del día. El de la ayudante pide QUIÉN, porque es un
   pago a una persona; el de la máquina y el común piden qué y cuánto. La
   máquina no viene con monto: se alquila por jornada y un día corto sale menos. */
async function formGasto(clase){
  const esAyudante = clase === "ayudante";
  const otras = (await (await authFetch("/api/empleados")).json())
    .filter(e => e.activo !== false && e.nombre !== DIA.a_cargo);
  const fijo = esAyudante ? (DIA.cuenta.pago_ayudante || 0) : 0;
  const caja = document.createElement("div");
  caja.className = "agregar form-gasto";
  caja.innerHTML = esAyudante
    ? `<div class="ancho"><label>¿Quién ayudó?</label>
         <select class="gQuien">
           ${otras.map(e => `<option value="${esc(e.nombre)}">${esc(e.nombre)}</option>`).join("")}
           <option value="">Otra persona…</option></select></div>
       <div class="ancho gOtra" style="display:none;"><label>Nombre</label>
         <input class="gNombre" maxlength="60" placeholder="No es del salón"></div>
       <div style="flex:0 0 130px;"><label>Se le paga</label>
         <input type="number" class="gMonto" min="1" inputmode="numeric" value="${fijo || ""}"></div>
       <button class="b-ok gOk">Anotar el pago</button>
       <button class="b-out gNo">Cancelar</button>
       ${fijo ? `<span class="nota">El fijo son ${fmt(fijo)}. Si ponés otro número queda escrito que se cambió.</span>` : ""}`
    : `<div class="ancho"><label>${clase === "maquina" ? "Máquina de la sesión" : "Gasto de la sesión"}</label>
         <input class="gConcepto" maxlength="80" value="${clase === "maquina" ? "Alquiler de la máquina" : ""}"
                placeholder="Cera, descartables…"></div>
       <div style="flex:0 0 130px;"><label>${clase === "maquina" ? "Costó" : "Monto"}</label>
         <input type="number" class="gMonto" min="1" inputmode="numeric"></div>
       <button class="b-ok gOk">Anotar</button>
       <button class="b-out gNo">Cancelar</button>
       <span class="nota">Entra en la resta de la sesión, así que baja las dos mitades.</span>`;
  $("#panelGasto").innerHTML = "";
  $("#panelGasto").appendChild(caja);
  const sel = caja.querySelector(".gQuien");
  if(sel) sel.onchange = () => {
    caja.querySelector(".gOtra").style.display = sel.value ? "none" : "";
    if(!sel.value) caja.querySelector(".gNombre").focus();
  };
  caja.querySelector(".gNo").onclick = () => caja.remove();
  caja.querySelector(".gOk").onclick = async () => {
    const monto = parseInt(caja.querySelector(".gMonto").value, 10) || 0;
    if(monto <= 0){ toast("Poné cuánto fue"); return; }
    // Sin fecha: el egreso sale con la de hoy, que es cuando sale la plata del
    // cajón. De qué reparto se resta lo dice la sesión, no esa fecha.
    let cuerpo = {sesion_id: DIA.id, monto};
    if(esAyudante){
      const elegida = sel.value || caja.querySelector(".gNombre").value.trim();
      if(!elegida){ toast("Decí quién ayudó"); return; }
      const suya = otras.find(e => e.nombre === elegida);
      cuerpo = {...cuerpo, ayudante: true, concepto: elegida,
                ayudante_id: suya ? suya.id : null, tipo: "Ayudante depilación"};
    } else {
      const que = caja.querySelector(".gConcepto").value.trim();
      if(!que){ toast("Poné qué se gastó"); return; }
      cuerpo = clase === "maquina"
        ? {...cuerpo, concepto: que, tipo: "Máquina depilación", maquina: true}
        : {...cuerpo, concepto: que, tipo: "Insumos"};
    }
    const r = await pedir("/api/depilacion/gasto", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify(cuerpo)});
    if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo"); return; }
    verDia();
  };
  caja.querySelector(esAyudante ? ".gMonto" : ".gConcepto").focus();
}

/* ---------- historial ----------
   El de depilación y nada más: el de peluquería sigue en Historial, y mezclarlos
   es justo lo que no se quiere. */
async function verHistorial(){
  const hasta = hoyArg();
  const desde = new Date(new Date(hasta + "T12:00:00") - 60*24*3600*1000).toISOString().slice(0, 10);
  $("#hHistorial").innerHTML = `<div class="card">
    <div class="dia-cab">
      <div class="campo"><label for="hDesde">Desde</label><input type="date" id="hDesde" value="${desde}"></div>
      <div class="campo"><label for="hHasta">Hasta</label><input type="date" id="hHasta" value="${hasta}"></div>
      <button class="b-out" id="hVer">Ver</button>
    </div>
    <div id="hLista"><p class="muted">Cargando…</p></div>
  </div>`;
  $("#hVer").onclick = cargarHistorial;
  cargarHistorial();
}

/* Las sesiones, en su propia solapa. Antes vivían abajo de la tabla de
   comprobantes: para mirar una jornada vieja había que pasar de largo los
   trabajos de los últimos dos meses. */
function verSesiones(){
  $("#hSesiones").innerHTML = `<div class="card">
    <h3>Las sesiones</h3>
    <div id="hDias"><p class="muted">Cargando…</p></div></div>`;
  cargarDias();
}

/* Se anula lo de una sesión que todavía está abierta, no solo lo de hoy: una
   jornada dura dos días y el error se encuentra al otro, cuando se cierra la
   cuenta. Cerrada sí frena —el reparto ya se liquidó y sacarle un ticket le
   cambiaría la cuenta a lo que se pagó—, que es la misma regla de los gastos.
   El que frena de verdad es el backend; esto es para no ofrecer un botón que
   va a fallar. */
const anulable = c => c.sesion_id ? !c.sesion_cerrada : (c.fecha || "").slice(0,10) === hoyArg();

async function cargarHistorial(){
  if(!$("#hLista")) return;          // su solapa no está abierta
  const r = await authFetch(`/api/comprobantes?de=depi&desde=${$("#hDesde").value}`
    + `&hasta=${$("#hHasta").value}&limite=200`);
  const d = await r.json();
  const filas = d.comprobantes || [];
  $("#hLista").innerHTML = filas.length ? `
    <p class="muted">${filas.length} de ${d.total} · deuda ${fmt(d.deuda_total || 0)}</p>
    <div class="tabla-scroll"><table class="tabla-chica"><thead><tr>
      <th>N°</th><th>Fecha</th><th>Cliente</th><th>Atendió</th>
      <th class="num">Total</th><th class="num">Debe</th><th></th></tr></thead><tbody>
    ${filas.map(c => `<tr>
      <td><a href="/ticket?id=${c.id}">N-${String(c.numero).padStart(5,"0")}</a></td>
      <td>${esc((c.fecha || "").slice(0,10).split("-").reverse().join("/"))}</td>
      <td>${esc(c.cliente_nombre || "—")}</td>
      <td>${esc(c.peluquero || "—")}</td>
      <td class="num">${fmt(c.total_final)}</td>
      <td class="num ${c.saldo > 0 ? "deuda" : ""}">${c.saldo > 0 ? fmt(c.saldo) : "—"}</td>
      <td>${anulable(c)
            ? `<button class="b-del btn-mini anular" data-id="${c.id}"
                       data-num="${String(c.numero).padStart(5,"0")}">Anular</button>` : ""}</td>
    </tr>`).join("")}</tbody></table></div>`
    : `<p class="muted">No hay depilación en esas fechas.</p>`;
  $("#hLista").querySelectorAll(".anular").forEach(b => {
    b.onclick = async () => {
      if(!confirm(`¿Anular el N-${b.dataset.num}?\n\nSe le devuelven las señas que haya usado `
                + `y sale de la sesión. Esto no se puede deshacer.`)) return;
      const r = await authFetch("/api/comprobantes/" + b.dataset.id, {method:"DELETE"});
      if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo anular"); return; }
      toast("Anulado");
      cargarHistorial(); cargarDias();
    };
  });
}

async function cargarDias(){
  if(!$("#hDias")) return;           // su solapa no está abierta
  const r = await authFetch("/api/depilacion/sesiones");
  if(!r.ok){ $("#hDias").innerHTML = ""; return; }
  const ses = await r.json();
  const cuando = s => !s.desde ? "—"
    : s.dias > 1 ? `${fechaCorta(s.desde)} al ${fechaCorta(s.hasta)}` : fechaCorta(s.desde);
  $("#hDias").innerHTML = ses.length ? `
    <div class="tabla-scroll"><table class="tabla-chica"><thead><tr>
      <th>Sesión</th><th>Cuándo</th><th>La llevó</th><th class="num">Trabajos</th>
      <th class="num">Gastos</th><th class="num">Le tocó</th><th></th></tr></thead><tbody>
    ${ses.map(s => `<tr>
      <td><a href="#" class="ver-dia" data-id="${s.id}">#${s.numero}</a></td>
      <td>${cuando(s)}${s.dias > 1 ? ` <span class="det">${s.dias} días</span>` : ""}</td>
      <td>${esc(s.a_cargo || "—")}</td>
      <td class="num">${fmt(s.base)}</td>
      <td class="num">${s.gastos ? "−" + fmt(s.gastos) : "—"}</td>
      <td class="num">${fmt(s.parte_empleada)}</td>
      <td>${s.abierta ? `<b>abierta</b>`
            : s.cerrada ? "pagada"
            : s.pagado ? `<b class="deuda">falta ${fmt(s.parte_empleada - s.pagado)}</b>`
            : `<b class="deuda">sin pagar</b>`}
        ${s.correcciones ? `<span class="det">· corregida</span>` : ""}
        ${s.abierta ? "" : `<button class="b-out btn-mini reabrir" data-dueno
            data-id="${s.id}" data-num="${s.numero}"
            title="Volver a abrirla para corregirla">Reabrir</button>`}</td>
    </tr>`).join("")}</tbody></table></div>`
    : `<p class="muted">Todavía no hubo sesiones de depilación.</p>`;
  /* Reabrir es de la dueña: una sesión cerrada no acepta nada —ni anular un
     ticket que no iba— y eso es lo que protege un reparto ya pagado. El que
     frena es el backend; acá solo se esconde el botón. */
  $("#hDias").querySelectorAll(".reabrir").forEach(b => {
    b.onclick = async () => {
      if(!confirm(`¿Reabrir la sesión #${b.dataset.num}?\n\n`
                + `Vuelve a aceptar trabajo y gastos, y se puede anular un ticket que no iba. `
                + `Lo que ya se pagó queda pagado.`)) return;
      const r = await pedir("/api/depilacion/reabrir", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({sesion_id: Number(b.dataset.id)})});
      if(!r.ok){ toast((await r.json().catch(()=>({}))).detail || "No se pudo reabrir"); return; }
      toast(`Sesión #${b.dataset.num} reabierta`);
      SESION_VISTA = null;
      cargarDias(); cargarHistorial();
    };
  });
  ajustarPorRol();
  $("#hDias").querySelectorAll(".ver-dia").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      SESION_VISTA = Number(a.dataset.id);
      document.querySelector('.solapas button[data-hoja="dia"]').click();
    };
  });
}

const DUENO = getRol() === "dueno";
const hoyArg = () => new Date(Date.now() - 3*3600*1000).toISOString().slice(0, 10);
const fechaCorta = iso => iso ? iso.slice(8,10) + "/" + iso.slice(5,7) : "";
const _DIAS = ["domingo","lunes","martes","mi\u00e9rcoles","jueves","viernes","s\u00e1bado"];
/* "lunes 12/10". El día de la semana y no solo el número: una sesión se nombra
   por los días que se trabajó, y en el local se habla del lunes, no del 12. */
const fechaLarga = iso => {
  if(!iso) return "";
  const [a, m, d] = iso.split("-").map(Number);
  return `${_DIAS[new Date(a, m-1, d).getDay()]} ${fechaCorta(iso)}`;
};

cargar();
</script>
</body></html>
