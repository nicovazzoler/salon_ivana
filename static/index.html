<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1f1f1f">
<title>Facturación — Salón Ivana</title>
<style>
  :root{
    --tinta:#1f1f1f; --tinta2:#2b2b2b; --crema:#2b2b2b; --linea:#3a3a3a;
    --ok:#c9a84c; --okbg:rgba(201,168,76,.12); --alerta:#c0785a; --rojo:#c0392b;
    --texto:#e0dcd4; --oro:#c9a84c; --oro-claro:#e8d5a3; --superficie:#363636;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--crema); color:var(--texto);}

  /* ---- header ---- */
  header{background:var(--tinta); color:var(--oro-claro); padding:14px 24px; font-size:18px; font-weight:500;
         position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center;
         gap:12px; flex-wrap:wrap;}
  nav.menu{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  nav.menu a{color:rgba(255,255,255,.6); text-decoration:none; font-size:12px; font-weight:500;
             background:rgba(255,255,255,.08); padding:6px 10px; border-radius:8px;}
  nav.menu a.actual{background:var(--oro); color:#1a1a1a;}

  /* ---- layout ---- */
  .container{max-width:1280px; margin:0 auto;}
  .layout{display:flex; gap:20px; padding:20px; align-items:flex-start;}
  .catalogo{flex:1 1 60%; min-width:0;}
  .ticket{flex:0 0 320px; position:sticky; top:58px;
          background:var(--tinta); border:1px solid rgba(201,168,76,.25);
          border-radius:14px; padding:16px; min-height:200px;
          display:flex; flex-direction:column;}

  /* ---- buscador ---- */
  .buscador{position:relative; margin-bottom:14px;}
  .buscador input{width:100%; padding:10px 14px 10px 38px; border:1px solid var(--linea);
                  border-radius:10px; font-size:14px; font-family:inherit;
                  background:var(--superficie); color:var(--texto);}
  .buscador input::placeholder{color:#777;}
  .buscador .lupa{position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.5;}

  /* ---- category pills ---- */
  .cat-pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .cat-pill{padding:6px 14px; border-radius:20px; font-size:13px; cursor:pointer; border:1px solid transparent;
            background:rgba(255,255,255,.06); color:#aaa; transition:all .15s;}
  .cat-pill.on{background:rgba(201,168,76,.15); color:var(--oro); border-color:rgba(201,168,76,.3);}
  .cat-pill:hover{border-color:rgba(201,168,76,.2);}

  /* ---- section label ---- */
  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#888; margin-bottom:10px;}
  .barra{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .volver{background:var(--superficie); border:1px solid var(--linea); border-radius:8px; padding:6px 12px;
          font-size:13px; cursor:pointer; color:var(--texto); font-family:inherit;}
  .titulo-cat{font-size:15px; font-weight:500; color:var(--oro-claro);}

  /* ---- items grid ---- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .btn-item{background:rgba(255,255,255,.04); border:1px solid var(--linea); border-radius:10px;
            padding:10px 12px; text-align:left; cursor:pointer; transition:border-color .15s;
            display:flex; justify-content:space-between; align-items:center;}
  .btn-item:hover,.btn-item:active{border-color:var(--oro);}
  .btn-item .n{font-size:13px; color:var(--texto); line-height:1.3;}
  .btn-item .p{font-size:13px; color:var(--oro); font-weight:500; white-space:nowrap; margin-left:8px;}
  .btn-item .cat-mini{font-size:11px; color:#888; display:block; margin-top:2px;}
  .btn-item.cat{background:rgba(201,168,76,.15); border-color:rgba(201,168,76,.3);
                justify-content:center; text-align:center; padding:14px 13px;
                flex-direction:column; align-items:center;}
  .btn-item.cat .n{font-size:14px; color:var(--oro);}
  .btn-item.grupo{background:rgba(201,168,76,.08); border-color:rgba(201,168,76,.25);}
  .btn-item.grupo .n{color:var(--oro-claro);}
  .btn-item.grupo .hint{font-size:11px; color:#888; margin-top:4px;}
  .btn-item.grupo .chev{color:var(--oro); margin-left:4px;}
  .btn-item.var{flex-direction:column; align-items:center; text-align:center; padding:14px;}
  .btn-item.var .v{font-size:18px; font-weight:600; color:var(--oro-claro);}

  .tag{display:inline-block; font-size:10px; background:var(--okbg); color:var(--oro);
       padding:1px 7px; border-radius:20px; margin-left:6px;}

  /* ---- ticket ---- */
  .ticket h2{margin:0 0 10px; font-size:15px; font-weight:500; color:var(--oro-claro);
             display:flex; justify-content:space-between; align-items:center;}
  .ticket h2 .cnt{font-size:12px; color:#888; font-weight:400;}
  .edit-banner{background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.3); border-radius:8px;
               padding:8px 10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
               font-size:12px; color:var(--oro);}
  .edit-banner button{background:none; border:1px solid var(--rojo); color:var(--rojo); border-radius:6px;
                      padding:4px 10px; font-size:11px; cursor:pointer; font-family:inherit;}
  .linea{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06);}
  .linea .info{flex:1; font-size:13px; color:#ccc;}
  .linea .info small{color:#888;}
  .precio-input{width:70px; padding:3px 6px; border:1px solid var(--linea); border-radius:6px;
                background:var(--crema); color:var(--oro); font-size:12px; font-family:inherit;
                text-align:right; font-weight:500;}
  .precio-input:focus{border-color:var(--oro); outline:none;}
  .qty{display:flex; align-items:center; gap:5px;}
  .qty button{width:26px; height:26px; border-radius:6px; border:1px solid var(--linea);
              background:var(--crema); font-size:16px; cursor:pointer; line-height:1; color:var(--texto);}
  .dif{font-size:10px; border:1px solid var(--linea); border-radius:6px; padding:3px 5px;
       cursor:pointer; background:var(--crema); color:#aaa;}
  .dif.on{background:var(--alerta); color:#fff; border-color:var(--alerta);}
  .quitar{background:none; border:none; color:var(--rojo); font-size:16px; cursor:pointer; padding:0 3px;}
  .vacio{color:#888; font-size:13px; text-align:center; padding:24px 0;}
  .total{display:flex; justify-content:space-between; font-size:20px; font-weight:500;
         color:var(--oro); margin:12px 0; align-items:baseline;}
  .total .lbl{font-size:13px; color:#888;}

  /* ---- cliente / peluquero ---- */
.ticket-fields{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
.ticket-fields > div{width:100%;}
.ticket-fields label{display:block; font-size:10px; color:#777; margin-bottom:2px;}
.ticket-fields input{width:100%; padding:7px 10px; border:1px solid var(--linea); border-radius:8px;
                      background:var(--crema); color:var(--texto); font-size:12px; font-family:inherit;
                      box-sizing:border-box;}
.ticket-fields input::placeholder{color:#666;}

  /* ---- pagos ---- */
  .pagos{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .pago{border:1px solid var(--linea); background:rgba(255,255,255,.06); border-radius:8px;
        padding:6px 12px; font-size:12px; cursor:pointer; color:#aaa; font-family:inherit;}
  .pago.on{background:rgba(201,168,76,.15); color:var(--oro); border-color:rgba(201,168,76,.3);}
  .confirmar{width:100%; background:var(--oro); color:#1a1a1a; border:none; border-radius:10px;
             padding:12px; font-size:15px; font-weight:500; cursor:pointer; margin-top:auto; font-family:inherit;}
  .confirmar:disabled{background:#555; color:#888; cursor:not-allowed;}

  /* ---- ventas de hoy ---- */
  .ventas-hoy{margin-top:20px; padding:16px 0 0; border-top:1px solid rgba(255,255,255,.06);}
  .ventas-hoy-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; cursor:pointer;}
  .ventas-hoy-head .titulo{font-size:13px; color:#888;}
  .ventas-hoy-head .chev{font-size:12px; color:#666; transition:transform .15s;}
  .ventas-hoy-head .chev.cerrado{transform:rotate(-90deg);}
  .venta-row{display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13px;
             border-bottom:1px solid rgba(255,255,255,.04);}
  .venta-row .hora{color:#666; min-width:38px;}
  .venta-row .detalle{color:#aaa; flex:1;}
  .venta-row .detalle b{color:var(--texto); font-weight:500;}
  .venta-row .monto{color:var(--texto); font-weight:500;}
  .venta-row .acciones{display:flex; gap:4px;}
  .venta-row .acciones button{font-size:11px; cursor:pointer; background:none; border:none;
                               font-family:inherit; padding:4px 6px;}
  .venta-row .editar{color:var(--oro);}
  .venta-row .anular{color:var(--rojo);}

  /* ---- egreso section ---- */
  .egreso-section{padding:0 20px 20px; border-top:1px solid rgba(255,255,255,.06); margin-top:4px;}
  .egreso-title{font-size:14px; font-weight:500; color:var(--alerta); padding:16px 0 12px;}
  .egreso-form{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;}
  .egreso-form .campo{flex:1; min-width:120px;}
  .egreso-form .campo label{display:block; font-size:11px; color:#777; margin-bottom:4px;}
  .egreso-form .campo input,
  .egreso-form .campo select{width:100%; padding:8px 10px; border:1px solid var(--linea); border-radius:8px;
                              background:var(--superficie); color:var(--texto); font-size:13px; font-family:inherit;}
  .egreso-form .campo input::placeholder{color:#666;}
  .egreso-btn{padding:8px 16px; border-radius:8px; background:rgba(192,120,90,.2); color:var(--alerta);
              border:1px solid rgba(192,120,90,.3); font-size:13px; font-weight:500; cursor:pointer;
              font-family:inherit; white-space:nowrap; height:36px;}
  .egreso-hist{margin-top:12px;}
  .egreso-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer;
               padding:8px 0; font-size:12px; color:#666;}
  .egreso-head .chev{transition:transform .15s;}
  .egreso-head .chev.cerrado{transform:rotate(-90deg);}
  .egreso-row{display:flex; gap:6px; align-items:center; padding:6px 0; flex-wrap:wrap;
              border-bottom:1px solid rgba(255,255,255,.04);}
  .egreso-row input{padding:6px 8px; border:1px solid var(--linea); border-radius:6px; font-size:12px;
                    background:var(--crema); color:var(--texto); font-family:inherit;}
  .egreso-row .e-guardar{background:var(--oro); color:#1a1a1a; border:none; border-radius:6px;
                         padding:6px 10px; font-size:11px; font-weight:600; cursor:pointer;}
  .egreso-row .e-anular{background:transparent; border:1px solid var(--rojo); color:var(--rojo);
                        border-radius:6px; padding:6px 10px; font-size:11px; font-weight:600; cursor:pointer;}

  .colapsable.oculto{display:none;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--oro); color:#1a1a1a;
         padding:12px 20px; border-radius:10px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.3);
         opacity:0; pointer-events:none; transition:opacity .25s; font-size:14px;}
  .toast.show{opacity:1;}

  @media(max-width:760px){
    .layout{flex-direction:column;}
    .ticket{position:static; width:100%; flex:none;}
    .grid{grid-template-columns:1fr;}
    .egreso-form{flex-direction:column;}
  }
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<header>
  <span>Salón Ivana</span>
  <nav class="menu">
    <a href="/" class="actual">Facturación</a>
    <a href="/agenda">Agenda</a>
    <a href="/caja">Caja</a>
    <a href="/inventario" data-rol="dueno">Inventario</a>
    <a href="/reportes" data-rol="dueno">Reportes</a>
    <a href="/admin" data-rol="dueno">Admin</a>
    <a href="#" onclick="logout();return false;">Salir</a>
  </nav>
</header>

<div class="container">
<div class="layout">
  <div class="catalogo">
    <div class="buscador">
      <span class="lupa">🔎</span>
      <input id="buscar" placeholder="Buscar servicio o producto...">
    </div>
    <div id="catPills" class="cat-pills"></div>
    <div class="barra" id="barraNav" style="display:none;">
      <button class="volver" id="volver">← Volver</button>
      <span class="titulo-cat" id="tituloCat"></span>
    </div>
    <div class="grid" id="grid"></div>

    <div class="ventas-hoy" id="ventasSection">
      <div class="ventas-hoy-head" id="toggleVentas">
        <span class="titulo" id="ventasTitulo">Ventas de hoy</span>
        <span class="chev" id="chevVen">▾</span>
      </div>
      <div id="ventasLista" class="colapsable"></div>
    </div>
  </div>

  <div class="ticket">
    <h2>Ticket <span class="cnt" id="ticketCnt"></span></h2>
    <div id="editBanner" style="display:none;" class="edit-banner">
      <span>Editando venta #<span id="editId"></span></span>
      <button id="cancelEdit">Cancelar</button>
    </div>
    <div id="lineas"></div>
    <div class="total"><span class="lbl">Total</span><span id="total">$0</span></div>

    <div class="ticket-fields">
      <div>
        <label>Cliente: </label>
        <input id="fCliente" placeholder="Nombre del cliente">
      </div>
      <div>
        <label>Peluquero/a: </label>
        <input id="fPeluquero" placeholder="Nombre del peluquero">
      </div>
    </div>

    <div style="font-size:11px;color:#888;margin-bottom:6px;">Forma de pago</div>
    <div class="pagos" id="pagos"></div>
    <div id="aliasBox" style="display:none;margin-bottom:10px;">
      <label style="font-size:11px;color:#777;margin-bottom:4px;display:block;">Alias / cuenta</label>
      <input id="aliasInput" list="aliasList" placeholder="¿A qué cuenta entró?"
             style="width:100%;padding:8px;border:1px solid var(--linea);border-radius:8px;font-size:13px;
                    background:var(--crema);color:var(--texto);font-family:inherit;">
      <datalist id="aliasList"></datalist>
    </div>
    <button class="confirmar" id="confirmar" disabled>Confirmar venta</button>
  </div>
</div>

<div class="egreso-section">
  <div class="egreso-title">↓ Registrar egreso</div>
  <div class="egreso-form">
    <div class="campo"><label>Tipo</label>
      <input id="egTipo" list="egTipos" placeholder="Proveedor, retiro...">
      <datalist id="egTipos"></datalist></div>
    <div class="campo"><label>Concepto</label><input id="egConcepto" placeholder="Detalle"></div>
    <div class="campo" style="max-width:110px;"><label>Monto</label><input id="egMonto" type="number" placeholder="0"></div>
    <div class="campo" style="max-width:150px;"><label>Forma de pago</label><select id="egPago"></select></div>
    <button class="egreso-btn" id="btnGuardarEgreso">Registrar</button>
  </div>
  <div class="egreso-hist">
    <div class="egreso-head" id="toggleEgresosHoy">
      <span>Egresos de hoy</span><span class="chev" id="chevEgr">▾</span>
    </div>
    <div id="egresosHoy" class="colapsable"></div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script>
requireLogin(); pintarNav();
const API = "";
let ticket = [];
let formaPago = null;
let extraDif = 20000;
let egTiposCache = [];
let CATALOGO = [];
let vista = "cats";
let catActual = null;
let grupoActual = null;
let editandoVentaId = null;

const $ = s => document.querySelector(s);
const fmt = n => "$"+(n||0).toLocaleString("es-AR");
const ORDEN_VAR = ["S","M","L","XL","Mayor XL"];
const ordenVar = v => { const i = ORDEN_VAR.indexOf(v); return i<0 ? 99 : i; };

function parseNombre(nombre){
  const m = nombre.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if(m) return {base:m[1].trim(), variante:m[2].trim()};
  return {base:nombre.trim(), variante:null};
}

async function init(){
  try{
    const cfg = await (await authFetch(API+"/api/config")).json();
    extraDif = cfg.extra_dificultad;
    renderPagos(cfg.formas_pago);
    egTiposCache = cfg.tipos_egreso || [];
    $("#egTipos").innerHTML = egTiposCache.map(t=>`<option value="${t}">`).join("");
    $("#egPago").innerHTML = (cfg.formas_pago||[]).map(f=>`<option>${f}</option>`).join("");
    $("#aliasList").innerHTML = (cfg.alias||[]).map(a=>`<option value="${a}">`).join("");
    CATALOGO = await (await authFetch(API+"/api/catalogo")).json();
    renderCategorias();
    cargarEgresosHoy();
    cargarVentasDia();
  }catch(e){ alert("No pude conectar con el servidor. ¿Está corriendo uvicorn?"); }
}

function categorias(){
  const set = []; const vistos = new Set();
  CATALOGO.forEach(it=>{ if(!vistos.has(it.categoria)){ vistos.add(it.categoria); set.push(it.categoria);} });
  return set.sort((a,b)=>a.localeCompare(b,'es'));
}

function renderCategorias(){
  vista="cats"; catActual=null; grupoActual=null;
  $("#barraNav").style.display = "none";
  const pills = $("#catPills"); pills.innerHTML = "";
  pills.style.display = "flex";
  categorias().forEach(c=>{
    const b = document.createElement("button");
    b.className = "cat-pill";
    b.textContent = c;
    b.onclick = ()=>abrirCategoria(c);
    pills.appendChild(b);
  });
  $("#grid").innerHTML = '<div class="vacio" style="grid-column:1/-1;">Elegí una categoría para ver los servicios</div>';
}

function activarPill(cat){
  document.querySelectorAll(".cat-pill").forEach(p=>{
    p.classList.toggle("on", p.textContent===cat);
  });
}

function abrirCategoria(cat){
  vista="items"; catActual=cat; grupoActual=null;
  activarPill(cat);
  $("#catPills").style.display = "flex";
  $("#barraNav").style.display = "none";
  const items = CATALOGO.filter(i=>i.categoria===cat);
  const grupos = new Map();
  items.forEach(it=>{
    const {base, variante} = parseNombre(it.nombre);
    if(!grupos.has(base)) grupos.set(base, []);
    grupos.get(base).push({variante, it});
  });
  const g = $("#grid"); g.innerHTML = "";
  [...grupos.entries()].forEach(([base, arr])=>{
    if(arr.length===1){
      const it = arr[0].it;
      const b = document.createElement("button"); b.className="btn-item";
      b.innerHTML = `<span class="n">${it.nombre}${it.es_producto?'<span class="tag">prod</span>':''}</span>
        <span class="p">${fmt(it.precio)}</span>`;
      b.onclick = ()=>agregar(it);
      g.appendChild(b);
    } else {
      const labels = arr.map(a=>a.variante).filter(Boolean).sort((a,b)=>ordenVar(a)-ordenVar(b));
      const b = document.createElement("button"); b.className="btn-item grupo";
      b.innerHTML = `<span><span class="n">${base} <span class="chev">›</span></span>
        <span class="hint">${labels.join(" · ")||"varias opciones"}</span></span>
        <span class="p">${fmt(arr[0].it.precio)}+</span>`;
      b.onclick = ()=>abrirGrupo(base, arr);
      g.appendChild(b);
    }
  });
}

function abrirGrupo(base, arr){
  vista="grupo"; grupoActual=base;
  $("#catPills").style.display = "none";
  $("#barraNav").style.display = "flex";
  $("#volver").textContent = "← "+catActual;
  $("#tituloCat").textContent = base;
  const ordenado = [...arr].sort((a,b)=>ordenVar(a.variante)-ordenVar(b.variante));
  const g = $("#grid"); g.innerHTML="";
  ordenado.forEach(({variante, it})=>{
    const b = document.createElement("button"); b.className="btn-item var";
    b.innerHTML = `<span class="v">${variante||it.nombre}</span>
      <span class="p">${fmt(it.precio)}</span>`;
    b.onclick = ()=>{ agregar(it); };
    g.appendChild(b);
  });
}

function buscar(q){
  vista="buscar";
  $("#catPills").style.display = "none";
  $("#barraNav").style.display = "flex";
  $("#volver").textContent = "← Categorías";
  $("#tituloCat").textContent = `Resultados de "${q}"`;
  const res = CATALOGO.filter(i=>i.nombre.toLowerCase().includes(q.toLowerCase()));
  const g = $("#grid"); g.innerHTML="";
  if(res.length===0){ g.innerHTML='<p class="vacio" style="grid-column:1/-1;">Nada coincide con la búsqueda.</p>'; return; }
  res.forEach(it=>{
    const b = document.createElement("button"); b.className="btn-item";
    b.innerHTML = `<span class="n">${it.nombre}<span class="cat-mini">${it.categoria}</span></span>
      <span class="p">${fmt(it.precio)}</span>`;
    b.onclick = ()=>agregar(it);
    g.appendChild(b);
  });
}

$("#buscar").oninput = (e)=>{
  const q = e.target.value.trim();
  if(q.length===0){ renderCategorias(); return; }
  buscar(q);
};

$("#volver").onclick = ()=>{
  $("#buscar").value="";
  if(vista==="grupo"){ abrirCategoria(catActual); }
  else { renderCategorias(); }
};

function agregar(it){
  const ex = ticket.find(l=>l.item_id===it.id && !l.precioEditado);
  if(ex){ ex.cantidad++; }
  else{ ticket.push({item_id:it.id, nombre:it.nombre, precio:it.precio, precioCatalogo:it.precio,
                      cantidad:1, dificultad:false, precioEditado:false}); }
  renderTicket();
  mostrarToast(it.nombre+" agregado");
}

function calcSub(l){
  let base = l.precio * l.cantidad;
  if (formaPago === "Efectivo"){
    base = Math.round(base * 0.90);
  }
  return base + (l.dificultad?extraDif:0)
}

function renderTicket(){
  const cont = $("#lineas"); cont.innerHTML = "";
  $("#ticketCnt").textContent = ticket.length ? ticket.length+" ítem"+(ticket.length>1?"s":"") : "";

  // edit mode banner
  if(editandoVentaId){
    $("#editBanner").style.display = "flex";
    $("#editId").textContent = editandoVentaId;
  } else {
    $("#editBanner").style.display = "none";
  }

  if(ticket.length===0){
    cont.innerHTML = '<div class="vacio">Tocá un servicio o producto<br>para empezar la venta</div>';
  }
  ticket.forEach((l,i)=>{
    const sub = calcSub(l);
    const row = document.createElement("div");
    row.className = "linea";
    row.innerHTML = `
      <div class="info">${l.nombre}
        ${l.precioEditado ? '<small style="color:var(--alerta);"> (editado)</small>' : ''}
        <br><small>${fmt(sub)}</small>
      </div>
      <input type="number" class="precio-input" value="${l.precio}" title="Precio unitario">
      <button class="dif ${l.dificultad?'on':''}" title="Trabajo con dificultad">Dif</button>
      <div class="qty">
        <button class="menos">−</button><span>${l.cantidad}</span><button class="mas">+</button>
      </div>
      <button class="quitar">×</button>`;
    row.querySelector(".precio-input").onchange = (e)=>{
      const nuevo = parseInt(e.target.value) || 0;
      l.precio = nuevo;
      l.precioEditado = (nuevo !== l.precioCatalogo);
      renderTicket();
    };
    row.querySelector(".mas").onclick   = ()=>{ l.cantidad++; renderTicket(); };
    row.querySelector(".menos").onclick = ()=>{ l.cantidad--; if(l.cantidad<=0) ticket.splice(i,1); renderTicket(); };
    row.querySelector(".dif").onclick   = ()=>{ l.dificultad=!l.dificultad; renderTicket(); };
    row.querySelector(".quitar").onclick= ()=>{ ticket.splice(i,1); renderTicket(); };
    cont.appendChild(row);
  });
  const total = ticket.reduce((a,l)=>a + calcSub(l), 0);
  $("#total").textContent = fmt(total);
  const prefix = editandoVentaId ? "Guardar cambios" : "Confirmar venta";
  const label = formaPago === "Efectivo" ? `${prefix} — ${fmt(total)}` : prefix;
  $("#confirmar").textContent = label;
  $("#confirmar").disabled = (ticket.length===0 || !formaPago);
}

function renderPagos(formas){
  const cont = $("#pagos"); cont.innerHTML = "";
  formas.forEach(f=>{
    const b = document.createElement("button");
    b.className = "pago"; b.textContent = f;
    b.onclick = ()=>{ formaPago=f; document.querySelectorAll(".pago").forEach(x=>x.classList.remove("on"));
                      b.classList.add("on");
                      $("#aliasBox").style.display = (f==="Transferencia") ? "block" : "none";
                      renderTicket(); };
    cont.appendChild(b);
  });
}

function limpiarTicket(){
  ticket = []; formaPago = null; editandoVentaId = null;
  document.querySelectorAll(".pago").forEach(x=>x.classList.remove("on"));
  $("#aliasInput").value=""; $("#aliasBox").style.display="none";
  $("#fCliente").value=""; $("#fPeluquero").value="";
  renderTicket();
}

$("#confirmar").onclick = async ()=>{
  const body = {
    forma_pago: formaPago,
    alias: (formaPago==="Transferencia") ? ($("#aliasInput").value.trim() || null) : null,
    cliente: $("#fCliente").value.trim() || null,
    peluquero: $("#fPeluquero").value.trim() || null,
    lineas: ticket.map(l=>({
      item_id: l.item_id,
      cantidad: l.cantidad,
      dificultad: l.dificultad,
      precio_custom: l.precioEditado ? l.precio : null
    }))
  };
  $("#confirmar").disabled = true;
  try{
    let r;
    if(editandoVentaId){
      r = await authFetch(API+`/api/ventas/${editandoVentaId}`, {method:"PUT",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    } else {
      r = await authFetch(API+"/api/ventas", {method:"POST",
        headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    }
    if(!r.ok) throw new Error();
    const data = await r.json();
    const msg = editandoVentaId
      ? `Venta #${editandoVentaId} actualizada · ${fmt(data.total)}`
      : `Venta #${data.id} guardada · ${fmt(data.total)}`;
    mostrarToast(msg);
    limpiarTicket();
    cargarVentasDia();
  }catch(e){ alert("No se pudo guardar. Reintentá."); $("#confirmar").disabled=false; }
};

$("#cancelEdit").onclick = limpiarTicket;

function editarVenta(v){
  editandoVentaId = v.id;
  ticket = v.lineas.map(l=>{
    const catItem = CATALOGO.find(c=>c.id===l.item_id);
    const precioCat = catItem ? catItem.precio : l.precio_unit;
    return {
      item_id: l.item_id, nombre: l.nombre, precio: l.precio_unit,
      precioCatalogo: precioCat, cantidad: l.cantidad,
      dificultad: l.dificultad || false,
      precioEditado: (l.precio_unit !== precioCat)
    };
  });
  formaPago = v.forma_pago;
  document.querySelectorAll(".pago").forEach(b=>{
    b.classList.toggle("on", b.textContent === v.forma_pago);
  });
  $("#fCliente").value = v.cliente || "";
  $("#fPeluquero").value = v.peluquero || "";
  if(v.forma_pago === "Transferencia"){
    $("#aliasBox").style.display = "block";
    $("#aliasInput").value = v.alias || "";
  }
  renderTicket();
  window.scrollTo({top:0, behavior:'smooth'});
}

function mostrarToast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ----- plegables ----- */
$("#toggleEgresosHoy").onclick = ()=>{
  $("#egresosHoy").classList.toggle("oculto");
  $("#chevEgr").classList.toggle("cerrado");
};
$("#toggleVentas").onclick = ()=>{
  const wrap = $("#ventasLista");
  wrap.classList.toggle("oculto");
  $("#chevVen").classList.toggle("cerrado");
};

/* ----- egresos ----- */
$("#btnGuardarEgreso").onclick = async ()=>{
  const tipo = $("#egTipo").value.trim();
  const monto = parseInt($("#egMonto").value);
  if(!tipo || !monto){ mostrarToast("Completá tipo y monto"); return; }
  if(!egTiposCache.includes(tipo)){
    await authFetch("/api/tipos-egreso", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({nombre:tipo})});
    egTiposCache.push(tipo);
    $("#egTipos").innerHTML += `<option value="${tipo}">`;
  }
  await authFetch("/api/egresos", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tipo:tipo, concepto:$("#egConcepto").value, monto:monto, forma_pago:$("#egPago").value})});
  $("#egTipo").value=""; $("#egConcepto").value=""; $("#egMonto").value="";
  mostrarToast("Egreso registrado");
  cargarEgresosHoy();
};

async function cargarEgresosHoy(){
  const es = await (await authFetch("/api/egresos/dia")).json();
  const cont = $("#egresosHoy");
  if(es.length === 0){ cont.innerHTML = '<div style="color:#888;font-size:12px;padding:6px 0;">Sin egresos hoy.</div>'; return; }
  cont.innerHTML = "";
  es.forEach(e=>{
    const row = document.createElement("div");
    row.className = "egreso-row";
    row.innerHTML = `
      <input class="eHTipo" value="${e.tipo||''}" style="flex:1;min-width:80px;">
      <input class="eHConc" value="${e.concepto||''}" placeholder="concepto" style="flex:1.2;min-width:80px;">
      <input class="eHMonto" type="number" value="${e.monto}" style="width:80px;">
      <button class="e-guardar">✓</button>
      <button class="e-anular">×</button>`;
    row.querySelector(".e-guardar").onclick = async ()=>{
      await authFetch(`/api/egresos/${e.id}`, {method:"PUT", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({tipo:row.querySelector(".eHTipo").value, concepto:row.querySelector(".eHConc").value,
                             monto:parseInt(row.querySelector(".eHMonto").value)||0})});
      mostrarToast("Egreso actualizado"); cargarEgresosHoy();
    };
    row.querySelector(".e-anular").onclick = async ()=>{
      if(!confirm("¿Anular este egreso?")) return;
      await authFetch(`/api/egresos/${e.id}`, {method:"DELETE"});
      mostrarToast("Egreso anulado"); cargarEgresosHoy();
    };
    cont.appendChild(row);
  });
}

/* ----- ventas de hoy ----- */
async function cargarVentasDia(){
  const vs = await (await authFetch("/api/ventas/dia")).json();
  const cont = $("#ventasLista");
  const totalVentas = vs.reduce((a,v)=>a+v.total, 0);
  $("#ventasTitulo").textContent = vs.length
    ? `Ventas de hoy — ${vs.length} venta${vs.length>1?'s':''}, ${fmt(totalVentas)} total`
    : "Ventas de hoy";
  if(vs.length === 0){ cont.innerHTML = '<div style="color:#888;padding:8px 0;font-size:13px;">Todavía no hay ventas hoy.</div>'; return; }
  cont.innerHTML = "";
  vs.forEach(v=>{
    const items = v.lineas.map(l=>`${l.cantidad}× ${l.nombre}`).join(", ");
    const al = v.alias ? ` · ${v.alias}` : "";
    const cl = v.cliente ? ` · ${v.cliente}` : "";
    const row = document.createElement("div");
    row.className = "venta-row";
    row.innerHTML = `
      <span class="hora">${v.hora}</span>
      <span class="detalle"><b>#${v.id}</b> ${items} · ${v.forma_pago}${al}${cl}</span>
      <span class="monto">${fmt(v.total)}</span>
      <span class="acciones">
        <button class="editar">editar</button>
        <button class="anular">anular</button>
      </span>`;
    row.querySelector(".editar").onclick = ()=> editarVenta(v);
    row.querySelector(".anular").onclick = async ()=>{
      if(!confirm(`¿Anular la venta #${v.id}?`)) return;
      const r = await authFetch(`/api/ventas/${v.id}`, {method:"DELETE"});
      if(!r.ok){ mostrarToast("No se pudo anular"); return; }
      mostrarToast("Venta anulada");
      cargarVentasDia();
    };
    cont.appendChild(row);
  });
}

init();
renderTicket();
</script>
</body>
</html>
