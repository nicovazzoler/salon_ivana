<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Ingresar — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ivana">
<script src="/static/pwa.js" defer></script>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  /* La puerta de entrada: es la pantalla que más se mira y la que fija el tono
     del resto. Todo el peso lo llevan la tipografía y el aire. */
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
    background:var(--bg-app);
  }

  .box{
    width:100%; max-width:360px;
    padding:40px 36px 34px;
    background:var(--bg-elevado);
    border-radius:18px;
    box-shadow:var(--sombra-elevada);
  }

  .box h1{
    margin:10px 0 0;
    font-family:var(--font-display);
    font-size:38px;
    font-weight:var(--fw-bold);
    line-height:1.05;
    letter-spacing:-.02em;
    color:var(--tinta-900);
  }
  /* El filete corto es la firma que se repite en toda la app */
  .filete{
    width:44px; height:2px; margin:18px 0 22px;
    background:var(--bronce-500);
  }
  .box .sub{
    margin:0 0 26px;
    font-size:var(--fs-md);
    color:var(--tinta-500);
  }

  .campo{ margin-bottom:16px; }
  .campo label{ display:block; margin-bottom:6px; }
  .box input{
    width:100%;
    padding:12px 14px;
    background:var(--bg-input);
    border:1px solid var(--border);
    border-radius:9px;
    font-size:16px;               /* 16px: evita que el celular haga zoom al enfocar */
  }


  .box button{
    width:100%;
    margin-top:8px;
    padding:14px;
    border-radius:10px;
    background:var(--acento-fuerte);
    color:var(--text-sobre-oro);
    font-size:16px;
    font-weight:var(--fw-bold);
  }
  .box button:hover{ background:var(--bronce-500); color:var(--text-sobre-oro); }

  .err{
    margin-top:14px;
    min-height:18px;      /* reserva el lugar: el layout no salta al aparecer el error */
    font-size:var(--fs-base);
    color:var(--danger);
  }

</style>
</head><body>
<div class="box">
  <h1>Ivana Salón</h1>
  <div class="filete"></div>
  <p class="sub">Ingresá para continuar.</p>

  <div class="campo">
    <label for="u">Usuario</label>
    <input id="u" autocomplete="username">
  </div>
  <div class="campo">
    <label for="p">Contraseña</label>
    <input id="p" type="password" autocomplete="current-password">
  </div>

  <button id="btn">Ingresar</button>
  <div class="err" id="err" role="alert"></div>

</div>
<script>
async function entrar(){
  const u=document.getElementById("u").value.trim(), p=document.getElementById("p").value;
  const err=document.getElementById("err"), btn=document.getElementById("btn");
  err.textContent="";
  if(!u || !p){ err.textContent="Completá usuario y contraseña"; return; }
  btn.disabled=true; btn.textContent="Ingresando…";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({usuario:u,password:p})});
    // 429 es el freno por intentos fallidos: decirle "incorrectos" hacía seguir probando
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      err.textContent = r.status === 429 ? (e.detail || "Demasiados intentos. Esperá unos minutos.")
                                         : "Usuario o contraseña incorrectos";
      return;
    }
    const d=await r.json();
    localStorage.setItem("pelu_token",d.token);
    localStorage.setItem("pelu_rol",d.rol);
    localStorage.setItem("pelu_user",d.usuario);
    location.href="/";
  }catch(e){ err.textContent="No se pudo conectar"; }
  finally{ btn.disabled=false; btn.textContent="Ingresar"; }
}
document.getElementById("btn").onclick=entrar;
["u","p"].forEach(id=>document.getElementById(id)
  .addEventListener("keydown",e=>{ if(e.key==="Enter") entrar(); }));
document.getElementById("u").focus();
</script>
</body></html>
