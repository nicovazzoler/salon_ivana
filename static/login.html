<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f1f1f"><title>Ingresar — Peluquería</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .box{
    width:300px;
    padding:var(--sp-8);
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--sombra-card);
  }
  .box h1{ margin:0 0 var(--sp-1); font-size:20px; text-align:center; }
  .box p{
    margin:0 0 var(--sp-5);
    font-size:var(--fs-base);
    text-align:center;
    color:var(--text-tenue);
  }
  .box input{
    width:100%;
    margin:6px 0 14px;
    padding:11px;
    border-radius:var(--r-lg);
  }
  .box button{
    width:100%;
    padding:13px;
    border-radius:var(--r-lg);
    font-size:16px;
    font-weight:var(--fw-strong);
  }
  .err{
    margin-top:10px;
    min-height:18px;      /* reserva el lugar: el layout no salta al aparecer el error */
    font-size:var(--fs-base);
    text-align:center;
    color:var(--danger);
  }
</style>
<div class="box">
  <h1>💈 Salón Ivana </h1>
  <p>Ingresá para continuar</p>
  <label>Usuario</label><input id="u" autocomplete="username">
  <label>Contraseña</label><input id="p" type="password" autocomplete="current-password">
  <button id="btn">Ingresar</button>
  <div class="err" id="err"></div>
</div>
<script>
async function entrar(){
  const u=document.getElementById("u").value.trim(), p=document.getElementById("p").value;
  document.getElementById("err").textContent="";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({usuario:u,password:p})});
    if(!r.ok){document.getElementById("err").textContent="Usuario o contraseña incorrectos";return;}
    const d=await r.json();
    localStorage.setItem("pelu_token",d.token);
    localStorage.setItem("pelu_rol",d.rol);
    localStorage.setItem("pelu_user",d.usuario);
    location.href="/";
  }catch(e){document.getElementById("err").textContent="No se pudo conectar";}
}
document.getElementById("btn").onclick=entrar;
document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")entrar();});
</script>
</body></html>
