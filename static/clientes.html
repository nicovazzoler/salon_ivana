<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Clientes — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>

  /* Grilla de la lista. Las mismas columnas para la cabecera y para las filas */
  .grid-cli{
    display:grid;
    grid-template-columns:64px 1.4fr 1fr 1fr 90px;
    gap:10px;
    align-items:center;
  }
  .grid-cli.cab{
    padding:0 var(--sp-2) var(--sp-2);
    font-size:var(--fs-xs);
    font-weight:var(--fw-strong);
    text-transform:uppercase;
    color:var(--gris-300);
  }

  /* Cada fila es un <a> de verdad (no un div con onclick):
     así funciona el click del medio, copiar link y el teclado. */
  a.cli-row{
    padding:var(--sp-3) var(--sp-2);
    border-bottom:1px solid var(--border);
    border-radius:var(--r-md);
    text-decoration:none;
    color:inherit;                 /* pisa el dorado */
    transition:background .12s;
  }
  a.cli-row:hover{ background:var(--bg-hover); }

  .cli-row .id  { font-size:var(--fs-sm); color:var(--text-tenue); }
  .cli-row .n   { font-weight:var(--fw-bold); }
  .cli-row .meta{ font-size:var(--fs-base); color:var(--text-tenue); }
  /* La nota: un renglón chico bajo el nombre, para que se lea sin competir */
  .cli-row .nota{
    display:block;
    margin-top:2px;
    font-size:var(--fs-sm);
    font-weight:var(--fw-normal);
    color:var(--text-tenue);
  }

</style>
</head><body>
<header>
  <span>👥 Clientes</span>
  <nav class="menu">
    <a href="/">Facturación</a>
    <a href="/agenda">Agenda</a>
    <a href="/caja">Caja</a>
    <a href="/clientes">Clientes</a>
    <a href="/inventario" data-rol="dueno">Inventario</a>
    <a href="/reportes" data-rol="dueno">Reportes</a>
    <a href="/admin" data-rol="dueno">Admin</a>
    <a href="#" onclick="logout();return false;">Salir</a>
  </nav>
</header>
<div class="wrap">

  <div class="card">
    <h2>Nuevo cliente</h2>
    <div class="fila">
      <input id="nNombre" placeholder="Nombre y apellido" style="flex:1;min-width:160px;">
      <input id="nTel" placeholder="Teléfono (opcional)">
      <input id="nAlias" placeholder="Alias transferencia (opcional)">
      <input id="nNotas" placeholder="Nota (ej: mamá de Sofía)" style="flex:1;min-width:180px;">
      <button id="btnNuevo">Agregar</button>
    </div>
  </div>

  <div class="card">
    <input id="buscar" placeholder="🔎 Buscar por nombre o teléfono..." style="width:100%;margin-bottom:10px;">
    <div class="pills" id="filtros">
      <button class="pill on" data-f="todos">Todos</button>
      <button class="pill" data-f="deudores">Solo deudores</button>
      <span id="resumenDeuda" class="muted" style="margin-left:auto;align-self:center;"></span>
    </div>
    <div class="grid-cli cab">
      <span>Código</span><span>Nombre</span><span>Teléfono</span><span>Alias</span><span>Estado</span>
    </div>
    <div id="lista"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script>
requireLogin(); pintarNav();
const $=s=>document.querySelector(s);
let timer=null;
let CLIENTES=[], DEUDAS=new Map(), filtro="todos";

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function clienteId(id){ return "C-"+String(id).padStart(3,"0"); }
const money=n=>"$"+(n||0).toLocaleString("es-AR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function cargar(){
  const q=$("#buscar").value.trim();
  const url = q ? "/api/clientes?q="+encodeURIComponent(q) : "/api/clientes";

  // las dos en paralelo: si cada una tarda 200ms, en serie son 400 y así son 200
  const [rc, rd] = await Promise.all([ authFetch(url), authFetch("/api/clientes/deudas") ]);
  CLIENTES = await rc.json();
  const deudasList = await rd.json();
  // cuánto debe cada uno, para poder filtrar y mostrar el monto en la fila
  DEUDAS = new Map(deudasList.map(d => [d.cliente_id, d.saldo]));

  const total = deudasList.reduce((a,d)=>a+d.saldo, 0);
  $("#resumenDeuda").textContent = deudasList.length
    ? `${deudasList.length} ${deudasList.length===1?'cliente debe':'clientes deben'} ${money(total)}`
    : "Nadie debe nada";
  renderClientes();
}

function renderClientes(){
  const cont=$("#lista"); cont.innerHTML="";
  const clientes = filtro==="deudores" ? CLIENTES.filter(c=>DEUDAS.has(c.id)) : CLIENTES;

  if(CLIENTES.length===0){ cont.innerHTML='<p class="muted">No hay clientes para mostrar.</p>'; return; }
  if(clientes.length===0){ cont.innerHTML='<p class="muted">Ningún cliente con deuda.</p>'; return; }

  clientes.forEach(c=>{
    const row=document.createElement("a");     // <a> de verdad: click del medio, copiar link, teclado
    row.className="cli-row grid-cli";
    row.href="/cuenta?id="+c.id;
    const debe = DEUDAS.get(c.id);
    // La nota va debajo del nombre, chica: es contexto ("mamá de Sofía"), no
    // un dato de la fila. Antes esto terminaba metido dentro del nombre.
    const nota = (c.notas||"").trim();
    row.innerHTML=`
      <span class="id">${clienteId(c.id)}</span>
      <span class="n">${titulo(c.nombre||"")}${nota?`<span class="nota">${esc(nota)}</span>`:""}</span>
      <span class="meta">${c.telefono||"—"}</span>
      <span class="meta">${c.alias||"—"}</span>
      <span>${debe
        ? `<b style="color:var(--danger);">${money(debe)}</b>`
        : '<span style="color:var(--success);" class="muted">Al día</span>'}</span>`;
    cont.appendChild(row);
  });
}

$("#buscar").oninput=()=>{ clearTimeout(timer); timer=setTimeout(cargar,250); };

document.querySelectorAll("#filtros .pill").forEach(b=>{
  b.onclick=()=>{
    filtro=b.dataset.f;
    document.querySelectorAll("#filtros .pill").forEach(x=>x.classList.toggle("on", x===b));
    renderClientes();
  };
});

$("#btnNuevo").onclick=async()=>{
  const nombre=$("#nNombre").value.trim();
  if(!nombre){ toast("Poné al menos el nombre"); return; }
  const body={ nombre, telefono:$("#nTel").value.trim(), alias:$("#nAlias").value.trim(),
               notas:$("#nNotas").value.trim() };
  const r=await authFetch("/api/clientes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const e=await r.json().catch(()=>({})); toast(e.detail || "No se pudo crear"); return; }
  $("#nNombre").value=""; $("#nTel").value=""; $("#nAlias").value=""; $("#nNotas").value="";
  toast("Cliente agregado"); cargar();
};

cargar();
</script>
</body></html>
