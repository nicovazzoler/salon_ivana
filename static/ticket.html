<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Servicio — Ivana Salón</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  .wrap{ max-width:460px; }

  /* --- barra de acciones --- */
  .acciones{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .acciones .volver{
    padding:10px 14px;
    background:var(--bg-sutil);
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-imprimir{ flex:1; padding:12px; font-size:15px; }
  .btn-navegador{
    padding:10px 14px;
    background:var(--bg-card);
    border:1px solid var(--acento);
    color:var(--text);
  }

  /* --- papel: simula el rollo de 80mm --- */
  .papel{
    width:100%; max-width:340px;          /* ~80mm en pantalla */
    margin:0 auto;
    padding:18px 14px 26px;
    background:#fdfdf8;
    color:#1a1a1a;
    font-family:"Courier New", ui-monospace, monospace;
    font-size:12.5px;
    line-height:1.45;
    border-radius:4px 4px 0 0;
    box-shadow:var(--sombra-card);
    /* borde dentado abajo, como ticket cortado */
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 7px),
      97.5% 100%, 95% calc(100% - 7px), 92.5% 100%, 90% calc(100% - 7px),
      87.5% 100%, 85% calc(100% - 7px), 82.5% 100%, 80% calc(100% - 7px),
      77.5% 100%, 75% calc(100% - 7px), 72.5% 100%, 70% calc(100% - 7px),
      67.5% 100%, 65% calc(100% - 7px), 62.5% 100%, 60% calc(100% - 7px),
      57.5% 100%, 55% calc(100% - 7px), 52.5% 100%, 50% calc(100% - 7px),
      47.5% 100%, 45% calc(100% - 7px), 42.5% 100%, 40% calc(100% - 7px),
      37.5% 100%, 35% calc(100% - 7px), 32.5% 100%, 30% calc(100% - 7px),
      27.5% 100%, 25% calc(100% - 7px), 22.5% 100%, 20% calc(100% - 7px),
      17.5% 100%, 15% calc(100% - 7px), 12.5% 100%, 10% calc(100% - 7px),
      7.5% 100%, 5% calc(100% - 7px), 2.5% 100%, 0 calc(100% - 7px));
  }
  /* el papel pisa los estilos oscuros globales de la app (table, th, .fila...) */
  .papel .c{ text-align:center; }
  .papel .marca{ font-size:18px; font-weight:700; letter-spacing:1px; }
  .papel .chico{ font-size:11px; color:#555; }
  .papel .sep{ border:none; border-top:1px dashed #999; margin:8px 0; }
  .papel .fila{ display:flex; flex-wrap:nowrap; justify-content:space-between; gap:8px; margin:2px 0; color:inherit; }
  .papel .fila .der{ white-space:nowrap; }
  .papel .fila.tenue{ color:#666; }
  .papel .fila.total{ font-weight:700; font-size:15px; margin-top:4px; }
  .papel .fila.pend{ font-weight:700; }
  .papel table{ width:100%; border-collapse:collapse; color:inherit; font-size:inherit; }
  .papel th{ text-align:right; font-size:11px; color:#555; font-weight:400;
             text-transform:none; letter-spacing:0; background:none;
             padding:0 0 2px; border-bottom:none; }
  .papel th:first-child{ text-align:left; }
  .papel td{ vertical-align:top; padding:1px 0; color:inherit; border-bottom:none; font-size:inherit; }
  .papel td.precio{ text-align:right; white-space:nowrap; padding-left:8px; }
  .papel .gracias{ margin-top:12px; }
  /* El aviso legal: chico, espaciado y en versalita, para que se lea como un
     sello y no compita con el detalle. */
  .papel .legal{
    font-size:10px;
    letter-spacing:.06em;
    color:#555;
  }

  #estado{ margin:20px 0; text-align:center; }

  /* --- impresión desde el navegador: solo el papel, en 80mm --- */
  @media print{
    @page{ size:80mm auto; margin:0; }
    body{ background:#fff; }
    header, .acciones, #estado, .toast{ display:none !important; }
    .wrap{ max-width:none; margin:0; padding:0; }
    .papel{
      max-width:none; width:72mm; margin:0; padding:4mm 2mm;
      box-shadow:none; border-radius:0; clip-path:none;
    }
  }
</style>
</head><body>
<header>
  <span>🧾 Ticket</span>
  <nav class="menu"></nav>
</header>
<div class="wrap">
  <div class="acciones">
    <button class="volver" onclick="history.length>1?history.back():location.href='/historial'">← Volver</button>
    <button class="btn-imprimir" id="btnComandera">🖨️ Imprimir</button>
    <button class="btn-navegador" id="btnNavegador" title="Imprimir con el diálogo del navegador">PDF</button>
  </div>
  <div id="estado" class="muted">Cargando…</div>
  <div class="papel" id="papel" style="display:none;"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script src="/static/escpos.js"></script>
<script>
requireLogin(); pintarNav();
const $=s=>document.querySelector(s);
const fmt=n=>"$"+(n||0).toLocaleString("es-AR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}

/* En el ticket impreso NUNCA se usa la palabra "efectivo":
   la lista transferencia es "Lista" y la lista efectivo es "Descuento". */

let COMP=null, NEGOCIO={}, CUENTA=null;

/* El aviso legal va arriba Y abajo, enmarcando todo el papel: así queda claro
   de entrada y de salida que esto no reemplaza a una factura, mire por donde
   mire el que lo recibe. Se escribe sin tildes porque el mismo texto se manda
   a la comandera. */
const LEGAL_TXT = EscPos.LEGAL_TXT;
const {numComp, fechaLocal, fechaSolo, hayAjuste, textoAjuste} = EscPos;

async function init(){
  const params=new URLSearchParams(location.search);
  const id=params.get("id");
  const tipoPag=params.get("tipo");
  const clienteId=params.get("cliente");

  try{
    const cfg=await (await authFetch("/api/config")).json();
    NEGOCIO=cfg.negocio||{};
  }catch(e){ $("#estado").textContent="No se pudo cargar config."; return; }

  if(tipoPag==="cuenta" && clienteId){
    try{
      const r=await authFetch("/api/clientes/"+clienteId+"/cuenta");
      if(!r.ok){ $("#estado").textContent="No se encontró el cliente."; return; }
      CUENTA=await r.json();
    }catch(e){ $("#estado").textContent="No se pudo cargar la cuenta."; return; }
    renderCuenta();
  } else if(id){
    try{
      const r=await authFetch("/api/comprobantes/"+id);
      if(!r.ok){ $("#estado").textContent="No se encontró el servicio."; return; }
      COMP=await r.json();
    }catch(e){ $("#estado").textContent="No se pudo cargar."; return; }
    render();
  } else {
    $("#estado").textContent="Falta el numero de servicio (?id=...)"; return;
  }
  $("#estado").style.display="none";
  $("#papel").style.display="block";
}

/* Precios unitarios de una línea, ya con su ajuste aplicado. */
const {pu, pe} = EscPos;

/* Renglón que explica el ajuste de una línea: cuánto era y cuánto quedó por unidad. */
function filaAjuste(l){
  return `<div class="fila tenue" style="padding-left:10px;">
    <span>↳ ${esc(textoAjuste(l))}</span>
    <span class="der">${fmt(l.precio_unit)} → ${fmt(pu(l))} c/u</span></div>`;
}

/* ---------- vista previa HTML (espejo de lo que sale por la comandera) ---------- */
function render(){
  const d=COMP, esPresu=d.tipo==="presupuesto";
  const partes=[];

  // El aviso legal abre el papel, antes del nombre del negocio
  partes.push(`<div class="c legal">${LEGAL_TXT}</div>`);
  partes.push('<hr class="sep">');
  // encabezado del negocio (los campos vacíos no salen)
  partes.push(`<div class="c marca">${esc(NEGOCIO.nombre||"")}</div>`);
  const datos=[NEGOCIO.direccion, NEGOCIO.telefono&&("Tel: "+NEGOCIO.telefono), NEGOCIO.instagram].filter(Boolean);
  if(datos.length) partes.push(`<div class="c chico">${datos.map(esc).join("<br>")}</div>`);

  partes.push('<hr class="sep">');
  partes.push(`<div class="fila"><span>${esPresu?"PRESUPUESTO":"SERVICIO"} <b>${numComp(d.tipo,d.numero)}</b></span><span class="der chico">${fechaLocal(d.fecha)}</span></div>`);
  if(d.cliente_nombre) partes.push(`<div class="fila chico"><span>Cliente: ${esc(d.cliente_nombre)}</span></div>`);
  // Un servicio que se atendió un día y se anotó otro lo aclara: la fecha de
  // arriba es la del servicio, y sin esto no se entendería la diferencia.
  if(d.anotado_despues) partes.push(`<div class="fila chico"><span>Anotado el ${fechaSolo(d.anotado_despues)}</span></div>`);
  partes.push('<hr class="sep">');

  if(esPresu){
    // presupuesto: las dos listas de precios, columna por columna
    partes.push('<table><tr><th>Detalle</th><th>Lista</th><th>Con descuento</th></tr>');
    d.lineas.forEach(l=>{
      partes.push(`<tr><td>${l.cantidad}× ${esc(l.nombre)}${l.dificultad?" *":""}</td>
        <td class="precio">${fmt(pu(l)*l.cantidad)}</td>
        <td class="precio">${fmt(pe(l)*l.cantidad)}</td></tr>`);
      // el ajuste de la línea se detalla abajo, con el precio de lista original
      if(hayAjuste(l)) partes.push(filaAjuste(l));
    });
    partes.push('</table>');
    if(d.extra_dificultad>0) partes.push(`<div class="fila tenue"><span>* Extra dificultad</span><span class="der">+${fmt(d.extra_dificultad)}</span></div>`);
    partes.push('<hr class="sep">');

    const extra=d.extra_dificultad||0;
    let totLista=d.lineas.reduce((a,l)=>a+pu(l)*l.cantidad,0)+extra;
    let totPromo=d.lineas.reduce((a,l)=>a+pe(l)*l.cantidad,0)+extra;
    if(d.descuento_pct>0){
      partes.push(`<div class="fila tenue"><span>${esc(d.descuento_nombre||"Descuento")} ${d.descuento_pct}%</span><span class="der">aplicado</span></div>`);
      totLista=Math.round(totLista*(100-d.descuento_pct)/100);
      totPromo=Math.round(totPromo*(100-d.descuento_pct)/100);
    }
    // Los extras van despues del descuento: no los toca
    (d.extras||[]).forEach(e=>{
      partes.push(`<div class="fila"><span>+ ${esc(e.concepto)}</span><span class="der">${fmt(e.monto)}</span></div>`);
      totLista+=e.monto; totPromo+=e.monto;
    });
    partes.push(`<div class="fila total"><span>Total lista</span><span class="der">${fmt(totLista)}</span></div>`);
    partes.push(`<div class="fila total"><span>Total con descuento</span><span class="der">${fmt(totPromo)}</span></div>`);
    partes.push(`<div class="c chico" style="margin-top:8px;">Presupuesto sin valor fiscal.<br>Precios sujetos a cambio sin previo aviso.</div>`);
  } else {
    // ticket de venta: precios de lista + descuentos aplicados
    d.lineas.forEach(l=>{
      partes.push(`<div class="fila"><span>${l.cantidad}× ${esc(l.nombre)}${l.dificultad?" *":""}</span><span class="der">${fmt(pu(l)*l.cantidad)}</span></div>`);
      if(hayAjuste(l)) partes.push(filaAjuste(l));
    });
    if(d.extra_dificultad>0) partes.push(`<div class="fila tenue"><span>* Extra dificultad</span><span class="der">+${fmt(d.extra_dificultad)}</span></div>`);
    partes.push('<hr class="sep">');

    /* Subtotal antes de cualquier descuento. Se suma de los mismos renglones
       que se acaban de imprimir, no de un campo aparte: así la cuenta cierra a
       ojo sobre el papel. */
    const subtotal = d.lineas.reduce((a,l)=>a+pu(l)*l.cantidad,0) + (d.extra_dificultad||0);
    const hayDesc = d.desc_efectivo>0 || d.desc_jubilado>0
                 || d.pagos.reduce((a,p)=>a+(p.desc_aplicado||0),0)>0;
    if(hayDesc) partes.push(`<div class="fila"><span>Subtotal</span><span class="der">${fmt(subtotal)}</span></div>`);

    if(d.desc_efectivo>0){
      const pct=(d.desc_efectivo/d.total_transfer*100).toFixed(2);
      partes.push(`<div class="fila tenue"><span>Descuento ${pct}%</span><span class="der">−${fmt(d.desc_efectivo)}</span></div>`);
    }
    if(d.desc_jubilado>0){
      partes.push(`<div class="fila tenue"><span>${esc(d.descuento_nombre||"Descuento")} ${d.descuento_pct}%</span><span class="der">−${fmt(d.desc_jubilado)}</span></div>`);
    }
    // descuento hecho al momento de pagar (ej: abonó en promo una deuda)
    const descPagos=d.pagos.reduce((a,p)=>a+(p.desc_aplicado||0),0);
    if(descPagos>0) partes.push(`<div class="fila tenue"><span>Descuento (al abonar)</span><span class="der">−${fmt(descPagos)}</span></div>`);

    (d.extras||[]).forEach(e=>
      partes.push(`<div class="fila"><span>+ ${esc(e.concepto)}</span><span class="der">${fmt(e.monto)}</span></div>`));

    const totalCobrado=d.ingresado + Math.max(d.saldo,0);
    partes.push(`<div class="fila total"><span>TOTAL</span><span class="der">${fmt(totalCobrado)}</span></div>`);

    if(d.pagos.length){
      partes.push('<hr class="sep">');
      d.pagos.forEach(p=>{
        const f=new Date(p.fecha.endsWith("Z")?p.fecha:p.fecha+"Z").toLocaleDateString("es-AR");
        const fp=p.forma_pago ? ` (${p.forma_pago}${p.alias?" · "+p.alias:""})` : "";
        partes.push(`<div class="fila tenue"><span>Recibido ${f}${fp}</span><span class="der">${fmt(p.monto)}</span></div>`);
      });
    }
    if(d.saldo>0) partes.push(`<div class="fila pend"><span>PENDIENTE</span><span class="der">${fmt(d.saldo)}</span></div>`);
  }

  partes.push(`<div class="c gracias">¡Gracias por su visita! ✂</div>`);
  partes.push('<hr class="sep">');
  partes.push(`<div class="c legal">${LEGAL_TXT}</div>`);
  partes.push('<hr class="sep">');       // la línea que cierra el papel
  $("#papel").innerHTML=partes.join("");
}

/* ---------- vista previa de cuenta corriente ---------- */
function renderCuenta(){
  const c=CUENTA.cliente, comps=CUENTA.comprobantes;
  const conDeuda=comps.filter(x=>x.saldo>0).slice(0,20);
  const partes=[];

  partes.push(`<div class="c marca">${esc(NEGOCIO.nombre||"")}</div>`);
  const datos=[NEGOCIO.direccion, NEGOCIO.telefono&&("Tel: "+NEGOCIO.telefono), NEGOCIO.instagram].filter(Boolean);
  if(datos.length) partes.push(`<div class="c chico">${datos.map(esc).join("<br>")}</div>`);

  partes.push('<hr class="sep">');
  partes.push(`<div class="c" style="font-weight:700;font-size:14px;">CUENTA CORRIENTE</div>`);
  const ahora=new Date();
  partes.push(`<div class="fila chico"><span>Cliente: ${esc(c.nombre)}</span><span class="der">${ahora.toLocaleDateString("es-AR")}</span></div>`);
  partes.push('<hr class="sep">');

  if(conDeuda.length===0){
    partes.push(`<div class="c tenue">Sin deuda pendiente.</div>`);
  } else {
    partes.push('<table><tr><th>Servicio</th><th>Total</th><th>Pagado</th><th>Saldo</th></tr>');
    conDeuda.forEach(comp=>{
      const f=new Date(comp.fecha).toLocaleDateString("es-AR");
      partes.push(`<tr>
        <td>N-${String(comp.numero).padStart(5,"0")}<br><span class="tenue" style="font-size:10px;">${f}</span></td>
        <td class="precio">${fmt(comp.total_final)}</td>
        <td class="precio">${fmt(comp.pagado)}</td>
        <td class="precio" style="font-weight:700;">${fmt(comp.saldo)}</td>
      </tr>`);
    });
    partes.push('</table>');
  }
  partes.push('<hr class="sep">');
  partes.push(`<div class="fila total"><span>SALDO TOTAL</span><span class="der">${fmt(CUENTA.saldo_total)}</span></div>`);
  if(conDeuda.length<comps.filter(x=>x.saldo>0).length){
    partes.push(`<div class="c tenue chico">Mostrando los primeros 20 servicios con deuda.</div>`);
  }
  partes.push('<hr class="sep">');
  partes.push(`<div class="c legal">${LEGAL_TXT}</div>`);
  $("#papel").innerHTML=partes.join("");
}

/* ---------- ESC/POS para la comandera ----------
   El generador vive en /static/escpos.js, compartido con facturar, que imprime
   solo al terminar de cobrar. Acá quedó únicamente el botón. */

/* ---------- imprimir ---------- */
// La comandera se maneja con la app RawBT (Play Store): recibe los bytes ESC/POS
// por el esquema rawbt: y los manda por Bluetooth a la impresora.
$("#btnComandera").onclick=()=>{
  if(!COMP && !CUENTA) return;
  try{
    const bytes = CUENTA ? EscPos.deCuenta(CUENTA, NEGOCIO) : EscPos.deComprobante(COMP, NEGOCIO);
    location.href = EscPos.urlRawbt(bytes);
    toast("Enviado a la comandera (RawBT)");
  }catch(e){ toast("No se pudo generar la impresión"); }
};
$("#btnNavegador").onclick=()=>window.print();

init();
</script>
</body></html>
