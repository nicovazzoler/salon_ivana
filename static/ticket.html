<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f2ece0"><title>Ticket — Peluquería</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/tema.js"></script>
<style>
  .wrap{ max-width:460px; }

  /* --- barra de acciones --- */
  .acciones{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .acciones .volver{
    padding:10px 14px;
    background:var(--bg-sutil);
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-imprimir{ flex:1; padding:12px; font-size:15px; }
  .btn-navegador{
    padding:10px 14px;
    background:var(--bg-card);
    border:1px solid var(--acento);
    color:var(--text);
  }

  /* --- papel: simula el rollo de 80mm --- */
  .papel{
    width:100%; max-width:340px;          /* ~80mm en pantalla */
    margin:0 auto;
    padding:18px 14px 26px;
    background:#fdfdf8;
    color:#1a1a1a;
    font-family:"Courier New", ui-monospace, monospace;
    font-size:12.5px;
    line-height:1.45;
    border-radius:4px 4px 0 0;
    box-shadow:var(--sombra-card);
    /* borde dentado abajo, como ticket cortado */
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 7px),
      97.5% 100%, 95% calc(100% - 7px), 92.5% 100%, 90% calc(100% - 7px),
      87.5% 100%, 85% calc(100% - 7px), 82.5% 100%, 80% calc(100% - 7px),
      77.5% 100%, 75% calc(100% - 7px), 72.5% 100%, 70% calc(100% - 7px),
      67.5% 100%, 65% calc(100% - 7px), 62.5% 100%, 60% calc(100% - 7px),
      57.5% 100%, 55% calc(100% - 7px), 52.5% 100%, 50% calc(100% - 7px),
      47.5% 100%, 45% calc(100% - 7px), 42.5% 100%, 40% calc(100% - 7px),
      37.5% 100%, 35% calc(100% - 7px), 32.5% 100%, 30% calc(100% - 7px),
      27.5% 100%, 25% calc(100% - 7px), 22.5% 100%, 20% calc(100% - 7px),
      17.5% 100%, 15% calc(100% - 7px), 12.5% 100%, 10% calc(100% - 7px),
      7.5% 100%, 5% calc(100% - 7px), 2.5% 100%, 0 calc(100% - 7px));
  }
  /* el papel pisa los estilos oscuros globales de la app (table, th, .fila...) */
  .papel .c{ text-align:center; }
  .papel .marca{ font-size:18px; font-weight:700; letter-spacing:1px; }
  .papel .chico{ font-size:11px; color:#555; }
  .papel .sep{ border:none; border-top:1px dashed #999; margin:8px 0; }
  .papel .fila{ display:flex; flex-wrap:nowrap; justify-content:space-between; gap:8px; margin:2px 0; color:inherit; }
  .papel .fila .der{ white-space:nowrap; }
  .papel .fila.tenue{ color:#666; }
  .papel .fila.total{ font-weight:700; font-size:15px; margin-top:4px; }
  .papel .fila.pend{ font-weight:700; }
  .papel table{ width:100%; border-collapse:collapse; color:inherit; font-size:inherit; }
  .papel th{ text-align:right; font-size:11px; color:#555; font-weight:400;
             text-transform:none; letter-spacing:0; background:none;
             padding:0 0 2px; border-bottom:none; }
  .papel th:first-child{ text-align:left; }
  .papel td{ vertical-align:top; padding:1px 0; color:inherit; border-bottom:none; font-size:inherit; }
  .papel td.precio{ text-align:right; white-space:nowrap; padding-left:8px; }
  .papel .gracias{ margin-top:12px; }

  #estado{ margin:20px 0; text-align:center; }

  /* --- impresión desde el navegador: solo el papel, en 80mm --- */
  @media print{
    @page{ size:80mm auto; margin:0; }
    body{ background:#fff; }
    header, .acciones, #estado, .toast{ display:none !important; }
    .wrap{ max-width:none; margin:0; padding:0; }
    .papel{
      max-width:none; width:72mm; margin:0; padding:4mm 2mm;
      box-shadow:none; border-radius:0; clip-path:none;
    }
  }
</style>
</head><body>
<header>
  <span>🧾 Ticket</span>
  <nav class="menu"></nav>
</header>
<div class="wrap">
  <div class="acciones">
    <button class="volver" onclick="history.length>1?history.back():location.href='/historial'">← Volver</button>
    <button class="btn-imprimir" id="btnComandera">🖨️ Imprimir</button>
    <button class="btn-navegador" id="btnNavegador" title="Imprimir con el diálogo del navegador">PDF</button>
  </div>
  <div id="estado" class="muted">Cargando…</div>
  <div class="papel" id="papel" style="display:none;"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/auth.js"></script>
<script>
requireLogin(); pintarNav();
const $=s=>document.querySelector(s);
const fmt=n=>"$"+(n||0).toLocaleString("es-AR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}

/* En el ticket impreso NUNCA se usa la palabra "efectivo":
   la lista transferencia es "Lista" y la lista efectivo es "Descuento". */

let COMP=null, NEGOCIO={}, CUENTA=null;

function numComp(t,n){ return (t==="ticket"?"N-":"P-")+String(n).padStart(5,"0"); }
function fechaLocal(iso){
  // el backend guarda UTC sin zona: agregamos la Z para que el dispositivo la convierta
  const d=new Date(iso.endsWith("Z")?iso:iso+"Z");
  return d.toLocaleDateString("es-AR")+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false});
}

async function init(){
  const params=new URLSearchParams(location.search);
  const id=params.get("id");
  const tipoPag=params.get("tipo");
  const clienteId=params.get("cliente");

  try{
    const cfg=await (await authFetch("/api/config")).json();
    NEGOCIO=cfg.negocio||{};
  }catch(e){ $("#estado").textContent="No se pudo cargar config."; return; }

  if(tipoPag==="cuenta" && clienteId){
    try{
      const r=await authFetch("/api/clientes/"+clienteId+"/cuenta");
      if(!r.ok){ $("#estado").textContent="No se encontró el cliente."; return; }
      CUENTA=await r.json();
    }catch(e){ $("#estado").textContent="No se pudo cargar la cuenta."; return; }
    renderCuenta();
  } else if(id){
    try{
      const r=await authFetch("/api/comprobantes/"+id);
      if(!r.ok){ $("#estado").textContent="No se encontró el comprobante."; return; }
      COMP=await r.json();
    }catch(e){ $("#estado").textContent="No se pudo cargar."; return; }
    render();
  } else {
    $("#estado").textContent="Falta el numero de comprobante (?id=...)"; return;
  }
  $("#estado").style.display="none";
  $("#papel").style.display="block";
}

/* Precios unitarios de una línea, ya con su ajuste aplicado. El backend los manda
   calculados; el fallback es por si el comprobante viene de una versión anterior. */
const pu = l => l.precio_unit_final     ?? l.precio_unit     ?? 0;
const pe = l => l.precio_efectivo_final ?? l.precio_efectivo ?? 0;

/* Renglón que explica el ajuste de una línea: cuánto era y cuánto quedó por unidad. */
function filaAjuste(l){
  const desc = l.ajuste_pct < 0;
  const etiqueta = (l.ajuste_nombre ? esc(l.ajuste_nombre) : (desc ? "Descuento" : "Recargo"))
                 + ` ${desc?"−":"+"}${Math.abs(l.ajuste_pct)}%`;
  return `<div class="fila tenue" style="padding-left:10px;">
    <span>↳ ${etiqueta}</span>
    <span class="der">${fmt(l.precio_unit)} → ${fmt(pu(l))} c/u</span></div>`;
}

/* ---------- vista previa HTML (espejo de lo que sale por la comandera) ---------- */
function render(){
  const d=COMP, esPresu=d.tipo==="presupuesto";
  const partes=[];

  // encabezado del negocio (los campos vacíos no salen)
  partes.push(`<div class="c marca">${esc(NEGOCIO.nombre||"")}</div>`);
  const datos=[NEGOCIO.direccion, NEGOCIO.telefono&&("Tel: "+NEGOCIO.telefono), NEGOCIO.instagram].filter(Boolean);
  if(datos.length) partes.push(`<div class="c chico">${datos.map(esc).join("<br>")}</div>`);

  partes.push('<hr class="sep">');
  partes.push(`<div class="fila"><span>${esPresu?"PRESUPUESTO":"COMPROBANTE"} <b>${numComp(d.tipo,d.numero)}</b></span><span class="der chico">${fechaLocal(d.fecha)}</span></div>`);
  if(d.cliente_nombre) partes.push(`<div class="fila chico"><span>Cliente: ${esc(d.cliente_nombre)}</span></div>`);
  partes.push('<hr class="sep">');

  if(esPresu){
    // presupuesto: las dos listas de precios, columna por columna
    partes.push('<table><tr><th>Detalle</th><th>Lista</th><th>Con descuento</th></tr>');
    d.lineas.forEach(l=>{
      partes.push(`<tr><td>${l.cantidad}× ${esc(l.nombre)}${l.dificultad?" *":""}</td>
        <td class="precio">${fmt(pu(l)*l.cantidad)}</td>
        <td class="precio">${fmt(pe(l)*l.cantidad)}</td></tr>`);
      // el ajuste de la línea se detalla abajo, con el precio de lista original
      if(l.ajuste_pct) partes.push(filaAjuste(l));
    });
    partes.push('</table>');
    if(d.extra_dificultad>0) partes.push(`<div class="fila tenue"><span>* Extra dificultad</span><span class="der">+${fmt(d.extra_dificultad)}</span></div>`);
    partes.push('<hr class="sep">');

    const extra=d.extra_dificultad||0;
    let totLista=d.lineas.reduce((a,l)=>a+pu(l)*l.cantidad,0)+extra;
    let totPromo=d.lineas.reduce((a,l)=>a+pe(l)*l.cantidad,0)+extra;
    if(d.descuento_pct>0){
      partes.push(`<div class="fila tenue"><span>${esc(d.descuento_nombre||"Descuento")} ${d.descuento_pct}%</span><span class="der">aplicado</span></div>`);
      totLista=Math.round(totLista*(100-d.descuento_pct)/100);
      totPromo=Math.round(totPromo*(100-d.descuento_pct)/100);
    }
    // Los extras van despues del descuento: no los toca
    (d.extras||[]).forEach(e=>{
      partes.push(`<div class="fila"><span>+ ${esc(e.concepto)}</span><span class="der">${fmt(e.monto)}</span></div>`);
      totLista+=e.monto; totPromo+=e.monto;
    });
    partes.push(`<div class="fila total"><span>Total lista</span><span class="der">${fmt(totLista)}</span></div>`);
    partes.push(`<div class="fila total"><span>Total con descuento</span><span class="der">${fmt(totPromo)}</span></div>`);
    partes.push(`<div class="c chico" style="margin-top:8px;">Presupuesto sin valor fiscal.<br>Precios sujetos a cambio sin previo aviso.</div>`);
  } else {
    // ticket de venta: precios de lista + descuentos aplicados
    d.lineas.forEach(l=>{
      partes.push(`<div class="fila"><span>${l.cantidad}× ${esc(l.nombre)}${l.dificultad?" *":""}</span><span class="der">${fmt(pu(l)*l.cantidad)}</span></div>`);
      if(l.ajuste_pct) partes.push(filaAjuste(l));
    });
    if(d.extra_dificultad>0) partes.push(`<div class="fila tenue"><span>* Extra dificultad</span><span class="der">+${fmt(d.extra_dificultad)}</span></div>`);
    partes.push('<hr class="sep">');

    /* Subtotal antes de cualquier descuento. Se suma de los mismos renglones
       que se acaban de imprimir, no de un campo aparte: así la cuenta cierra a
       ojo sobre el papel. */
    const subtotal = d.lineas.reduce((a,l)=>a+pu(l)*l.cantidad,0) + (d.extra_dificultad||0);
    const hayDesc = d.desc_efectivo>0 || d.desc_jubilado>0
                 || d.pagos.reduce((a,p)=>a+(p.desc_aplicado||0),0)>0;
    if(hayDesc) partes.push(`<div class="fila"><span>Subtotal</span><span class="der">${fmt(subtotal)}</span></div>`);

    if(d.desc_efectivo>0){
      const pct=(d.desc_efectivo/d.total_transfer*100).toFixed(2);
      partes.push(`<div class="fila tenue"><span>Descuento ${pct}%</span><span class="der">−${fmt(d.desc_efectivo)}</span></div>`);
    }
    if(d.desc_jubilado>0){
      partes.push(`<div class="fila tenue"><span>${esc(d.descuento_nombre||"Descuento")} ${d.descuento_pct}%</span><span class="der">−${fmt(d.desc_jubilado)}</span></div>`);
    }
    // descuento hecho al momento de pagar (ej: abonó en promo una deuda)
    const descPagos=d.pagos.reduce((a,p)=>a+(p.desc_aplicado||0),0);
    if(descPagos>0) partes.push(`<div class="fila tenue"><span>Descuento (al abonar)</span><span class="der">−${fmt(descPagos)}</span></div>`);

    (d.extras||[]).forEach(e=>
      partes.push(`<div class="fila"><span>+ ${esc(e.concepto)}</span><span class="der">${fmt(e.monto)}</span></div>`));

    const totalCobrado=d.ingresado + Math.max(d.saldo,0);
    partes.push(`<div class="fila total"><span>TOTAL</span><span class="der">${fmt(totalCobrado)}</span></div>`);

    if(d.pagos.length){
      partes.push('<hr class="sep">');
      d.pagos.forEach(p=>{
        const f=new Date(p.fecha.endsWith("Z")?p.fecha:p.fecha+"Z").toLocaleDateString("es-AR");
        const fp=p.forma_pago ? ` (${p.forma_pago}${p.alias?" · "+p.alias:""})` : "";
        partes.push(`<div class="fila tenue"><span>Recibido ${f}${fp}</span><span class="der">${fmt(p.monto)}</span></div>`);
      });
    }
    if(d.saldo>0) partes.push(`<div class="fila pend"><span>PENDIENTE</span><span class="der">${fmt(d.saldo)}</span></div>`);
  }

  if(!esPresu) partes.push(`<div class="c chico" style="margin-top:8px;">Documento no válido como factura.</div>`);
  partes.push(`<div class="c gracias">¡Gracias por su visita! ✂</div>`);
  $("#papel").innerHTML=partes.join("");
}

/* ---------- vista previa de cuenta corriente ---------- */
function renderCuenta(){
  const c=CUENTA.cliente, comps=CUENTA.comprobantes;
  const conDeuda=comps.filter(x=>x.saldo>0).slice(0,20);
  const partes=[];

  partes.push(`<div class="c marca">${esc(NEGOCIO.nombre||"")}</div>`);
  const datos=[NEGOCIO.direccion, NEGOCIO.telefono&&("Tel: "+NEGOCIO.telefono), NEGOCIO.instagram].filter(Boolean);
  if(datos.length) partes.push(`<div class="c chico">${datos.map(esc).join("<br>")}</div>`);

  partes.push('<hr class="sep">');
  partes.push(`<div class="c" style="font-weight:700;font-size:14px;">CUENTA CORRIENTE</div>`);
  const ahora=new Date();
  partes.push(`<div class="fila chico"><span>Cliente: ${esc(c.nombre)}</span><span class="der">${ahora.toLocaleDateString("es-AR")}</span></div>`);
  partes.push('<hr class="sep">');

  if(conDeuda.length===0){
    partes.push(`<div class="c tenue">Sin deuda pendiente.</div>`);
  } else {
    partes.push('<table><tr><th>Comprobante</th><th>Total</th><th>Pagado</th><th>Saldo</th></tr>');
    conDeuda.forEach(comp=>{
      const f=new Date(comp.fecha).toLocaleDateString("es-AR");
      partes.push(`<tr>
        <td>N-${String(comp.numero).padStart(5,"0")}<br><span class="tenue" style="font-size:10px;">${f}</span></td>
        <td class="precio">${fmt(comp.total_final)}</td>
        <td class="precio">${fmt(comp.pagado)}</td>
        <td class="precio" style="font-weight:700;">${fmt(comp.saldo)}</td>
      </tr>`);
    });
    partes.push('</table>');
  }
  partes.push('<hr class="sep">');
  partes.push(`<div class="fila total"><span>SALDO TOTAL</span><span class="der">${fmt(CUENTA.saldo_total)}</span></div>`);
  if(conDeuda.length<comps.filter(x=>x.saldo>0).length){
    partes.push(`<div class="c tenue chico">Mostrando los primeros 20 comprobantes con deuda.</div>`);
  }
  partes.push(`<div class="c chico" style="margin-top:8px;">Comprobante sin valor fiscal.</div>`);
  $("#papel").innerHTML=partes.join("");
}

/* ---------- ESC/POS para la comandera (80mm = 48 columnas) ---------- */
const ANCHO=48;

/* ---------- acentos en la comandera ----------

   La comandera no habla UTF-8: trabaja con una tabla de 256 caracteres, y la
   que trae de fábrica es ASCII. Si le mandás la "ó" de "Salón" en crudo,
   imprime un símbolo cualquiera; por eso antes se mandaba todo sin tildes.

   ESC/POS permite cambiarle la tabla: "ESC t 2" selecciona CP850
   (multilingüe), que tiene todos los acentos del español. Es la tabla más
   estándar y la soportan tanto las Epson como los clones genéricos.

   Si esta unidad no la soportara, las palabras con tilde saldrían con
   símbolos raros. En ese caso poné ACENTOS en false: vuelve a imprimir sin
   tildes, que es más feo pero se lee siempre. */
const ACENTOS = true;
const CP850 = { "á":0xA0,"é":0x82,"í":0xA1,"ó":0xA2,"ú":0xA3,
                "Á":0xB5,"É":0x90,"Í":0xD6,"Ó":0xE0,"Ú":0xE9,
                "ñ":0xA4,"Ñ":0xA5,"ü":0x81,"Ü":0x9A,
                "¿":0xA8,"¡":0xAD,"°":0xF8,"ª":0xA6,"º":0xA7 };
// un carácter -> su byte en la tabla de la comandera
const byteDe = ch => (ACENTOS && CP850[ch] !== undefined) ? CP850[ch] : ch.charCodeAt(0);

/* Deja solo lo que la comandera puede imprimir. IMPORTANTE: devuelve UN
   carácter por posición, nunca dos, porque de este largo dependen todas las
   columnas. Cada acentuado ocupa un byte en CP850, así que la cuenta da igual
   con acentos o sin ellos. */
function translit(s){
  if(!ACENTOS)
    return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[×]/g,"x").replace(/[−–—]/g,"-").replace(/[·]/g,"-")
    .replace(/[“”]/g,'"').replace(/[’‘]/g,"'").replace(/[✂✓]/g,"")
    .replace(/[^\x20-\x7e\n]/g,"");
  return String(s)
    .replace(/[×]/g,"x").replace(/[−–—]/g,"-").replace(/[·]/g,"-")
    .replace(/[“”]/g,'"').replace(/[’‘]/g,"'").replace(/[✂✓]/g,"")
    .replace(/[^\x20-\x7e\n]/g, c => (c in CP850) ? c : "");
}
function fmtP(n){ return "$"+(n||0).toLocaleString("es-AR"); }
function fila2(izq,der,w=ANCHO){
  izq=translit(izq); der=translit(der);
  const max=w-der.length-1;
  if(izq.length>max) izq=izq.slice(0,max);
  return izq+" ".repeat(w-izq.length-der.length)+der;
}

/* Corta un texto en renglones del ancho del papel SIN partir palabras.
   El papel tiene 48 columnas: los nombres largos hay que bajarlos de renglón,
   no recortarlos, o se pierde parte del nombre (y marcas como el * de dificultad). */
function envolver(txt, w=ANCHO){
  const palabras = translit(txt).split(/\s+/).filter(Boolean);
  const lineas = []; let actual = "";
  palabras.forEach(pal => {
    if(!actual){ actual = pal; return; }
    if((actual + " " + pal).length <= w) actual += " " + pal;
    else { lineas.push(actual); actual = pal; }
  });
  if(actual) lineas.push(actual);
  // una sola palabra más larga que el papel: ahí sí no queda otra que cortarla
  return lineas.flatMap(l => l.length <= w ? [l] : (l.match(new RegExp(`.{1,${w}}`,"g")) || [l]));
}

/* Renglón de ítem: el nombre envuelve y el precio se pega a la derecha del
   último renglón; si no entra, el precio baja a un renglón propio. */
function filaItem(etiqueta, precio, w=ANCHO){
  const der = translit(precio);
  const lineas = envolver(etiqueta, w);
  const ultima = lineas[lineas.length-1];
  if(ultima.length + der.length + 1 <= w){
    lineas[lineas.length-1] = ultima + " ".repeat(w - ultima.length - der.length) + der;
  } else {
    lineas.push(" ".repeat(Math.max(0, w - der.length)) + der);
  }
  return lineas;
}

function fila3(a,b,c){                       // detalle | lista | con desc. (26+11+11)
  a=translit(a); b=translit(b); c=translit(c);
  if(a.length>26) a=a.slice(0,26);
  return a+" ".repeat(26-a.length)+b.padStart(11)+c.padStart(11);
}

/* Fila de 3 columnas cuyo detalle no entra en 26: el nombre sigue abajo,
   sangrado, en vez de quedar cortado a la mitad. */
function fila3Larga(a,b,c){
  const partes = envolver(a, 26);
  const salida = [fila3(partes[0], b, c)];
  partes.slice(1).forEach(p => salida.push("  " + p));
  return salida;
}

/* Renglón del ajuste de una línea, para la comandera.

   El porcentaje NO se puede recortar. Con fila2, que corta por la derecha lo de
   la izquierda, un nombre de ajuste medianamente largo se comía el número:
   "Cliente frecuente -10%" salía "Cliente frecuente -1" y el ticket del cliente
   decía 1% en vez de 10%. Un nombre cortado se ve; un porcentaje cortado se lee
   como si fuera otro.

   filaItem envuelve la etiqueta y baja los precios a un renglón propio si no
   entran, sin recortar nada. Se sangra 2 para que el "> " marque que el ajuste
   es de la línea de arriba, y por eso se envuelve contra ANCHO-2. */
function lineaAjuste(l){
  const desc = l.ajuste_pct < 0;
  const etiqueta = (l.ajuste_nombre || (desc ? "Descuento" : "Recargo"))
                 + ` ${desc?"-":"+"}${Math.abs(l.ajuste_pct)}%`;
  const precios = fmtP(l.precio_unit)+" > "+fmtP(pu(l))+" c/u";
  return filaItem("> "+etiqueta, precios, ANCHO-2).map(x => "  "+x);
}

/* Un renglón de la tabla de la cuenta corriente, con los anchos que calculó
   anchosCuenta(). La etiqueta se recorta si hace falta; los importes no, nunca. */
function fila4(etiqueta, b, c, d_, an){
  let a = translit(etiqueta);
  if(a.length > an.etiqueta) a = a.slice(0, an.etiqueta);
  return a + " ".repeat(an.etiqueta - a.length)
       + translit(b).padStart(ANCHO - an.etiqueta - 2*an.monto)
       + translit(c).padStart(an.monto)
       + translit(d_).padStart(an.monto);
}

function fechaCorta(fecha){          // 27/8/26
  const f=new Date(fecha);
  return f.getDate()+"/"+(f.getMonth()+1)+"/"+String(f.getFullYear()).slice(-2);
}
function fechaSinAnio(fecha){        // 27/8
  const f=new Date(fecha);
  return f.getDate()+"/"+(f.getMonth()+1);
}

/* Cuánto mide cada columna de la cuenta corriente.

   Los importes NO se recortan nunca: un número mal impreso en la cuenta de un
   cliente es mucho peor que una fecha corta. Así que se miden los importes de
   ESTA cuenta, las tres columnas de plata se llevan lo que necesitan y el
   comprobante se queda con el resto. Se calcula una sola vez para toda la
   tabla; si se hiciera por renglón, las columnas bailarían.

   Si no entra, se cede de a poco y siempre del lado de la etiqueta: primero el
   "N-" (la columna ya se llama "Comprobante" y son todos del mismo tipo) y
   final el año. Con el año entero "A-00024 27/8/2026" mide 17 contra 16 de
   columna, y el ticket del cliente salía diciendo "27/8/202". */
function anchosCuenta(comps){
  const montos = comps.flatMap(c=>[fmtP(c.total_final), fmtP(c.pagado), fmtP(c.saldo)]);
  const monto = Math.max(9, ...montos.map(m=>m.length+1));   // +1 de aire entre columnas
  const etiqueta = ANCHO - 3*monto;

  const formatos = [
    c => "N-"+String(c.numero).padStart(5,"0")+" "+fechaCorta(c.fecha),
    c =>      String(c.numero).padStart(5,"0")+" "+fechaCorta(c.fecha),
    c =>      String(c.numero).padStart(5,"0")+" "+fechaSinAnio(c.fecha),
  ];
  const fmt = formatos.find(f => comps.every(c => f(c).length <= etiqueta))
           || formatos[formatos.length-1];
  return {monto, etiqueta, fmt};
}

function generarEscpos(){
  if(CUENTA) return generarEscposCuenta();
  const d=COMP, esPresu=d.tipo==="presupuesto";
  const B=[];
  const raw=(...x)=>B.push(...x);
  const txt=s=>{ for(const ch of translit(s)) B.push(byteDe(ch)); };
  const lin=(s="")=>{ txt(s); raw(10); };
  const centro=on=>raw(0x1b,0x61,on?1:0);
  const negrita=on=>raw(0x1b,0x45,on?1:0);
  const grande=on=>raw(0x1d,0x21,on?0x11:0x00);
  const sep=()=>lin("-".repeat(ANCHO));

  raw(0x1b,0x40);                            // reset
  if(ACENTOS) raw(0x1b,0x74,2);              // tabla CP850: acentos del español
  centro(true);
  grande(true); negrita(true); lin(NEGOCIO.nombre||""); negrita(false); grande(false);
  [NEGOCIO.direccion, NEGOCIO.telefono&&("Tel: "+NEGOCIO.telefono), NEGOCIO.instagram]
    .filter(Boolean).forEach(x=>lin(x));
  centro(false);
  sep();
  lin(fila2((esPresu?"PRESUPUESTO ":"COMPROBANTE ")+numComp(d.tipo,d.numero), fechaLocal(d.fecha)));
  // El peluquero NO va en el papel: es dato interno. Se sigue guardando en el
  // comprobante y se ve en historial y en la cuenta, pero no en lo que se
  // entrega al cliente.
  if(d.cliente_nombre) envolver("Cliente: "+d.cliente_nombre).forEach(lin);
  sep();

  if(esPresu){
    lin(fila3("Detalle","Lista","C/desc."));
    d.lineas.forEach(l=>{
      fila3Larga(l.cantidad+"x "+l.nombre+(l.dificultad?" *":""),
                 fmtP(pu(l)*l.cantidad), fmtP(pe(l)*l.cantidad)).forEach(lin);
      if(l.ajuste_pct) lineaAjuste(l).forEach(lin);
    });
    if(d.extra_dificultad>0) lin(fila2("* Extra dificultad","+"+fmtP(d.extra_dificultad)));
    sep();
    const extra=d.extra_dificultad||0;
    let totLista=d.lineas.reduce((a,l)=>a+pu(l)*l.cantidad,0)+extra;
    let totPromo=d.lineas.reduce((a,l)=>a+pe(l)*l.cantidad,0)+extra;
    if(d.descuento_pct>0){
      lin(fila2((d.descuento_nombre||"Descuento")+" "+d.descuento_pct+"%","aplicado"));
      totLista=Math.round(totLista*(100-d.descuento_pct)/100);
      totPromo=Math.round(totPromo*(100-d.descuento_pct)/100);
    }
    (d.extras||[]).forEach(e=>{
      filaItem("+ "+e.concepto, fmtP(e.monto)).forEach(lin);
      totLista+=e.monto; totPromo+=e.monto;
    });
    negrita(true);
    lin(fila2("Total lista",fmtP(totLista)));
    lin(fila2("Total con descuento",fmtP(totPromo)));
    negrita(false);
    lin(); centro(true);
    lin("Presupuesto sin valor fiscal.");
    lin("Precios sujetos a cambio sin previo aviso.");
    centro(false);
  } else {
    d.lineas.forEach(l=>{
      filaItem(l.cantidad+"x "+l.nombre+(l.dificultad?" *":""), fmtP(pu(l)*l.cantidad)).forEach(lin);
      if(l.ajuste_pct) lineaAjuste(l).forEach(lin);
    });
    if(d.extra_dificultad>0) lin(fila2("* Extra dificultad","+"+fmtP(d.extra_dificultad)));
    sep();
    // Subtotal antes de descuentos, sumado de los renglones de arriba
    const subtotal = d.lineas.reduce((a,l)=>a+pu(l)*l.cantidad,0) + (d.extra_dificultad||0);
    const hayDesc = d.desc_efectivo>0 || d.desc_jubilado>0
                 || d.pagos.reduce((a,p)=>a+(p.desc_aplicado||0),0)>0;
    if(hayDesc) lin(fila2("Subtotal", fmtP(subtotal)));
    if(d.desc_efectivo>0) lin(fila2("Descuento "+(d.desc_efectivo/d.total_transfer*100).toFixed(2)+"%","-"+fmtP(d.desc_efectivo)));
    if(d.desc_jubilado>0) lin(fila2((d.descuento_nombre||"Descuento")+" "+d.descuento_pct+"%","-"+fmtP(d.desc_jubilado)));
    const descPagos=d.pagos.reduce((a,p)=>a+(p.desc_aplicado||0),0);
    if(descPagos>0) lin(fila2("Descuento (al abonar)","-"+fmtP(descPagos)));
    (d.extras||[]).forEach(e=>filaItem("+ "+e.concepto, fmtP(e.monto)).forEach(lin));
    negrita(true); grande(true);
    lin(fila2("TOTAL",fmtP(d.ingresado+Math.max(d.saldo,0)),24));   // 24 cols: la letra es doble ancho
    grande(false); negrita(false);
    if(d.pagos.length){
      sep();
      d.pagos.forEach(p=>{
        const f=new Date(p.fecha.endsWith("Z")?p.fecha:p.fecha+"Z").toLocaleDateString("es-AR");
        const fp=p.forma_pago ? " ("+p.forma_pago+")" : "";
        lin(fila2("Recibido "+f+fp, fmtP(p.monto)));
      });
    }
    if(d.saldo>0){ negrita(true); lin(fila2("PENDIENTE",fmtP(d.saldo))); negrita(false); }
  }

  lin(); centro(true);
  if(!esPresu) lin("Documento no válido como factura.");
  lin("¡Gracias por su visita!"); centro(false);
  raw(0x1b,0x64,4);                          // avanzar papel
  raw(0x1d,0x56,0x42,0x00);                  // corte parcial (si la comandera tiene cortador)
  return new Uint8Array(B);
}

function generarEscposCuenta(){
  const c=CUENTA.cliente, comps=CUENTA.comprobantes;
  const conDeuda=comps.filter(x=>x.saldo>0).slice(0,20);
  const B=[];
  const raw=(...x)=>B.push(...x);
  const txt=s=>{ for(const ch of translit(s)) B.push(byteDe(ch)); };
  const lin=(s="")=>{ txt(s); raw(10); };
  const centro=on=>raw(0x1b,0x61,on?1:0);
  const negrita=on=>raw(0x1b,0x45,on?1:0);
  const grande=on=>raw(0x1d,0x21,on?0x11:0x00);
  const sep=()=>lin("-".repeat(ANCHO));

  raw(0x1b,0x40);
  if(ACENTOS) raw(0x1b,0x74,2);              // tabla CP850: acentos del español
  centro(true);
  grande(true); negrita(true); lin(NEGOCIO.nombre||""); negrita(false); grande(false);
  [NEGOCIO.direccion, NEGOCIO.telefono&&("Tel: "+NEGOCIO.telefono), NEGOCIO.instagram]
    .filter(Boolean).forEach(x=>lin(x));
  centro(false);
  sep();
  centro(true); negrita(true); lin("CUENTA CORRIENTE"); negrita(false); centro(false);
  const ahora=new Date();
  lin(fila2("Cliente: "+c.nombre, ahora.toLocaleDateString("es-AR")));
  sep();

  if(conDeuda.length===0){
    lin("Sin deuda pendiente.");
  } else {
    const an = anchosCuenta(conDeuda);
    lin(fila4("Comprobante","Total","Pagado","Saldo", an));
    sep();
    conDeuda.forEach(comp=>{
      lin(fila4(an.fmt(comp), fmtP(comp.total_final), fmtP(comp.pagado), fmtP(comp.saldo), an));
    });
  }
  sep();
  negrita(true); grande(true);
  lin(fila2("SALDO TOTAL",fmtP(CUENTA.saldo_total),24));
  grande(false); negrita(false);
  lin(); centro(true); lin("Comprobante sin valor fiscal."); centro(false);
  raw(0x1b,0x64,4);
  raw(0x1d,0x56,0x42,0x00);
  return new Uint8Array(B);
}

/* ---------- imprimir ---------- */
// La comandera se maneja con la app RawBT (Play Store): recibe los bytes ESC/POS
// por el esquema rawbt: y los manda por Bluetooth a la impresora.
$("#btnComandera").onclick=()=>{
  if(!COMP && !CUENTA) return;
  try{
    const bytes=generarEscpos();
    let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b));
    location.href="rawbt:base64,"+btoa(bin);
    toast("Enviado a la comandera (RawBT)");
  }catch(e){ toast("No se pudo generar la impresión"); }
};
$("#btnNavegador").onclick=()=>window.print();

init();
</script>
